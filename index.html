<script>/* 剪贴板兜底：writeText 在失焦/无权限时抛 NotAllowedError（未捕获会进 console），统一降级到 execCommand */
(function(){
  try{
    var c = navigator.clipboard;
    if(!c || !c.writeText) return;
    var orig = c.writeText.bind(c);
    c.writeText = function(t){
      return orig(t).catch(function(){
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly','');
        ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, ta.value.length);
        var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
        ta.remove();
        if(!ok){ try{ window.prompt('复制失败，请手动复制：', t); }catch(e){} }   // 兜底：绝不抛未捕获异常
      });
    };
  }catch(e){}
})();</script>

<title>Vernier · 分毫</title>
<script>
/* 首屏预置：主题与语言先于 CSS 生效，防闪烁 */
try{
  // 自动昼夜：手动选过（themeUser=1）就用存储值；否则按本地时间算，且不写存储
  var manual=localStorage.getItem('cs2at.themeUser')==='1';
  var t=null;
  if(manual) t=localStorage.getItem('cs2at.theme');
  if(!t){
    var d=new Date(), tm=d.getHours()+d.getMinutes()/60;
    t=(tm>=6.5 && tm<18.5)?'sand':'forest';     // 06:30–18:30 明亮，其余夜间
  }
  document.documentElement.setAttribute('data-theme',t);
  var l=localStorage.getItem('cs2at.lang');
  if(l) document.documentElement.setAttribute('lang',l==='en'?'en':'zh-CN');
}catch(e){}
</script>
<script>
/* --on-acc 自适应：按强调色亮度自动选黑/白，修「白字压亮绿 1.74:1」的老问题 */
(function(){
  function relLum(c){
    var m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c||''); if(!m) return 0;
    function f(v){ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
    return 0.2126*f(+m[1]) + 0.7152*f(+m[2]) + 0.0722*f(+m[3]);
  }
  // 变量值可能是 #rrggbb，先丢进一个隐藏元素让浏览器算成 rgb() 再取亮度
  var probe=document.createElement('span');
  probe.style.cssText='position:absolute;left:-9999px;top:-9999px;visibility:hidden';
  function attach(){ try{ (document.body||document.documentElement).appendChild(probe); }catch(e){} }
  if(document.body) attach(); else addEventListener('DOMContentLoaded',attach);
  function apply(){
    var acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
    if(!acc) return;
    try{ probe.style.color=acc; }catch(e){}
    var L=relLum(getComputedStyle(probe).color||acc);
    if(acc.charAt(0)==='#' && L===0){ return; }   // 拿不到 rgb 时先不动，等 load 再试
    document.documentElement.style.setProperty('--on-acc', L>0.32 ? '#0b0f14' : '#ffffff');
  }
  apply();
  try{ new MutationObserver(apply).observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']}); }catch(e){}
  try{ addEventListener('load',apply); }catch(e){}
})();
</script>
<script>
/* 自动昼夜：页面开着跨过 06:30 / 18:30 也要换，每 60 秒查一次 */
(function(){
  function auto(){
    try{
      if(localStorage.getItem('cs2at.themeUser')==='1') return;   // 手动选的永远优先
      var d=new Date(), tm=d.getHours()+d.getMinutes()/60;
      var want=(tm>=6.5 && tm<18.5)?'sand':'forest';
      var cur=document.documentElement.getAttribute('data-theme');
      if(want!==cur) document.documentElement.setAttribute('data-theme',want);
    }catch(e){}
  }
  auto();
  setInterval(auto, 60000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) auto(); });
})();
</script>

<style>
  /* 主题唯一来源：assets/theme.css */
  :root{
    --panel2:var(--bg2); --line2:var(--line);
    --dim2:color-mix(in srgb, var(--dim) 78%, transparent);
    --head:color-mix(in srgb, var(--bg) 92%, transparent);
    --shade:24 21 17; --ring:color-mix(in srgb, var(--acc) 22%, transparent);
    --ok:#15803d; --warn:#b45309;
  }
  html[data-theme="jade"],html[data-theme="forest"],html[data-theme="mono"],
  html[data-theme="night"],html[data-theme="cyber"]{ --shade:0 0 0 }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;width:900px;height:660px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;transform-origin:center center;
    will-change:transform}
  /* 滚动条：6px 暗线（规则在文件末尾；这里只保留占位注释，旧的全隐藏规则已移除） */
  html,body{margin:0;background:var(--bg);color:var(--txt);overflow-x:hidden;
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #fx{position:fixed;inset:0;z-index:0;opacity:.9}
  .grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
    background-image:radial-gradient(color-mix(in srgb,var(--txt) 9%,transparent) 1px,transparent 1px);background-size:3px 3px}

  #stage .hero{position:relative;z-index:2;min-height:0;flex:1;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:40px 22px}
  .logo-mark{width:104px;height:104px;color:var(--acc);margin-bottom:18px;display:block}
  .brandline{font-size:11px;letter-spacing:7px;color:var(--dim);margin-bottom:14px;
    text-transform:uppercase;padding-left:4px;line-height:16px;height:16px}
  .mark{width:54px;height:54px;border-radius:16px;margin-bottom:26px;
    background:linear-gradient(150deg,var(--acc),var(--acc2) 70%);
    box-shadow:0 12px 30px -10px color-mix(in srgb,var(--acc) 40%,transparent);position:relative}
  
  h1{font-size:clamp(30px,5.5vw,52px);margin:0;font-weight:800;letter-spacing:4px;
    color:var(--txt);line-height:1.15}
  h1 em{font-style:normal;color:var(--acc)}
  .sub{margin:16px 0 0;color:var(--dim);font-size:15px;line-height:30px;
    min-height:60px;max-width:560px}
  .by{margin-top:10px;font-size:13px;color:var(--dim);line-height:20px;
    letter-spacing:3px;text-transform:uppercase;white-space:nowrap}
  .by b{color:var(--gold);letter-spacing:1px}

  .start{
    margin-top:44px;min-width:172px;padding:17px 30px;font-size:17px;font-weight:700;letter-spacing:4px;text-align:center;
    font-family:inherit;color:var(--on-acc,#fff);cursor:pointer;border:none;border-radius:14px;
    background:linear-gradient(150deg,var(--acc),var(--acc2));
    box-shadow:0 16px 34px -14px color-mix(in srgb,var(--acc) 55%,transparent);
    transition:transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s;
  }
  .start:hover{transform:translateY(-2px);box-shadow:0 22px 44px -16px color-mix(in srgb,var(--acc) 60%,transparent)}
  .start:active{transform:translateY(0)}
  .tip{margin-top:18px;font-size:12.5px;color:var(--dim)}

  .list{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:10px 22px 100px}
  .list h2{font-size:13px;color:var(--dim);font-weight:600;letter-spacing:3px;
    margin:0 0 22px;display:flex;align-items:center;gap:14px;text-transform:uppercase}
  .list h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  a.item{display:block;text-decoration:none;color:inherit;padding:20px 22px;
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    transition:transform .18s cubic-bezier(.2,.8,.2,1), border-color .18s, box-shadow .18s}
  a.item:hover{transform:translateY(-3px);border-color:var(--acc);
    box-shadow:0 14px 30px -12px color-mix(in srgb,var(--txt) 18%,transparent)}
  .it{font-size:15px;font-weight:600;margin-bottom:6px}
  .id{font-size:13px;color:var(--dim);line-height:1.65}
  .foot{position:absolute;z-index:2;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);
    font-size:11px;padding:0 22px;line-height:1.9;letter-spacing:.04em}
  .foot a{color:var(--acc);text-decoration:none}
  .foot code{background:color-mix(in srgb,var(--txt) 8%,transparent);padding:2px 7px;border-radius:6px;font-size:12px;color:var(--acc)}
  .langTop{position:fixed;top:18px;right:22px;z-index:9600;display:flex;
    border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
  .langTop span{padding:7px 13px;min-width:38px;text-align:center;font-size:12.5px;color:var(--dim);cursor:pointer;
    transition:.15s;user-select:none}
  .langTop span:hover{background:var(--panel);color:var(--txt)}
  .langTop span.on{background:var(--acc);color:var(--on-acc,#fff);font-weight:600}
  /* ——— 手机提示条 ——— */
  #mobileTip{display:none;position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    z-index:9300;align-items:center;gap:12px;padding:10px 14px 10px 20px;
    background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:999px;font-size:13px;white-space:nowrap;max-width:calc(100vw - 20px);
    box-shadow:0 12px 32px -14px color-mix(in srgb,var(--txt) 30%,transparent)}
  #mobileTip button{font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    background:var(--acc);color:var(--on-acc,#fff);border:none;border-radius:9px;padding:7px 14px;
    white-space:nowrap;flex-shrink:0}
  #mobileTip button:hover{filter:brightness(1.08)}
  @media (max-width:520px){
    .langTop{top:10px;right:10px}
    .langTop span{padding:6px 10px;font-size:12px}
    #mobileTip{bottom:12px;padding:9px 12px 9px 16px;font-size:12.5px;gap:10px}
    #mobileTip button{padding:6px 12px;font-size:12px}
  }

  /* ============================================================
     纸面手册 · Paper manual（落地页层）
     只动样式：不改 id / 事件 / 存储键
     ============================================================ */
  body{font-variant-numeric:tabular-nums}

  /* 品牌行下方压一条游标刻度，作为整页的身份标记 */
  /* 注意：基础规则里写死了 height:16px，这里必须放开，否则 padding 会被 height 吃掉、刻度压到字上 */
  .brandline{position:relative;padding-bottom:18px;height:auto}
  /* 只保留品牌块下方那一条刻度尺（.sub::before），这里不再叠第二条 */
  /* —— 海报构图：一个重量中心 → 刻度尺 → 单行 CTA —— */
  #stage .hero{padding:0 72px 104px; justify-content:center}   /* 底部预留版权行的位置，避免压字 */
  .logo-mark{width:88px;height:88px;margin-bottom:20px;color:var(--txt)}   /* 品牌块用墨色，把唯一的 --acc 留给 CTA */
  .brandline{font-size:11px;letter-spacing:.18em;margin-bottom:16px;color:var(--dim)}
  h1{font-size:clamp(44px,7vw,84px); font-weight:800; line-height:1.02; letter-spacing:-.01em; color:var(--txt)}
  .sub{margin:26px 0 0; font-size:14px; line-height:1.75; color:var(--dim); max-width:520px}
  .sub::before{                       /* 品牌块与正文之间的细刻度尺 */
    content:""; display:block; width:220px; height:7px; margin:0 auto 20px;
    background:
      repeating-linear-gradient(to right, var(--gold,#a8842f) 0 1px, transparent 1px 10px) 0 0/100% 5px no-repeat,
      linear-gradient(to right, transparent, var(--gold,#a8842f), transparent) 0 6px/100% 1px no-repeat;
    opacity:.9;
  }
  .by{margin-top:22px; font-size:11px; letter-spacing:.18em; color:var(--dim)}
  .start{
    margin-top:44px; padding:16px 46px; min-width:0; border:none; border-radius:8px;
    background:var(--acc); color:var(--on-acc,#fff); font-size:14px; font-weight:600; letter-spacing:.12em;
    box-shadow:none;
  }
  .start:hover{transform:translateY(-1px); box-shadow:none; filter:none; background:var(--acc2,#9a3412)}
  .start:active{transform:scale(.98)}
  .tip{margin-top:16px; font-size:11px; letter-spacing:.06em; color:var(--dim)}
  .foot a{color:var(--dim2,#8a7f6d)}

  /* 页脚那条公式：做成"量具读数"——上下各一道刻度线 */
  .foot code{
    display:inline-block; position:relative; padding:9px 16px; margin:6px 0;
    font-family:ui-monospace,"Cascadia Code",Consolas,monospace;
    font-size:12.5px; letter-spacing:.5px;
    background:color-mix(in srgb,var(--txt) 6%,transparent);
    border-radius:8px;
  }
  .foot code::before,.foot code::after{
    content:""; position:absolute; left:6px; right:6px; height:5px;
    background:repeating-linear-gradient(to right, color-mix(in srgb,var(--acc) 45%,transparent) 0 1px, transparent 1px 7px);
    opacity:.55; pointer-events:none;
  }
  .foot code::before{top:-8px}
  .foot code::after{bottom:-8px}
  /* 页脚链接：下划线用细刻度，hover 才出现 */
  .foot a{position:relative; text-decoration:none}
  .foot a::after{
    content:""; position:absolute; left:0; right:0; bottom:-3px; height:1px;
    background:var(--acc); transform:scaleX(0); transform-origin:left;
    transition:transform 170ms cubic-bezier(.2,.8,.2,1);
  }
  .foot a:hover::after{transform:scaleX(1)}

  .start{transition:transform 170ms cubic-bezier(.2,.8,.2,1), box-shadow 170ms cubic-bezier(.2,.8,.2,1)}

  /* 窄屏：单列、留白收紧 */
  @media (max-width:900px){
    h1{letter-spacing:-.01em}
    #stage .hero{padding:0 40px 128px}
    .logo-mark{width:72px;height:72px;margin-bottom:14px}
    .brandline{margin-bottom:12px}
    .sub{margin-top:18px}
    .sub::before{margin-bottom:14px}
    .by{margin-top:16px}
    .start{margin-top:30px;padding:14px 38px}
    .tip{margin-top:12px}
    .foot{font-size:10.5px;bottom:10px}
    .foot code{font-size:11px; padding:7px 11px}
  }
  @media (prefers-reduced-motion:reduce){
    a.item::before{transition:none}
    a.item:hover{transform:none}
  }

  
  /* ============================================================
     平面与数学（art-direction-flat.md）— 覆盖材质层
     无阴影 / 无渐变 / 无圆角，只有 1px 线与纯色块
     ============================================================ */
  .start{
    border-radius:0 !important;
    background:var(--acc) !important;
    background-image:none !important;
    box-shadow:none !important;
    border:1px solid var(--acc);
    color:var(--on-acc,#fff);
    transition:filter 120ms linear;
  }
  .start:hover{filter:brightness(.94); transform:none !important; box-shadow:none !important}
  .start:active{filter:brightness(.90); transform:none !important}

  .langTop,.langTop span{border-radius:0 !important; box-shadow:none !important}
  /* 语言开关不填色：全屏只留 CTA 一个填色块 */
  .langTop span.on{background:transparent !important; color:var(--acc) !important; box-shadow:inset 0 -1px 0 var(--acc) !important}

  #mobileTip{border-radius:0 !important; box-shadow:none !important}
  #mobileTip button{border-radius:0 !important; box-shadow:none !important; border:1px solid var(--acc)}

  .foot code{border-radius:0 !important; background:transparent !important; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
  .grain{display:none}   /* 颗粒是装饰性纹理，平面语言里不需要 */
  /* ——— 动效（motion-spec v2）：绘图仪式分层入场 + 刻度尺绘制 ——— */
  @keyframes landRise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
  @keyframes landDraw{ from{transform:scaleX(0)} to{transform:scaleX(1)} }

  .logo-mark{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:0ms }
  .brandline{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:16ms }
  h1{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:32ms }
  .sub{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:64ms }
  .by{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:80ms }
  /* 主行动不排队：第 0 帧就可点，整体 120ms 淡入（motion-spec §0.2） */
  .start{ opacity:0; animation:landRise 120ms linear forwards; animation-delay:0ms }
  .tip{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:112ms }
  .foot{ opacity:0; animation:landRise 260ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:128ms }

  /* 品牌块下方那条金色刻度尺：从左匀速画出来 */
  .sub::before{
    transform-origin:left center;
    animation:landDraw 240ms linear both;
    animation-delay:48ms;
  }

  @media (prefers-reduced-motion:reduce){
    .logo-mark,.brandline,h1,.sub,.by,.start,.tip,.foot{ animation:none !important; opacity:1 !important; transform:none !important }
    .sub::before{ animation:none !important; transform:none !important }
  }

  /* ============================================================
     视觉系统 v3「编辑体」— 落地页海报（只改视觉，不改内容）
     ============================================================ */
  html,body{ background:var(--paper); }
  body{
    font-family:var(--f-ui); color:var(--ink);

<script>
(function(){
  const cv=document.getElementById('fx'); if(!cv) return;   /* v3：去掉背景彩点（噪声） */
  const ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,pts=[],ACC=[15,118,110],DIM=[109,122,123],started=false;

  const COLORS=[[15,118,110],[180,83,9],[32,43,44]];   // 原来的三色，照旧
  const LIGHT_BG={ink:[247,245,240], light:[244,246,249], lake:[238,244,246], sand:[247,242,232]};
  function pickColor(){
    // 浅色主题：颜色保持纯色、只降透明度——混色会变泥巴色，纯色低透明才是玻璃屑
    var th=null;
    try{ th=document.documentElement.getAttribute('data-theme'); }catch(e){}
    if(LIGHT_BG[th]) return { c: COLORS[(Math.random()*COLORS.length)|0], a: 0.42 };
    return { c: COLORS[(Math.random()*COLORS.length)|0], a: 0.55 };
  }

  // 只画，不管循环
  let burst=null;
  function dotFactor(p){
    if(!burst) return 1;
    const el=performance.now()-burst.t0;
    const k=(el-(p.d||0)*burst.span)/burst.dur;
    return Math.max(0,Math.min(1,k));
  }
  window.__fxResurface=function(cx,cy){
    const cxd=cx*devicePixelRatio, cyd=cy*devicePixelRatio;
    let maxD=1;
    pts.forEach(function(p){ p.d=Math.hypot(p.x-cxd,p.y-cyd); if(p.d>maxD) maxD=p.d; });
    pts.forEach(function(p){ p.d=p.d/maxD; });
    burst={t0:performance.now(), dur:900, span:1100};
  };

  function draw(){
    ctx.clearRect(0,0,W,H);
    const lim=(150*devicePixelRatio)**2;
    if(burst && performance.now()-burst.t0 > burst.span+burst.dur+80) burst=null;
    const lineBase='rgba(15,118,110,';
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=dx*dx+dy*dy;
      if(d<lim){ ctx.strokeStyle=lineBase+(0.10*(1-d/lim))+')';
        ctx.lineWidth=devicePixelRatio*.6;
        ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
    }
    for(const p of pts){
      const f=dotFactor(p);
      if(f<=0.001) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+(p.a*f)+')'; ctx.fill();
    }
  }

  function step(){
    for(const p of pts){
      p.x+=p.vx*speed; p.y+=p.vy*speed;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
    }
    draw();
    if(!noMotion) requestAnimationFrame(step);   // 只有 ?motion=0 才停
  }

  function resize(){
    W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    var light=false;
    try{ var th=document.documentElement.getAttribute('data-theme'); light=(th==='ink'||th==='light'||th==='lake'||th==='sand'); }catch(e){}
    // 浅色主题：少一点、大一点、实一点，但别成油点
    const n=Math.min(48, Math.round(innerWidth/(light?42:30))); pts=[];
    for(let i=0;i<n;i++){
      const pc=pickColor();
      pts.push({x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*.16*devicePixelRatio, vy:(Math.random()-.5)*.16*devicePixelRatio,
        r:(Math.random()*2.2+1)*(light?1.4:1)*devicePixelRatio, c:pc.c, a:pc.a});
    }
    draw();   // 尺寸变了会清空画布，这里立刻补画
  }

  addEventListener('resize',resize);
  resize();

  const qs=new URLSearchParams(location.search);
  const noMotion=qs.get('motion')==='0';      // 想彻底停：加 ?motion=0
  const speed=(reduce && !qs.has('motion')) ? 0.5 : 1;   // 系统关了动效 → 跑慢一半，但仍然会动
  if(!noMotion){ if(!started){ started=true; requestAnimationFrame(step); } }
})();

  function translateRoot(root, lang){
    if(!root || !document.createTreeWalker) return;
    var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      var t=n.nodeValue.trim();
      if(!t) continue;
      if(lang==='en'){ if(EN[t]) n.nodeValue=n.nodeValue.replace(t, EN[t]); }
      else { if(ZH[t]) n.nodeValue=n.nodeValue.replace(t, ZH[t]); }
    }
  }
  function applyLang(lang){
    lang = lang || LANG;
    document.documentElement.setAttribute('lang', lang==='en'?'en':'zh-CN');
    translateRoot(document.body, lang);
  }
  function markSwitch(lang){
    var box=document.getElementById('langTop');
    if(box) box.querySelectorAll('span[data-l]').forEach(function(el){ el.classList.toggle('on', el.dataset.l===lang); });
    try{ document.title = lang==='en'? 'Vernier — aim, measured' : '分毫 · 瞄准，度量'; }catch(e){}
  }


  function storeLang(l){ try{ localStorage.setItem('cs2at.lang', l); }catch(e){} }

/* 主题色解析：兼容 hex 与 @property 注册后的 rgb() 计算值 */
function parseColor(v){
  try{
    var s=String(v||'').trim();
    var m=s.match(/rgba?\(([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)/);
    if(m) return Math.round(+m[1])+','+Math.round(+m[2])+','+Math.round(+m[3]);
    var h=s.replace('#','');
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    if(/^[0-9a-fA-F]{6}$/.test(h)){ var n=parseInt(h,16); return ((n>>16)&255)+','+((n>>8)&255)+','+(n&255); }
    return null;
  }catch(e){ return null; }
}

let switching=false, watchdog=null;

function rippleSwitch(lang, cx, cy){
  // 全站统一：雨滴涟漪用 assets/lang-ripple.js（620ms / 4 圈；reduced-motion 380ms / 3 圈）
  if(window.LangRipple && window.LangRipple.run){
    var el=document.querySelector('#langTop span[data-l="'+lang+'"]');
    if(el){ var r=el.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; }
    window.LangRipple.run({x:cx,y:cy}, function(){
      LANG=lang; storeLang(lang); applyLang(lang); markSwitch(lang);
    });
    return;
  }
  if(switching) return;
  switching=true;

  var fx=document.getElementById('fx');

  clearTimeout(watchdog);
  watchdog=setTimeout(function(){
    if(switching){
      try{ LANG=lang; localStorage.setItem('cs2at.lang',lang); applyLang(lang); markSwitch(lang); }catch(e){}
      document.querySelectorAll('.langBlocker,.langLayer,.langCanvas').forEach(function(el){ el.remove(); });
      try{ document.documentElement.style.overflow=''; }catch(e){}
      switching=false;
    }
  }, 3000);

  var blocker=document.createElement('div');
  blocker.className='langBlocker';
  blocker.style.cssText='position:fixed;inset:0;z-index:9500;cursor:default;background:transparent;touch-action:none';
  document.body.appendChild(blocker);

  var htmlEl=document.documentElement;
  var prevOverflow=htmlEl.style.overflow;
  var scrollTop=window.scrollY||0;
  htmlEl.style.overflow='hidden';

  var stopScroll=function(ev){ ev.preventDefault(); };
  blocker.addEventListener('wheel', stopScroll, {passive:false});
  blocker.addEventListener('touchmove', stopScroll, {passive:false});

  // ① 按钮先切（这是用户看到的第一个反馈）
  var lsReal=document.getElementById('langTop');
  if(lsReal) lsReal.querySelectorAll('span[data-l]').forEach(function(el){ el.classList.toggle('on', el.dataset.l===lang); });
  // 切完再按目标按钮的当前中心取波纹起点（加粗不再造成偏移）
  try{
    var lt=lsReal && lsReal.querySelector('span[data-l="'+lang+'"]');
    if(lt){ var lr=lt.getBoundingClientRect(); cx=lr.left+lr.width/2; cy=lr.top+lr.height/2; }
  }catch(e){}

  // ② 复制当前页面（旧语言），塞进滚动容器
  var scroller=null, layer=null;
  try{
    var src=document.body.cloneNode(true);
    src.querySelectorAll('script,iframe,canvas').forEach(function(el){ el.remove(); });
    var hSrc=src.querySelector('#langTop');
    if(hSrc){ hSrc.style.background='var(--bg)'; }
    scroller=document.createElement('div');
    scroller.style.cssText='position:absolute;inset:0;overflow:auto;scrollbar-width:none;-ms-overflow-style:none';
    scroller.appendChild(src);

    layer=document.createElement('div');
    layer.className='langLayer';
    layer.style.cssText='position:fixed;inset:0;z-index:9000;pointer-events:none;overflow:hidden;'
      +'background:var(--bg);contain:layout paint;transform:translateZ(0);'
      +'backface-visibility:hidden;isolation:isolate;'
      +'clip-path:circle(0px at '+cx+'px '+cy+'px)';
    layer.appendChild(scroller);



    translateRoot(layer, lang);   // 复制层翻成新语言
    layer.querySelectorAll('#langTop span[data-l]').forEach(function(el){ el.classList.toggle('on', el.dataset.l===lang); });
    document.body.appendChild(layer);
    scroller.scrollTop=scrollTop;
    requestAnimationFrame(function(){ scroller.scrollTop=scrollTop; });
  }catch(e){ layer=null; }

  if(!layer){
    try{ LANG=lang; localStorage.setItem('cs2at.lang',lang); applyLang(lang); markSwitch(lang); }catch(e){}
    blocker.remove(); htmlEl.style.overflow=prevOverflow;
    switching=false; return;
  }

  // ③ 波纹
  var cv=document.createElement('canvas');
  var ctx2=cv.getContext('2d'), dpr=devicePixelRatio||1;
  cv.className='langCanvas';
  cv.style.cssText='position:fixed;inset:0;z-index:9001;pointer-events:none';
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  document.body.appendChild(cv);

  var ACC=parseColor(getComputedStyle(htmlEl).getPropertyValue('--acc'))||'15,118,110';

  var maxD=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+70;
  var DUR=2600, t0=null;

  function ring(R,w,a){
    if(R<=0) return;
    ctx2.beginPath(); ctx2.arc(cx*dpr,cy*dpr,R*dpr,0,Math.PI*2);
    ctx2.strokeStyle='rgba('+ACC+','+a+')'; ctx2.lineWidth=w*dpr; ctx2.stroke();
  }

  function step(now){
    if(t0===null) t0=now;
    var t=Math.min(1,(now-t0)/DUR);
    var e=t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    var R=maxD*e;
    layer.style.clipPath='circle('+R+'px at '+cx+'px '+cy+'px)';
    ctx2.clearRect(0,0,cv.width,cv.height);
    var fade=Math.max(0,1-Math.pow(t,1.6));
    ring(R,2.2,0.75*fade); ring(R*0.93,1.4,0.40*fade); ring(R*1.05,1.0,0.22*fade);
    if(t<1){ requestAnimationFrame(step); return; }

    // ④ 遮罩盖满之后，真实页面才切语言
    try{ LANG=lang; localStorage.setItem('cs2at.lang',lang); applyLang(lang); markSwitch(lang); }catch(e){}
    try{ markSwitch(lang); }catch(e){}

    layer.style.clipPath='circle(300vmax at '+cx+'px '+cy+'px)';
    cv.width=0; cv.height=0; cv.remove();
    requestAnimationFrame(function(){
      layer.remove(); blocker.remove();

      try{ if(window.__fxResurface) window.__fxResurface(cx,cy); }catch(e){}   // 和波浪同方向，依次浮现
      htmlEl.style.overflow=prevOverflow;
      clearTimeout(watchdog);
      switching=false;
      try{ window.scrollTo(0,scrollTop); }catch(e){}
    });
  }
  requestAnimationFrame(step);
}

  applyLang(LANG);
  markSwitch(LANG);

  var box=document.getElementById('langTop');
  if(box) box.querySelectorAll('span[data-l]').forEach(function(el){
    el.addEventListener('click', function(){
      if(el.dataset.l===LANG || switching) return;
      var r=el.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var target=el.dataset.l;

      rippleSwitch(target, cx, cy);
    });
    el.addEventListener('keydown', function(e){
      if(e.key!=='Enter' && e.key!==' ') return;
      e.preventDefault();
      if(el.dataset.l===LANG || switching) return;
      var r=el.getBoundingClientRect();
      rippleSwitch(el.dataset.l, r.left+r.width/2, r.top+r.height/2);
    });
  });


(function(){
  try{
    var q=new URLSearchParams(location.search).get('theme');
    var t=q || localStorage.getItem('cs2at.theme') || (function(){var d=new Date(),tm=d.getHours()*60+d.getMinutes();return (tm>=1410||tm<460)?'forest':'sand';})();
    document.documentElement.setAttribute('data-theme', t);

(function(){
  var W=900, H=660, MIN=0.62;
  var st=document.getElementById('stage');
  var html=document.documentElement, body=document.body;
  // v3：不再缩放固定舞台，改成全宽版面（大屏不再是一张小卡片漂在画布上）
  function fit(){ try{ st.style.transform='none'; html.style.overflow=null; body.style.overflow=null; }catch(e){} }
  if(true){ fit(); addEventListener('resize', fit); return; }
  function fitOld(){
    var k=Math.min(1, (innerWidth-24)/W, (innerHeight-24)/H);
    var use=Math.max(k, MIN);
    st.style.transform='scale('+use.toFixed(4)+')';
    if(k>=MIN){
      html.style.overflow='hidden'; body.style.overflow='hidden';
      body.style.alignItems='center'; body.style.height='100%';
    }else{
      html.style.overflow='auto'; body.style.overflow='auto';
      body.style.alignItems='flex-start'; body.style.height='auto';
      body.style.minHeight='100%';
      body.style.padding='12px 0';
    }
  }
  addEventListener('resize', fit);
  fit();

  // 第四个彩蛋：页脚公式连点 3 次
  (function(){
    var f=document.getElementById('eggFormula');
    if(!f) return;
    var n=0, timer=null;
    f.style.cursor='pointer';
    f.addEventListener('click',function(){
      n++; clearTimeout(timer);
      timer=setTimeout(function(){ n=0; }, 900);
      if(n>=3){ n=0; location.href='对话记录.html'; }
    });
  })();
})();

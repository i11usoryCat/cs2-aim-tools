<style>

<script>
(function(){
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,pts=[],ACC=[15,118,110],DIM=[109,122,123],started=false;

  const COLORS=[[15,118,110],[180,83,9],[32,43,44]];   // 原来的三色，照旧
  function pickColor(){
    return { c: COLORS[(Math.random()*COLORS.length)|0], a: 0.55 };
  }

  // 只画，不管循环
  function draw(){
    ctx.clearRect(0,0,W,H);
    const lim=(150*devicePixelRatio)**2;
    const lineBase='rgba(15,118,110,';
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=dx*dx+dy*dy;
      if(d<lim){ ctx.strokeStyle=lineBase+(0.10*(1-d/lim))+')';
        ctx.lineWidth=devicePixelRatio*.6;
        ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
    }
    for(const p of pts){
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+p.a+')'; ctx.fill();
    }
  }

  function step(){
    for(const p of pts){
      p.x+=p.vx*speed; p.y+=p.vy*speed;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
    }
    draw();
    if(!noMotion) requestAnimationFrame(step);   // 只有 ?motion=0 才停
  }

  function resize(){
    W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    const n=Math.min(48, Math.round(innerWidth/30)); pts=[];
    for(let i=0;i<n;i++){
      const pc=pickColor();
      pts.push({x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*.16*devicePixelRatio, vy:(Math.random()-.5)*.16*devicePixelRatio,
        r:(Math.random()*2.2+1)*devicePixelRatio, c:pc.c, a:pc.a});
    }
    draw();   // 尺寸变了会清空画布，这里立刻补画
  }

  addEventListener('resize',resize);
  resize();

  const qs=new URLSearchParams(location.search);
  const noMotion=qs.get('motion')==='0';      // 想彻底停：加 ?motion=0
  const speed=(reduce && !qs.has('motion')) ? 0.5 : 1;   // 系统关了动效 → 跑慢一半，但仍然会动
  if(!noMotion){ if(!started){ started=true; requestAnimationFrame(step); } }
})();

var EN={
    '甩枪训练中心':'AIM TRAINING HUB',
    '瞄准，被度量。':'Aim, measured.',
    '灵敏度标定 · 甩枪训练 · 四周计划':'Calibration · drills · four-week plan','浏览器里的灵敏度标定与甩枪训练。':'Sensitivity calibration and flick training in the browser.','浏览器端 · 无需安装 · 不读取游戏数据':'Browser based · no install · reads no game data',
    '标定 → 计划 → 每天十五分钟':'Calibrate → plan → fifteen minutes a day',
    'by':'by','开始':'START','建议使用 Chrome 或 Edge':'Chrome or Edge recommended',
    '软件清单':'TOOLS',
    '灵敏度标定 · 过冲法':'Calibrator · overshoot',
    '测出你每次甩动偏多少，反推应该填的 sensitivity。':'Measures how far each flick lands from the target and derives the sensitivity to use.',
    '甩枪训练 · 自适应随机':'Flick trainer · adaptive',
    '球与限时按 85% 成功率自动调节，主练模式。':'Ball size and time limit adapt to an 85% success rate. Main practice mode.',
    '甩枪训练 · 定角重复':'Flick trainer · blocked',
    '同一角度连打 8 球，形成运动程序，热身用。':'Same angle eight times, alternating on four axes. Warm-up.',
    '甩枪训练 · 小球精度':'Flick trainer · precision',
    '0.7° 小球，无时限，练一次定位的精度。':'0.7° ball, no time limit. Landing precision.',
    '四周训练计划':'Four-week programme',
    '按天推进，自动记录进度与数据。':'Day by day, with progress tracking.',
    '原始输入记录器':'Raw input recorder',
    'C# 单文件，验证真实回报率与报告间隔抖动。':'Single-file C# tool to verify polling rate and report jitter.'
  };
  var ZH={}; Object.keys(EN).forEach(function(k){ ZH[EN[k]]=k; });
  var LANG='zh';
  try{ LANG=localStorage.getItem('cs2at.lang')||'zh'; }catch(e){}

  function translateRoot(root, lang){
    if(!root || !document.createTreeWalker) return;
    var w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n;
    while((n=w.nextNode())){
      var t=n.nodeValue.trim();
      if(!t) continue;
      if(lang==='en'){ if(EN[t]) n.nodeValue=n.nodeValue.replace(t, EN[t]); }
      else { if(ZH[t]) n.nodeValue=n.nodeValue.replace(t, ZH[t]); }
    }
  }
  function applyLang(lang){
    document.documentElement.setAttribute('lang', lang==='en'?'en':'zh-CN');
    translateRoot(document.body, lang);
  }
  function markSwitch(lang){
    var box=document.getElementById('langTop');
    if(box) box.querySelectorAll('span[data-l]').forEach(function(el){ el.classList.toggle('on', el.dataset.l===lang); });
  }


  function storeLang(l){ try{ localStorage.setItem('cs2at.lang', l); }catch(e){} }

let switching=false, watchdog=null;

function rippleSwitch(lang, cx, cy){
  if(switching) return;
  switching=true;

  // 粒子浮到遮罩上面，动画期间继续飘
  var fx=document.getElementById('fx');
  var fxZ=fx?fx.style.zIndex:'';
  if(fx){ fx.style.zIndex='9002'; }

  clearTimeout(watchdog);
  watchdog=setTimeout(function(){
    if(switching){
      try{ LANG=lang; localStorage.setItem('cs2at.lang',lang); applyLang(lang); markSwitch(lang); }catch(e){}
      document.querySelectorAll('.langBlocker,.langLayer,.langCanvas').forEach(function(el){ el.remove(); });
      try{ if(fx) fx.style.zIndex=fxZ; }catch(e){}
      try{ document.documentElement.style.overflow=''; }catch(e){}
      switching=false;
    }
  }, 6000);

  var blocker=document.createElement('div');
  blocker.className='langBlocker';
  blocker.style.cssText='position:fixed;inset:0;z-index:9500;cursor:default;background:transparent;touch-action:none';
  document.body.appendChild(blocker);

  var htmlEl=document.documentElement;
  var prevOverflow=htmlEl.style.overflow;
  var scrollTop=window.scrollY||0;
  htmlEl.style.overflow='hidden';

  var stopScroll=function(ev){ ev.preventDefault(); };
  blocker.addEventListener('wheel', stopScroll, {passive:false});
  blocker.addEventListener('touchmove', stopScroll, {passive:false});

  // ① 按钮先切（这是用户看到的第一个反馈）
  var lsReal=document.getElementById('langTop');
  if(lsReal) lsReal.querySelectorAll('span[data-l]').forEach(function(el){ el.classList.toggle('on', el.dataset.l===lang); });

  // ② 复制当前页面（旧语言），塞进滚动容器
  var scroller=null, layer=null;
  try{
    var src=document.body.cloneNode(true);
    src.querySelectorAll('script,iframe,canvas').forEach(function(el){ el.remove(); });
    var hSrc=src.querySelector('#langTop');
    if(hSrc){ hSrc.style.background='var(--bg)'; }
    scroller=document.createElement('div');
    scroller.style.cssText='position:absolute;inset:0;overflow:auto;scrollbar-width:none;-ms-overflow-style:none';
    scroller.appendChild(src);

    layer=document.createElement('div');
    layer.className='langLayer';
    layer.style.cssText='position:fixed;inset:0;z-index:9000;pointer-events:none;overflow:hidden;'
      +'background:var(--bg);contain:layout paint;transform:translateZ(0);'
      +'backface-visibility:hidden;isolation:isolate;'
      +'clip-path:circle(0px at '+cx+'px '+cy+'px)';
    layer.appendChild(scroller);

    translateRoot(layer, lang);   // 复制层翻成新语言
    layer.querySelectorAll('#langTop span[data-l]').forEach(function(el){ el.classList.toggle('on', el.dataset.l===lang); });
    document.body.appendChild(layer);
    scroller.scrollTop=scrollTop;
    requestAnimationFrame(function(){ scroller.scrollTop=scrollTop; });
  }catch(e){ layer=null; }

  if(!layer){
    try{ LANG=lang; localStorage.setItem('cs2at.lang',lang); applyLang(lang); markSwitch(lang); }catch(e){}
    blocker.remove(); htmlEl.style.overflow=prevOverflow;
    switching=false; return;
  }

  // ③ 波纹
  var cv=document.createElement('canvas');
  var ctx2=cv.getContext('2d'), dpr=devicePixelRatio||1;
  cv.className='langCanvas';
  cv.style.cssText='position:fixed;inset:0;z-index:9001;pointer-events:none';
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  document.body.appendChild(cv);

  var acc=(getComputedStyle(htmlEl).getPropertyValue('--acc')||'#0f766e').trim().replace('#','');
  if(acc.length===3) acc=acc[0]+acc[0]+acc[1]+acc[1]+acc[2]+acc[2];
  var av=parseInt(acc,16), ACC='15,118,110';
  if(!isNaN(av)) ACC=((av>>16)&255)+','+((av>>8)&255)+','+(av&255);

  var maxD=Math.hypot(Math.max(cx,innerWidth-cx),Math.max(cy,innerHeight-cy))+70;
  var DUR=2600, t0=null;

  function ring(R,w,a){
    if(R<=0) return;
    ctx2.beginPath(); ctx2.arc(cx*dpr,cy*dpr,R*dpr,0,Math.PI*2);
    ctx2.strokeStyle='rgba('+ACC+','+a+')'; ctx2.lineWidth=w*dpr; ctx2.stroke();
  }

  function step(now){
    if(t0===null) t0=now;
    var t=Math.min(1,(now-t0)/DUR);
    var e=t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
    var R=maxD*e;
    layer.style.clipPath='circle('+R+'px at '+cx+'px '+cy+'px)';
    ctx2.clearRect(0,0,cv.width,cv.height);
    var fade=Math.max(0,1-Math.pow(t,1.6));
    ring(R,2.2,0.75*fade); ring(R*0.93,1.4,0.40*fade); ring(R*1.05,1.0,0.22*fade);
    if(t<1){ requestAnimationFrame(step); return; }

    // ④ 遮罩盖满之后，真实页面才切语言
    try{ LANG=lang; localStorage.setItem('cs2at.lang',lang); applyLang(lang); markSwitch(lang); }catch(e){}
    try{ markSwitch(lang); }catch(e){}

    layer.style.clipPath='circle(300vmax at '+cx+'px '+cy+'px)';
    cv.width=0; cv.height=0; cv.remove();
    requestAnimationFrame(function(){
      layer.remove(); blocker.remove();
      if(fx) fx.style.zIndex=fxZ;
      htmlEl.style.overflow=prevOverflow;
      clearTimeout(watchdog);
      switching=false;
      try{ window.scrollTo(0,scrollTop); }catch(e){}
    });
  }
  requestAnimationFrame(step);
}

  applyLang(LANG);
  markSwitch(LANG);

  var box=document.getElementById('langTop');
  if(box) box.querySelectorAll('span[data-l]').forEach(function(el){
    el.addEventListener('click', function(){
      if(el.dataset.l===LANG || switching) return;
      var r=el.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var target=el.dataset.l;

      rippleSwitch(target, cx, cy);
    });
  });


(function(){
  try{
    var q=new URLSearchParams(location.search).get('theme');
    var t=q || localStorage.getItem('cs2at.theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();


(function(){
  var W=900, H=660, MIN=0.62;
  var st=document.getElementById('stage');
  var html=document.documentElement, body=document.body;
  function fit(){
    var k=Math.min(1, (innerWidth-24)/W, (innerHeight-24)/H);
    var use=Math.max(k, MIN);
    st.style.transform='scale('+use.toFixed(4)+')';
    if(k>=MIN){
      html.style.overflow='hidden'; body.style.overflow='hidden';
      body.style.alignItems='center'; body.style.height='100%';
    }else{
      html.style.overflow='auto'; body.style.overflow='auto';
      body.style.alignItems='flex-start'; body.style.height='auto';
      body.style.minHeight='100%';
      body.style.padding='12px 0';
    }
  }
  addEventListener('resize', fit);
  fit();

  // 第四个彩蛋：页脚公式连点 3 次
  (function(){
    var f=document.getElementById('eggFormula');
    if(!f) return;
    var n=0, timer=null;
    f.style.cursor='pointer';
    f.addEventListener('click',function(){
      n++; clearTimeout(timer);
      timer=setTimeout(function(){ n=0; }, 900);
      if(n>=3){ n=0; location.href='对话记录.html'; }
    });
  })();
})();
</script>

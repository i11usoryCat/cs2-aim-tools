<script>
(function(){
  const cv=document.getElementById('fx'), ctx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,pts=[],ACC=[15,118,110],DIM=[109,122,123],started=false;

  const COLORS=[[15,118,110],[180,83,9],[32,43,44]];   // 原来的三色，照旧
  function pickColor(){
    return { c: COLORS[(Math.random()*COLORS.length)|0], a: 0.55 };
  }

  // 只画，不管循环
  let burst=null;
  function dotFactor(p){
    if(!burst) return 1;
    const el=performance.now()-burst.t0;
    const k=(el-(p.d||0)*burst.span)/burst.dur;
    return Math.max(0,Math.min(1,k));
  }
  window.__fxResurface=function(cx,cy){
    const cxd=cx*devicePixelRatio, cyd=cy*devicePixelRatio;
    let maxD=1;
    pts.forEach(function(p){ p.d=Math.hypot(p.x-cxd,p.y-cyd); if(p.d>maxD) maxD=p.d; });
    pts.forEach(function(p){ p.d=p.d/maxD; });
    burst={t0:performance.now(), dur:900, span:1100};
  };

  function draw(){
    ctx.clearRect(0,0,W,H);
    const lim=(150*devicePixelRatio)**2;
    if(burst && performance.now()-burst.t0 > burst.span+burst.dur+80) burst=null;
    const lineBase='rgba(15,118,110,';
    for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
      const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=dx*dx+dy*dy;
      if(d<lim){ ctx.strokeStyle=lineBase+(0.10*(1-d/lim))+')';
        ctx.lineWidth=devicePixelRatio*.6;
        ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.stroke(); }
    }
    for(const p of pts){
      const f=dotFactor(p);
      if(f<=0.001) continue;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+(p.a*f)+')'; ctx.fill();
    }
  }

  function step(){
    for(const p of pts){
      p.x+=p.vx*speed; p.y+=p.vy*speed;
      if(p.x<0||p.x>W) p.vx*=-1;
      if(p.y<0||p.y>H) p.vy*=-1;
    }
    draw();
    if(!noMotion) requestAnimationFrame(step);   // 只有 ?motion=0 才停
  }

  function resize(){
    W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
    cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
    const n=Math.min(48, Math.round(innerWidth/30)); pts=[];
    for(let i=0;i<n;i++){
      const pc=pickColor();
      pts.push({x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*.16*devicePixelRatio, vy:(Math.random()-.5)*.16*devicePixelRatio,
        r:(Math.random()*2.2+1)*devicePixelRatio, c:pc.c, a:pc.a});
    }
    draw();   // 尺寸变了会清空画布，这里立刻补画
  }

  addEventListener('resize',resize);
  resize();

  const qs=new URLSearchParams(location.search);
  const noMotion=qs.get('motion')==='0';      // 想彻底停：加 ?motion=0
  const speed=(reduce && !qs.has('motion')) ? 0.5 : 1;   // 系统关了动效 → 跑慢一半，但仍然会动
  if(!noMotion){ if(!started){ started=true; requestAnimationFrame(step); } }
})();

var EN={
    '甩枪训练中心':'AIM TRAINING HUB',
    '瞄准，被度量。':'Aim, measured.',
    '灵敏度标定 · 甩枪训练 · 四周计划':'Calibration · drills · four-week plan','浏览器里的灵敏度标定与甩枪训练。':'Sensitivity calibration and flick training in the browser.','浏览器端 · 无需安装 · 不读取游戏数据':'Browser based · no install · reads no game data',
    '标定 → 计划 → 每天十五分钟':'Calibrate → plan → fifteen minutes a day',
    'by':'by','开始':'START','建议使用 Chrome 或 Edge':'Chrome or Edge recommended',
    '软件清单':'TOOLS',
    '灵敏度标定 · 过冲法':'Calibrator · overshoot',
    '测出你每次甩动偏多少，反推应该填的 sensitivity。':'Measures how far each flick lands from the target and derives the sensitivity to use.',
    '甩枪训练 · 自适应随机':'Flick trainer · adaptive',
    '球与限时按 85% 成功率自动调节，主练模式。':'Ball size and time limit adapt to an 85% success rate. Main practice mode.',
    '甩枪训练 · 定角重复':'Flick trainer · blocked',
    '同一角度连打 8 球，形成运动程序，热身用。':'Same angle eight times, alternating on four axes. Warm-up.',
    '甩枪训练 · 小球精度':'Flick trainer · precision',
    '0.7° 小球，无时限，练一次定位的精度。':'0.7° ball, no time limit. Landing precision.',
    '四周训练计划':'Four-week programme',
    '按天推进，自动记录进度与数据。':'Day by day, with progress tracking.',
    '原始输入记录器':'Raw input recorder',
    'C# 单文件，验证真实回报率与报告间隔抖动。':'Single-file C# tool to verify polling rate and report jitter.',
    '方法论':'Methodology','训练方案':'Training plan','反馈':'Feedback'
  };
  var ZH={}; Object.keys(EN).forEach(function(k){ ZH[EN[k]]=k; });
  var LANG='zh';
  try{ LANG=localStorage.getItem('cs2at.lang')||'zh'; }catch(e){}

  const __ORIG=new WeakMap();   // 记住每个文本节点的原文，来回切换不累积
function translateRoot(root, lang){
  try{
    if(!root || !document.createTreeWalker) return;
    const map = (lang==='en') ? EN : ZH;
    const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    let n;
    while((n=w.nextNode())){
      let orig=__ORIG.get(n);
      if(orig===undefined){ orig=n.nodeValue; __ORIG.set(n, orig); }
      const t=orig.trim();
      if(!t) continue;
      n.nodeValue = map[t] ? orig.replace(t, map[t]) : orig;
    }
  }catch(e){}
}

  applyLang(LANG);
  markSwitch(LANG);

  var box=document.getElementById('langTop');
  if(box) box.querySelectorAll('span[data-l]').forEach(function(el){
    el.addEventListener('click', function(){
      if(el.dataset.l===LANG || switching) return;
      var r=el.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      var target=el.dataset.l;

      rippleSwitch(target, cx, cy);
    });
  });


(function(){
  try{
    var q=new URLSearchParams(location.search).get('theme');
    var t=q || localStorage.getItem('cs2at.theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();


(function(){
  var W=900, H=660, MIN=0.62;
  var st=document.getElementById('stage');
  var html=document.documentElement, body=document.body;
  function fit(){
    var k=Math.min(1, (innerWidth-24)/W, (innerHeight-24)/H);
    var use=Math.max(k, MIN);
    st.style.transform='scale('+use.toFixed(4)+')';
    if(k>=MIN){
      html.style.overflow='hidden'; body.style.overflow='hidden';
      body.style.alignItems='center'; body.style.height='100%';
    }else{
      html.style.overflow='auto'; body.style.overflow='auto';
      body.style.alignItems='flex-start'; body.style.height='auto';
      body.style.minHeight='100%';
      body.style.padding='12px 0';
    }
  }
  addEventListener('resize', fit);
  fit();

  // 第四个彩蛋：页脚公式连点 3 次
  (function(){
    var f=document.getElementById('eggFormula');
    if(!f) return;
    var n=0, timer=null;
    f.style.cursor='pointer';
    f.addEventListener('click',function(){
      n++; clearTimeout(timer);
      timer=setTimeout(function(){ n=0; }, 900);
      if(n>=3){ n=0; location.href='对话记录.html'; }
    });
  })();
})();
</script>

<script>
(function(){
  var mask=document.getElementById('fbMask'), diag=document.getElementById('fbDiag');
  var link=document.getElementById('fbLink');
  function build(){
    var t=document.documentElement.getAttribute('data-theme')||'jade';
    var l='zh'; try{ l=localStorage.getItem('cs2at.lang')||'zh'; }catch(e){}
    return ['页面: '+location.pathname.split('/').pop(),
      '语言: '+l+'   主题: '+t,
      '窗口: '+innerWidth+'x'+innerHeight+' @'+(devicePixelRatio||1)+'x',
      '浏览器: '+navigator.userAgent,
      '时间: '+new Date().toLocaleString('zh-CN')].join('\n');
  }
  function open(){
    diag.value=build(); diag.classList.add('on');
    var body='## 哪一页\n'+location.pathname.split('/').pop()+'\n\n## 我做了什么\n\n\n## 期望看到什么\n\n\n## 诊断信息\n```\n'+diag.value+'\n```\n';
    document.getElementById('fbIssue').href='https://github.com/i11usoryCat/cs2-aim-tools/issues/new?title='+encodeURIComponent('[反馈] ')+'&body='+encodeURIComponent(body);
    mask.classList.add('on');
  }
  if(link) link.addEventListener('click', function(e){ e.preventDefault(); open(); });
  document.getElementById('fbClose').onclick=function(){ mask.classList.remove('on'); };
  mask.addEventListener('click', function(e){ if(e.target===mask) mask.classList.remove('on'); });
  document.getElementById('fbCopy').onclick=function(){
    diag.select(); try{ document.execCommand('copy'); }catch(e){}
    this.textContent='已复制'; var b=this; setTimeout(function(){ b.textContent='复制诊断信息'; },1400);
  };
})();
</script>
<script>
/* 版本号连点 7 次 → 小肥鱼 */
(function(){
  var t=document.getElementById('buildTag'); if(!t) return;
  var n=0, timer=null;
  t.style.cursor='default'; t.style.userSelect='none';
  t.addEventListener('click', function(e){
    e.preventDefault();
    n++; clearTimeout(timer);
    timer=setTimeout(function(){ n=0; }, 2500);
    if(n>=7){ n=0; location.href='小肥鱼.html'; }
  });
})();
</script>
</body>
</html>

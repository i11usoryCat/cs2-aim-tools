<!doctype html>
<html lang="zh-CN" data-theme="sand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>四周训练计划 · CS2 Aim Tools</title>
<style>
  :root{color-scheme:light dark}

  html[data-theme="jade"]{--bg:#101917;--panel:#16211f;--panel2:#1d2b28;--line:#2a3a36;--txt:#efeade;--dim:#93a8a1;--acc:#7fbfa6}
  html[data-theme="ink"]{--bg:#f6f4ef;--panel:#fffdf9;--panel2:#efebe2;--line:#ddd6c8;--txt:#1f2b2c;--dim:#5d6c6e;--acc:#0f766e}
  html[data-theme="lake"]{--bg:#eef4f6;--panel:#fff;--panel2:#e8f1f4;--line:#d2e2e7;--txt:#14313a;--dim:#4e6e79;--acc:#0e7490}
  html[data-theme="light"]{--bg:#f4f6f9;--panel:#fff;--panel2:#eef2f7;--line:#d9e0e9;--txt:#1a2230;--dim:#4e5b6d;--acc:#2f6feb}
  html[data-theme="sand"]{--bg:#f7f2e8;--panel:#fffdf8;--panel2:#f3ece0;--line:#e0d5c2;--txt:#33291c;--dim:#66563f;--acc:#c2410c}
  html[data-theme="forest"]{--bg:#0f1a14;--panel:#16241b;--panel2:#1d2f22;--line:#2a4433;--txt:#e8f2ea;--dim:#8aa697;--acc:#4ade80}
  html[data-theme="mono"]{--bg:#15171b;--panel:#1c1f24;--panel2:#23272e;--line:#2e333b;--txt:#e8eaee;--dim:#98a0aa;--acc:#c9d1d9}
  html[data-theme="cyber"]{--bg:#120a1f;--panel:#1b1032;--panel2:#241542;--line:#3a2166;--txt:#f1eaff;--dim:#a98fd6;--acc:#c084fc}
  html[data-theme="night"]{--bg:#0b0f14;--panel:#151b24;--panel2:#1b232e;--line:#2a3442;--txt:#e6edf3;--dim:#8b949e;--acc:#58a6ff}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","Segoe UI",system-ui,sans-serif;line-height:1.7}
  .wrap{max-width:860px;margin:0 auto;padding:36px 22px 60px}
  a.back{color:var(--dim);text-decoration:none;font-size:13px}
  a.back:hover{color:var(--acc)}
  h1{font-size:24px;margin:14px 0 4px;color:var(--acc)}
  .sub{color:var(--dim);font-size:14px;margin-bottom:26px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px;margin-bottom:18px}
  .panel h2{font-size:16px;margin:0 0 12px;color:var(--txt)}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .stat{flex:1;min-width:120px}
  .stat .k{font-size:12px;color:var(--dim)}
  .stat .v{font-size:22px;font-weight:700;color:var(--acc)}
  .task{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--panel2)}
  .task:last-child{border-bottom:none}
  .task .t{font-weight:600}
  .task .n{font-size:13px;color:var(--dim)}
  .go{margin-left:auto;padding:8px 18px;background:var(--acc);border:1px solid var(--acc);color:#fff;
    border-radius:7px;text-decoration:none;font-size:14px;white-space:nowrap}
  .go:hover{background:var(--acc)}
  .cal{margin-top:12px}
  .calTitle{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:10px;letter-spacing:.5px}
  .calWeek{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
  .calWeek div{font-size:11px;color:var(--dim);text-align:center;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .grid .cell{height:44px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;background:var(--panel2);color:var(--dim);font-size:13px;
    border:1px solid transparent;font-variant-numeric:tabular-nums}
  .grid .cell.blank{background:transparent;border:0}
  .grid .cell.rest{background:transparent;color:var(--dim);opacity:.45;border:1px dashed var(--line)}
  .grid .cell.done{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
  .grid .cell.today{border:2px solid var(--acc);color:var(--acc);font-weight:700;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
  .grid .cell.rest.today{background:var(--panel2)}
  .grid .cell.done.today{border-color:var(--txt);color:#fff}
  
  textarea{width:100%;height:70px;background:var(--bg);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;padding:10px;font-family:Consolas,monospace;font-size:13px;resize:vertical}
  button{padding:9px 20px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:7px;
    font-size:14px;cursor:pointer;font-family:inherit}
  button:hover{background:#2d333b}
  button.main{background:var(--acc);border-color:var(--acc);color:#fff}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
  td,th{padding:6px 8px;border-bottom:1px solid var(--panel2);text-align:left}
  th{color:var(--dim);font-weight:500}
  .hint{font-size:13px;color:var(--dim)}
  code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-size:12px}
  details{margin-bottom:18px}
  details summary{cursor:pointer;font-size:15px;font-weight:600;color:var(--txt);padding:6px 2px;list-style:none;user-select:none}
  details summary::before{content:'▸ ';color:var(--acc)}
  details[open] summary::before{content:'▾ '}

  /* 隐藏滚动条（仍可滚动） */
  html{scrollbar-width:none}
  html::-webkit-scrollbar{display:none}
  ::-webkit-scrollbar{width:0;height:0}

  /* 手机单列：任务行折行，不再横向溢出 */
  @media (max-width:560px){
    .wrap{width:auto;max-width:100%;padding:16px 12px;overflow-x:hidden}
    .task{flex-wrap:wrap;gap:8px}
    .task .n{flex:1 1 100%;min-width:0;word-break:break-word}
    .task .go{margin-left:0}
    h1{font-size:22px}
    table{display:block;overflow-x:auto}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">← 返回首页</a>
  <h1>四周训练计划</h1>
  <div class="sub">每天 15 分钟 · 5 天训练 2 天休息 · 命中率保持 70-85%</div>

  <div class="panel">
    <h2 id="todayTitle">今日任务</h2>
    <div id="tasks"></div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="main" id="markDone">标记今天完成</button>
      <button id="resetAll">重新开始（清空记录）</button>
    </div>
    <div class="hint" id="todayHint" style="margin-top:10px"></div>
  </div>

  <div class="panel" style="padding:12px 22px">
    <div style="font-size:13px;color:var(--dim)"><b id="dayNo" style="color:var(--txt)">—</b> · <b id="weekNo" style="color:var(--txt)">—</b> · 已完成 <b id="doneNo" style="color:var(--acc)">0</b> · 连续 <b id="streakNo" style="color:var(--acc)">0</b></div>
  </div>

  <details>
    <summary>进度</summary>
    <div class="panel">
      <div class="hint">高亮 = 已完成 · 描边 = 今天 · 淡色 = 周末休息</div>
      <div class="cal">
        <div class="calTitle" id="calTitle"></div>
        <div class="calWeek" id="calWeek"></div>
        <div class="grid" id="grid"></div>
      </div>
    </div>
  </details>

  <details>
    <summary>训练记录</summary>
    <div class="panel">
      <div class="hint">训练器成绩会自动计入日历；把「复制本组数据」粘到这里可留档详情。</div>
      <textarea id="logInput" placeholder="2026-10-24  限时450ms  命中率83%  中位436ms  超时5次"></textarea>
      <div style="margin-top:10px;display:flex;gap:10px">
        <button class="main" id="addLog">保存这条</button>
        <button id="copyAll">复制全部</button>
      </div>
      <table id="logTable"></table>
    </div>
  </details>
</div>

<script>
(function(){
  function apply(t){ if(!t) return; document.documentElement.setAttribute('data-theme', t); }
  var q=null;
  try{ q=new URLSearchParams(location.search).get('theme'); }catch(e){}
  try{ apply(q || localStorage.getItem('cs2at.theme') || (function(){var d=new Date(),tm=d.getHours()*60+d.getMinutes();return (tm>=1410||tm<460)?'forest':'sand';})()); }catch(e){ apply('sand'); }
  addEventListener('message', function(e){
    if(e && e.data && e.data.type==='theme'){ apply(e.data.theme); }
    if(e && e.data && e.data.type==='wantTheme'){
      try{ parent.postMessage({type:'theme', theme:document.documentElement.getAttribute('data-theme')}, '*'); }catch(err){}
    }
  });

  // 高度上报给父页面，让 iframe 撑开，用主滚动条滚动
  function reportHeight(){
    try{
      var h=Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
      if(parent && parent!==window) parent.postMessage({type:'height', h:h}, '*');
    }catch(err){}
  }
  addEventListener('load', function(){ reportHeight(); setTimeout(reportHeight,200); });
  if(window.ResizeObserver){ new ResizeObserver(reportHeight).observe(document.body); }
  setTimeout(reportHeight,120);
})();
const K_START='cs2at.start', K_LOG='cs2at.log', K_CFG='cs2at.cfg';
const $=id=>document.getElementById(id);
const todayStr=()=>{ const d=new Date(),p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); };
const dayIdx=()=>{ const s=localStorage.getItem(K_START); if(!s) return -1; return Math.floor((new Date(todayStr())-new Date(s))/86400000); };
const weekOf=d=>Math.min(4, Math.floor(Math.max(0,d)/7)+1);

function cfgQuery(){
  try{ const c=JSON.parse(localStorage.getItem(K_CFG)||'{}');
    const p=[]; if(c.dpi) p.push('dpi='+c.dpi); if(c.cm) p.push('cm='+c.cm);
    if(c.yaw) p.push('yaw='+c.yaw); if(c.sens) p.push('sens='+c.sens);
    return p.length? '&'+p.join('&') : '';
  }catch(e){ return ''; }
}

function planFor(w){
  const base='tools/aim-trainer.html';
  if(w===1) return [
    {t:'热身 · 定角重复', u:base+'?mode=block&count=40&limit=0', n:'两个角度各 8 球，让手热起来，不记录'},
    {t:'主练 · 自适应随机 ×2', u:base+'?mode=random&count=40&limit=1', n:'只追命中率 80%，不要主动抢时间'},
    {t:'精度 · 小球 0.7°', u:base+'?mode=precision&count=40&limit=0', n:'记录命中率，目标 35%+'}
  ];
  if(w===2) return [
    {t:'热身 · 定角重复', u:base+'?mode=block&count=40&limit=0', n:'同上'},
    {t:'主练 · 自适应随机 ×2', u:base+'?mode=random&count=40&limit=1', n:'开始前把限时设为昨天的最低值'},
    {t:'精度 · 小球 0.7°', u:base+'?mode=precision&count=40&limit=0', n:'记录命中率'}
  ];
  if(w===3) return [
    {t:'热身 · 定角重复 ×2', u:base+'?mode=block&count=40&limit=0', n:'两个角度各一轮'},
    {t:'主练 · 自适应随机 ×2', u:base+'?mode=random&count=40&limit=1', n:'限时继续压'},
    {t:'精度 · 小球 0.7°', u:base+'?mode=precision&count=40&limit=0', n:'目标 40%+'},
    {t:'死斗 · 只打头', u:'', n:'实战 10 分钟，单发爆头，打完回中'}
  ];
  return [
    {t:'热身 · 定角重复', u:base+'?mode=block&count=40&limit=0', n:'激活手感'},
    {t:'主练 · 自适应随机', u:base+'?mode=random&count=40&limit=1', n:'一组就够'},
    {t:'实战', u:'', n:'剩下的时间全部实战，不测数据'}
  ];
}

function render(){
  let d=dayIdx();
  if(d<0){ try{ localStorage.setItem(K_START, todayStr()); }catch(e){} d=0; }   // 首次访问直接按第 1 天渲染，不刷新
  const w=weekOf(d);
  $('dayNo').textContent='第 '+(d+1)+' 天';
  $('weekNo').textContent='第 '+w+' 周';
  const log=JSON.parse(localStorage.getItem(K_LOG)||'[]');
  // 同源自动并入训练器成绩日期（cs2at.runs）：练完自动计入，不用再复制粘贴
  const set=new Set(log.map(x=>x.slice(0,10)));
  try{
    const hist=JSON.parse(localStorage.getItem('cs2at.runs')||'[]');
    if(Array.isArray(hist)) hist.forEach(x=>{
      const s=String(x.d||'').slice(0,10);
      if(/^\d{4}-\d{2}-\d{2}$/.test(s)) set.add(s);
    });
  }catch(e){}
  // 已完成：只数程序区间（28 天）内有记录的天数，不限区间外
  const startT=new Date(localStorage.getItem(K_START)||todayStr()).getTime();
  let doneIn=0;
  set.forEach(k=>{ const t=new Date(k).getTime(); if(t>=startT && t<startT+28*86400000) doneIn++; });
  $('doneNo').textContent=doneIn;

  // 连续天数
  let streak=0;
  for(let i=0;i<60;i++){ const dt=new Date(Date.now()-i*86400000);
    const p=n=>String(n).padStart(2,'0');
    const k=dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate());
    if(set.has(k)) streak++; else if(i>0) break; }
  $('streakNo').textContent=streak;

  const isRest=((new Date().getDay()===0)||(new Date().getDay()===6));   // 周末休息，跟日历一致
  $('todayTitle').textContent='今日任务 · 第 '+(d+1)+' 天（第 '+w+' 周）';
  $('todayHint').textContent = isRest
    ? '今天是休息日。睡够 7-8 小时，技能靠睡眠巩固。'
    : '训练器成绩会自动计入日历；把「复制本组数据」粘到记录里可留档详情。';

  const q=cfgQuery();
  const tasks=planFor(w);
  $('tasks').innerHTML = tasks.map(t=>{
    const href=t.u? (t.u+q):'';
    const btn = href? '<a class="go" target="_blank" href="'+href+'">开始</a>' : '<span class="go" style="background:var(--panel2);border-color:var(--line);color:var(--dim)">实战</span>';
    return '<div class="task"><div><div class="t">'+t.t+'</div><div class="n">'+t.n+'</div></div>'+btn+'</div>';
  }).join('');

  // 进度格
  // 日历渲染
  const startDt=new Date(localStorage.getItem(K_START));
  const pd=n=>String(n).padStart(2,'0');
  const wd=(startDt.getDay()+6)%7;          // 周一=0
  const WEEK=['一','二','三','四','五','六','日'];
  $('calWeek').innerHTML=WEEK.map(w=>'<div>'+w+'</div>').join('');
  const months={}; 
  let g='';
  for(let i=0;i<wd;i++) g+='<div class="cell blank"></div>';
  for(let i=0;i<28;i++){
    const dt=new Date(startDt.getTime()+i*86400000);
    const k=dt.getFullYear()+'-'+pd(dt.getMonth()+1)+'-'+pd(dt.getDate());
    months[dt.getMonth()+1]=dt.getFullYear();
    const done=set.has(k);
    const rest=(dt.getDay()===0||dt.getDay()===6);   // 周末休息，与顶部提示同一规则
    const cls='cell'+(done?' done':rest?' rest':'')+(i===d?' today':'');
    g+='<div class="'+cls+'" title="'+k+(done?' · 已完成':'')+'">'+dt.getDate()+'</div>';
  }
  const total=wd+28, tail=(7-total%7)%7;
  for(let i=0;i<tail;i++) g+='<div class="cell blank"></div>';
  $('grid').innerHTML=g;
  const mk=Object.keys(months).map(Number);
  $('calTitle').textContent = mk.length===1
    ? months[mk[0]]+' 年 '+mk[0]+' 月'
    : months[mk[0]]+' 年 '+mk[0]+' 月 — '+mk[mk.length-1]+' 月';

  // 记录表
  if(log.length){
    $('logTable').innerHTML='<tr><th>日期</th><th>数据</th></tr>'+
      log.slice().reverse().slice(0,20).map(l=>'<tr><td>'+l.slice(0,10)+'</td><td>'+l.slice(10)+'</td></tr>').join('');
  } else $('logTable').innerHTML='';
}

$('markDone').addEventListener('click',()=>{
  const log=JSON.parse(localStorage.getItem(K_LOG)||'[]');
  if(log.some(x=>x.startsWith(todayStr()))){ alert('今天已经标记过了'); return; }
  log.push(todayStr()+'  已完成');
  localStorage.setItem(K_LOG, JSON.stringify(log));
  render();
});

$('resetAll').addEventListener('click',()=>{
  if(!confirm('清空所有进度和记录？')) return;
  localStorage.removeItem(K_START); localStorage.removeItem(K_LOG);
  location.reload();
});

$('addLog').addEventListener('click',()=>{
  const v=$('logInput').value.trim(); if(!v) return;
  const log=JSON.parse(localStorage.getItem(K_LOG)||'[]');
  log.push(v); localStorage.setItem(K_LOG, JSON.stringify(log));
  $('logInput').value=''; render();
});

$('copyAll').addEventListener('click',()=>{
  const log=JSON.parse(localStorage.getItem(K_LOG)||'[]');
  const txt=log.join('\n');
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>alert('已复制 '+log.length+' 条'));
  else alert(txt);
});

render();

/* ===== 英文界面 ===== */
(function(){
  var EN=(function(){ try{ var q=new URLSearchParams(location.search); if(q.get('lang')) return q.get('lang')==='en'; return localStorage.getItem('cs2at.lang')==='en'; }catch(e){ return false; } })();
  if(!EN) return;
  var D={
    '← 返回首页':'← Home','四周训练计划':'Four-week plan',
    '每天 15 分钟 · 5 天训练 2 天休息 · 命中率保持 70-85%':'15 min a day · 5 on / 2 off · keep hit rate 70–85%',
    '第几天':'Day','当前阶段':'Week','已完成':'Done','连续':'Streak','今日任务':'Today',
    '标记今天完成':'Mark today done','重新开始（清空记录）':'Start over (clear log)',
    '进度':'Progress','高亮 = 已完成 · 描边 = 今天 · 淡色 = 周末休息':'Highlighted = done · outlined = today · faded = weekend rest',
    '训练记录':'Training log',
    '训练器成绩会自动计入日历；把「复制本组数据」粘到这里可留档详情。':'Trainer results now count automatically; paste "Copy this set" here to archive details.',
    '保存这条':'Save entry','复制全部':'Copy all',
    '今天是休息日。睡够 7-8 小时，技能靠睡眠巩固。':'Rest day. Sleep 7–8 hours — skill consolidates overnight.',
    '训练器成绩会自动计入日历；把「复制本组数据」粘到记录里可留档详情。':'Trainer results now count automatically; paste "Copy this set" into the log to archive details.',
    '热身 · 定角重复':'Warm-up · Fixed angle','主练 · 自适应随机 ×2':'Main · Adaptive random ×2',
    '精度 · 小球 0.7°':'Precision · 0.7° dots','热身 · 定角重复 ×2':'Warm-up · Fixed angle ×2',
    '死斗 · 只打头':'Deathmatch · headshots only','主练 · 自适应随机':'Main · Adaptive random',
    '实战':'Match play','两个角度各 8 球，让手热起来，不记录':'Two angles × 8 dots to warm up — not logged',
    '只追命中率 80%，不要主动抢时间':'Chase 80% hit rate only — don\'t rush',
    '记录命中率，目标 35%+':'Log hit rate — target 35%+','同上':'Same as above',
    '开始前把限时设为昨天的最低值':'Set the limit to yesterday\'s best before starting',
    '记录命中率':'Log hit rate','两个角度各一轮':'One round per angle',
    '限时继续压':'Keep pushing the limit','目标 40%+':'Target 40%+',
    '实战 10 分钟，单发爆头，打完回中':'10 min real match — single-tap headshots',
    '激活手感':'Wake the hand','一组就够':'One set is enough',
    '剩下的时间全部实战，不测数据':'Spend the rest on real matches — no data',
    '开始':'Start','一':'Mon','二':'Tue','三':'Wed','四':'Thu','五':'Fri','六':'Sat','日':'Sun',
    '· 已完成':' · Done','· 连续':' · Streak',
    '日期':'Date','数据':'Data','今天已经标记过了':'Already marked today',
    '清空所有进度和记录？':'Clear all progress and logs?','已复制':'Copied',
    '2026-10-24  限时450ms  命中率83%  中位436ms  超时5次':'e.g. 2026-10-24  limit 450ms  hit 83%  median 436ms  overtime 5'
  };
  var RULES=[
    [/^第 (\d+) 天$/,'Day $1'],
    [/^第 (\d+) 周$/,'Week $1'],
    [/^今日任务 · 第 (\d+) 天（第 (\d+) 周）$/,'Today · Day $1 (Week $2)'],
    [/^(\d+) 年 (\d+) 月$/,'$2/$1'],
    [/^(\d+) 年 (\d+) 月 — (\d+) 月$/,'$1/$2 — $3'],
    [/^已复制 (\d+) 条$/,'Copied $1']
  ];
  var D2={}; for(var k in D){ D2[k.replace(/\s+/g,'')]=D[k]; }
  function tr(t){
    var s=t.trim(); if(!s) return t;
    if(D[s]!==undefined) return t.replace(s,D[s]);
    var flat=s.replace(/\s+/g,'');
    if(D2[flat]!==undefined) return t.replace(s, D2[flat]);
    for(var i=0;i<RULES.length;i++) if(RULES[i][0].test(s)) return t.replace(s, s.replace(RULES[i][0], RULES[i][1]));
    return t;
  }
  function walk(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n;
    while((n=w.nextNode())){ var v=n.nodeValue; if(!v||!/[\u4e00-\u9fa5]/.test(v)) continue; var nv=tr(v); if(nv!==v) n.nodeValue=nv; }
    document.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(function(el){
      var ph=el.getAttribute('placeholder');
      if(ph) el.setAttribute('placeholder', (D[ph.trim()]!==undefined? D[ph.trim()] : tr(ph)));
    });
    document.querySelectorAll('[title]').forEach(function(el){
      el.setAttribute('title', el.getAttribute('title').replace(' · 已完成',' · done'));
    });
  }
  walk();
  new MutationObserver(walk).observe(document.body,{childList:true,subtree:true,characterData:true});
})();
</script>

<script>/* 剪贴板兜底：writeText 在失焦/无权限时抛 NotAllowedError（未捕获会进 console），统一降级到 execCommand */
(function(){
  try{
    var c = navigator.clipboard;
    if(!c || !c.writeText) return;
    var orig = c.writeText.bind(c);
    c.writeText = function(t){
      return orig(t).catch(function(){
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly','');
        ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, ta.value.length);
        var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
        ta.remove();
        if(!ok){ try{ window.prompt('复制失败，请手动复制：', t); }catch(e){} }   // 兜底：绝不抛未捕获异常
      });
    };
  }catch(e){}
})();</script>

<style>
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Segoe UI",system-ui,sans-serif}

  #hud b{color:var(--hud-acc,var(--acc))}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;font-size:16px;line-height:2;color:var(--txt);background:var(--overlay);overflow:auto;padding:24px}
  /* 结果页内容比视口高时，居中会裁掉顶部且滚不上去；safe center 在溢出时退回 start */
  .overlay{align-items:safe center;justify-content:safe center}
  .overlay.show{display:flex}
  /* 开始/暂停页：文案区局部 scrim（只盖中间带，不整体加遮罩，保住天空与地面的纵深） */
  #msg::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 62% 26% at 50% 47%,
      rgba(var(--scrim-rgb,11,15,20), var(--scrim-a,.35)) 0%,
      rgba(var(--scrim-rgb,11,15,20), var(--scrim-a,.35)) 30%,
      rgba(var(--scrim-rgb,11,15,20), 0) 100%)}
  #msg>*{position:relative;z-index:1}
  /* 结果页：半透明面板承载内容（正文 ≥7:1 / 次要 ≥4.5:1），按钮按主/次分层 */
  #resPanel{box-sizing:border-box;width:100%;max-width:640px;padding:32px 56px 32px 32px;border-radius:0;text-align:left;line-height:1.5;

    border:1px solid var(--line)}
  #res .btn{background-color:transparent;border:1px solid color-mix(in srgb,var(--txt) 32%,transparent);color:var(--txt)}
  #res .btn:hover{background-color:transparent;border-color:var(--txt)}
  #res #again{background-color:var(--txt);border-color:var(--txt);color:var(--bg);font-weight:600}
  #res #again:hover{background-color:var(--txt);border-color:var(--txt)}
  /* 动作行：同一竖线左对齐，竖排（主按钮在上，次按钮在下） */

  .res-sec+:is(.res-advice,.res-table,.res-bars){margin-top:8px}

  .btn.alt{background:var(--panel);border-color:var(--line);margin-left:10px;color:var(--txt)}
  .btn.alt:hover{background:var(--panel);border-color:var(--acc);color:var(--acc)}

  .fld select{padding:7px 9px;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:7px;font-size:14px;font-family:inherit;width:auto;max-width:100%;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.07)}
  summary::-webkit-details-marker{display:none}

  .res-num{font-size:clamp(28px,3.2vw,40px);font-weight:800;line-height:40px;letter-spacing:-.01em;

  .more[open]>summary::before{content:"▾ "}
  .more table{margin-top:14px}
  .moreFoot{margin-top:10px;font-size:13px;color:var(--dim);text-align:center}

  /* ===== 动效（art-direction §3）：出现 220ms 淡入+8px，hover 140ms，按下 90ms；reduced-motion 无位移 ===== */
  @keyframes art-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: no-preference){
    .overlay.show>*{animation:art-in 220ms cubic-bezier(.2,.8,.2,1) backwards}
    .btn,.btn.alt{transition:transform 140ms cubic-bezier(.2,.8,.2,1),background-color 140ms ease,color 140ms ease,border-color 140ms ease}
    .btn:hover,.btn.alt:hover{transform:translateY(-2px)}
    .btn:active,.btn.alt:active{transform:scale(.98)}
    #more{transition:transform 140ms cubic-bezier(.2,.8,.2,1),color 140ms ease,border-color 140ms ease}
    #more:hover{transform:translateY(-2px)}
    #more:active{transform:scale(.98)}
  }
  @media (prefers-reduced-motion: reduce){
    .overlay.show>*{animation:none!important}
    .btn:hover,.btn.alt:hover,.btn:active,.btn.alt:active,#more:hover,#more:active,
    #fsBtn:hover,#fsBtn:active,#resSubActions .btn:hover,#resSubActions .btn:active{transform:none!important}

    #res .res-table tbody tr{transition:none!important}
  }

  /* ===== 平面（art-direction-flat）：只有 1px 线 + 纯色块 + 留白 ===== */
  #go, #fsBtn, #more, #resSubActions .btn, .btn, .btn.alt,
  #resPanel, .fld input, .fld select, #back{border-radius:0;box-shadow:none;background-image:none}
  /* 主操作：一屏唯一的填色按钮 */

    transition:background-color 140ms ease,border-color 140ms ease}
  #go:hover{background-color:color-mix(in srgb,var(--acc) 94%,#000);border-color:color-mix(in srgb,var(--acc) 94%,#000);transform:none}
  #go:active{background-color:color-mix(in srgb,var(--acc) 84%,#000);border-color:color-mix(in srgb,var(--acc) 84%,#000);transform:none}
  #res #again{background-color:var(--txt);border:1px solid var(--txt);color:var(--bg);
    transition:background-color 140ms ease,border-color 140ms ease}
  #res #again:hover{background-color:color-mix(in srgb,var(--txt) 94%,#000);border-color:color-mix(in srgb,var(--txt) 94%,#000);transform:none}
  #res #again:active{background-color:color-mix(in srgb,var(--txt) 84%,#000);border-color:color-mix(in srgb,var(--txt) 84%,#000);transform:none}
  /* 次级按钮：不填色，透明底 + 1px 线 + 中性文字（hover 4% / 按下 8%） */
  #fsBtn, #more, #resSubActions .btn{background-color:transparent;border:1px solid var(--line);color:var(--dim);
    box-shadow:none;background-image:none;
    transition:background-color 140ms ease,color 140ms ease,border-color 140ms ease}
  #fsBtn:hover, #more:hover, #resSubActions .btn:hover{background-color:color-mix(in srgb,var(--txt) 4%,transparent);
    border-color:var(--line);color:var(--txt);transform:none}
  #fsBtn:active, #more:active, #resSubActions .btn:active{background-color:color-mix(in srgb,var(--txt) 8%,transparent);
    border-color:var(--line);color:var(--txt);transform:none}
  /* focus：1px 强调边 + 向外 2px 的第二道 1px 线（双线，不是光晕） */
  #go:focus-visible, #res #again:focus-visible, #fsBtn:focus-visible, #more:focus-visible,
  #resSubActions .btn:focus-visible, .btn:focus-visible, .btn.alt:focus-visible,
  .fld input:focus-visible, .fld select:focus-visible, #back:focus-visible{
    outline:1px solid var(--acc);outline-offset:2px;border-color:var(--acc)}
  /* 结果面板：无玻璃、无阴影、直角 */
  #resPanel{border:1px solid var(--line);border-radius:0;box-shadow:none;background-image:none;
    -webkit-backdrop-filter:none;backdrop-filter:none}
  /* 网格：左边缘对齐同一竖线；行高 8 的倍数 */
  #msgCol{width:100%;max-width:560px;margin:0 auto;text-align:left;display:flex;flex-direction:column;align-items:flex-start}
  #resActions{flex-direction:column;align-items:flex-start;gap:8px}
  #resSubActions{flex-direction:column;align-items:flex-start;gap:8px}
  #resActions .btn{transform:none}
  .res-table td,.res-table th{height:32px}
  .res-sec{margin-top:24px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);line-height:16px}
  .res-sec b{font-weight:500;color:var(--dim)}
</style>

<script>/* --on-acc 自适应：按强调色亮度自动选黑/白，修「白字压亮绿 1.74:1」的老问题。
   只改 --on-acc 这一个变量；--acc 与其它颜色一律不动。越早越好：body 一出现就执行。 */
(function(){
  function relLum(c){
    c=(c||'').trim();
    var hx=/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(c);
    if(hx){
      var h=hx[1]; if(h.length===3){h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];}
      var n=parseInt(h,16), rgb=[(n>>16)&255,(n>>8)&255,n&255];
      function f(v){ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
      return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);
    }
    var m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c); if(!m) return 0;
    function f2(v){ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
    return 0.2126*f2(+m[1]) + 0.7152*f2(+m[2]) + 0.0722*f2(+m[3]);
  }
  function apply(){
    try{
      var acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
      var L=relLum(acc);
      var want=L>0.32 ? '#0b0f14' : '#ffffff';
      var r=document.documentElement.style;
      if(r.getPropertyValue('--on-acc').trim()!==want) r.setProperty('--on-acc',want);
    }catch(e){}
  }
  apply();
  try{ new MutationObserver(apply).observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','style']}); }catch(e){}
  try{ addEventListener('load',apply); }catch(e){}
})();</script>

<script>
const cv=document.getElementById('c');
let ctx=null;
try{ ctx=cv.getContext('2d',{desynchronized:true}); }catch(e){}
if(!ctx) ctx=cv.getContext('2d');
const hud=document.getElementById('hud');
const msg=document.getElementById('msg'), go=document.getElementById('go');
const res=document.getElementById('res'), resBody=document.getElementById('resBody');

const wrapPi=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
const med=a=>{ if(!a.length)return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; };
function shade(hex, amt){   // 六位色值加亮/压暗
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return hex;
  const n=parseInt(h,16);
  const c=[(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,v+amt)));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
function hexA(hex,a){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return 'rgba(88,166,255,'+a+')';
  const n=parseInt(h,16);
  return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}

function toCam(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1=x*cy-z*sy, z1=x*sy+z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return {x:x1, y:y*cp-z1*sp, z:y*sp+z1*cp};
}
const projCam=c=>({sx:W/2+(c.x/c.z)*f, sy:H/2-(c.y/c.z)*f});
const project=(x,y,z)=>{ const c=toCam(x,y,z); return c.z<=NEAR?null:projCam(c); };
function line3(x1,y1,z1,x2,y2,z2,col){
  let a=toCam(x1,y1,z1), b=toCam(x2,y2,z2);
  if(a.z<NEAR&&b.z<NEAR) return;
  if(a.z<NEAR){ const t=(NEAR-a.z)/(b.z-a.z); a={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:NEAR}; }
  else if(b.z<NEAR){ const t=(NEAR-b.z)/(a.z-b.z); b={x:b.x+(a.x-b.x)*t,y:b.y+(a.y-b.y)*t,z:NEAR}; }
  const pa=projCam(a), pb=projCam(b);
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
}

/* ===== 游标卡尺竞技场 · 视觉层（只画，不改判定 / 统计 / 模式 / 设置） =====
   概念：Vernier = 游标卡尺。整个场地做成一把看得见的量角卡尺：
   - 地面 5° 短刻度 + 15° 长刻度，远端标注角度，同心刻度圈像游标主尺；
   - 天顶同构刻度（更疏更淡），形成封闭的量测盒；
   - 地平线：远景剪影 + 渐变雾 + 主色光晕 + 地球线，营造纵深；
   - 空气感：缓慢漂移的尘埃（54 颗，数量常量）；
   - 命中：扩散圆环 + 12 条径向刻线，180ms 内淡出（未命中不画）；
   - 边缘：烘焙暗角 + 极淡颗粒；底部一条卡尺刻度 + VERNIER 读数标识。
   性能：所有数组/刻度坐标在初始化时生成；绘制循环内不 new 对象；
   雾带 / 暗角 / 颗粒全部烘焙进离屏画布，每帧只多两次 drawImage。颜色一律取自 SC。 */
const ARENA={
  step:5*D2R, major:15*D2R,
  r0:2.4, rOut:44,
  bandR:[2.4,10,19,29,44],
  minorA:[1.00,0.72,0.46,0.22],
  majorA:[1.00,0.90,0.68,0.38],
  ringR:[6,12,18,24,30,36,42],
  ringA:[0.55,0.45,0.36,0.28,0.21,0.15,0.10],
  ringSeg:[24,28,32,36,40,44,48],
  ceilBand:[2.4,15,29,44],
  ceilA:[0.62,0.38,0.20],
  ceilR:[20,32,42],
  ceilRA:[0.20,0.12,0.07],
  ceilSeg:[32,40,46],
  labelR:29, labelA:0.66,
  axisA:0.78,
  dustN:54,
  vigA:0.46, grain:0.42,
  hazeH:0.55,
  idleMs:33
};
const AR_SIN=new Float32Array(72), AR_COS=new Float32Array(72);
for(let i=0;i<72;i++){ const a=i*ARENA.step; AR_SIN[i]=Math.sin(a); AR_COS[i]=Math.cos(a); }
const AR_LABELS=(function(){ const o=[]; for(let i=0;i<24;i++) o.push((i*15)+'°'); return o; })();
const AR_RINGS=(function(){
  const list=[];
  for(let k=0;k<ARENA.ringR.length;k++){
    const rad=ARENA.ringR[k], seg=ARENA.ringSeg[k], pts=new Float32Array((seg+1)*2);
    for(let j=0;j<=seg;j++){ const a=j/seg*Math.PI*2; pts[j*2]=Math.sin(a)*rad; pts[j*2+1]=Math.cos(a)*rad; }
    list.push({seg:seg, pts:pts});
  }
  return list;
})();
const AR_CEIL_RINGS=(function(){
  const list=[];
  for(let k=0;k<ARENA.ceilR.length;k++){
    const rad=ARENA.ceilR[k], seg=ARENA.ceilSeg[k], pts=new Float32Array((seg+1)*2);
    for(let j=0;j<=seg;j++){ const a=j/seg*Math.PI*2; pts[j*2]=Math.sin(a)*rad; pts[j*2+1]=Math.cos(a)*rad; }
    list.push({seg:seg, pts:pts});
  }
  return list;
})();
const AR_TICK_COS=new Float32Array(12), AR_TICK_SIN=new Float32Array(12);
for(let i=0;i<12;i++){ const a=i*Math.PI/6; AR_TICK_COS[i]=Math.cos(a); AR_TICK_SIN[i]=Math.sin(a); }

// 相机三角：每帧算一次，给本轮所有投影复用（避免每点重复 cos/sin，也避免建对象）
let _ay=1,_as=0,_ap=1,_asp=0;
function arenaCamSetup(){ _ay=Math.cos(yaw); _as=Math.sin(yaw); _ap=Math.cos(pitch); _asp=Math.sin(pitch); }
let _ax=0,_ayy=0,_az=0,_bx=0,_by=0,_bz=0,_px=0,_py=0,_pz=0;
function _camA(x,y,z){ const x1=x*_ay-z*_as, z1=x*_as+z*_ay; _ax=x1; _ayy=y*_ap-z1*_asp; _az=y*_asp+z1*_ap; }
function _camB(x,y,z){ const x1=x*_ay-z*_as, z1=x*_as+z*_ay; _bx=x1; _by=y*_ap-z1*_asp; _bz=y*_asp+z1*_ap; }
function _pt(x,y,z){ _camA(x,y,z); if(_az<=NEAR) return false; _pz=_az; _px=W/2+(_ax/_az)*f; _py=H/2-(_ayy/_az)*f; return true; }
function _seg(x1,y1,z1,x2,y2,z2){
  _camA(x1,y1,z1); _camB(x2,y2,z2);
  let ax=_ax, ay=_ayy, az=_az, bx=_bx, by=_by, bz=_bz;
  if(az<=NEAR){
    if(bz<=NEAR) return;
    const t=(NEAR-az)/(bz-az); ax+=(bx-ax)*t; ay+=(by-ay)*t; az=NEAR;
  } else if(bz<=NEAR){
    const t=(NEAR-bz)/(az-bz); bx+=(ax-bx)*t; by+=(ay-by)*t; bz=NEAR;
  }
  ctx.moveTo(W/2+(ax/az)*f, H/2-(ay/az)*f);
  ctx.lineTo(W/2+(bx/bz)*f, H/2-(by/bz)*f);
}

// 场景明暗调优：浅色场景（SC.dark=false）提对比：刻线透明度 ×1.7、线宽 ×1.2；
// night / jade / ink 等暗色场景倍率恒为 1，渲染结果与之前完全一致。
let _arBoost=1, _arLW=1, _arLabelA=0.66;
function _arTune(){
  const light=!SC.dark;
  _arBoost=light?1.8:1;
  _arLW=light?1.2:1;
  _arLabelA=Math.min(1, ARENA.labelA*(light?1.7:1));
}
function _arA(a){ const v=a*_arBoost; return v>1?1:v; }

const _AR_CY=4.2;   // 天顶高度（沿用旧网格）
function arenaCeiling(){
  const dpr=devicePixelRatio||1;
  for(let b=0;b<3;b++){
    ctx.beginPath();
    for(let i=0;i<72;i+=3){
      const s=AR_SIN[i], c=AR_COS[i];
      _seg(ARENA.ceilBand[b]*s, _AR_CY, ARENA.ceilBand[b]*c, ARENA.ceilBand[b+1]*s, _AR_CY, ARENA.ceilBand[b+1]*c);
    }
    ctx.globalAlpha=_arA(ARENA.ceilA[b]); ctx.strokeStyle=SC.ceil; ctx.lineWidth=1*dpr*_arLW; ctx.stroke();
  }
  for(let k=0;k<AR_CEIL_RINGS.length;k++){
    const R=AR_CEIL_RINGS[k], pts=R.pts;
    ctx.beginPath();
    for(let j=0;j<R.seg;j++) _seg(pts[j*2], _AR_CY, pts[j*2+1], pts[j*2+2], _AR_CY, pts[j*2+3]);
    ctx.globalAlpha=_arA(ARENA.ceilRA[k]); ctx.strokeStyle=SC.ceil; ctx.lineWidth=1*dpr*_arLW; ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function arenaFloor(){
  const gY=-EYE, dpr=devicePixelRatio||1;
  // 5° 短刻度：4 段近实远淡，远端停在外圈内侧
  for(let b=0;b<4;b++){
    ctx.beginPath();
    for(let i=0;i<72;i++){
      if(i%3===0) continue;
      const s=AR_SIN[i], c=AR_COS[i], r1=ARENA.bandR[b], r2=(b<3?ARENA.bandR[b+1]:ARENA.rOut-2.6);
      _seg(r1*s, gY, r1*c, r2*s, gY, r2*c);
    }
    ctx.globalAlpha=_arA(ARENA.minorA[b]); ctx.strokeStyle=SC.minor; ctx.lineWidth=(b<2?1.1:0.9)*dpr*_arLW; ctx.stroke();
  }
  // 15° 长刻度：贯通半径，远端越出外圈一点（卡尺主刻度）
  for(let b=0;b<4;b++){
    ctx.beginPath();
    for(let i=0;i<72;i+=3){
      const s=AR_SIN[i], c=AR_COS[i], r1=ARENA.bandR[b], r2=(b<3?ARENA.bandR[b+1]:ARENA.rOut+1.4);
      _seg(r1*s, gY, r1*c, r2*s, gY, r2*c);
    }
    ctx.globalAlpha=_arA(ARENA.majorA[b]); ctx.strokeStyle=SC.major; ctx.lineWidth=(b<2?1.8:1.3)*dpr*_arLW; ctx.stroke();
  }
  // 0° 主轴：基准线
  ctx.beginPath(); _seg(ARENA.r0, gY, 0, ARENA.rOut, gY, 0);
  ctx.globalAlpha=_arA(ARENA.axisA); ctx.strokeStyle=SC.ui; ctx.lineWidth=2*dpr*_arLW; ctx.stroke();
  // 地面同心刻度圈
  for(let k=0;k<AR_RINGS.length;k++){
    const R=AR_RINGS[k], pts=R.pts;
    ctx.beginPath();
    for(let j=0;j<R.seg;j++) _seg(pts[j*2], gY, pts[j*2+1], pts[j*2+2], gY, pts[j*2+3]);
    ctx.globalAlpha=_arA(ARENA.ringA[k]); ctx.strokeStyle=SC.minor; ctx.lineWidth=1*dpr*_arLW; ctx.stroke();
  }
  // 量角器外缘（主色刻度框）
  const OR=AR_RINGS[AR_RINGS.length-1], opts=OR.pts;
  ctx.beginPath();
  for(let j=0;j<OR.seg;j++) _seg(opts[j*2], gY, opts[j*2+1], opts[j*2+2], gY, opts[j*2+3]);
  ctx.globalAlpha=_arA(0.32); ctx.strokeStyle=SC.major; ctx.lineWidth=1.4*dpr*_arLW; ctx.stroke();
  ctx.globalAlpha=_arA(0.30); ctx.strokeStyle=SC.ui; ctx.lineWidth=2.4*dpr*_arLW; ctx.stroke();
  ctx.globalAlpha=1;
}
function arenaLabels(){
  const dpr=devicePixelRatio||1, gY=-EYE+0.02;
  ctx.font='600 '+(11*dpr)+'px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=SC.ui;
  for(let i=0;i<24;i++){
    const idx=i*3, s=AR_SIN[idx], c=AR_COS[idx];
    if(!_pt(ARENA.labelR*s, gY, ARENA.labelR*c)) continue;
    if(_px<-26||_px>W+26||_py<-10||_py>H+10) continue;
    const edge=Math.min(_px, W-_px)/(W*0.16);
    ctx.globalAlpha=_arLabelA*Math.min(1, Math.max(0.16, edge));
    ctx.fillText(AR_LABELS[i], _px, _py);
  }
  ctx.globalAlpha=1; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

// —— 尘埃：54 颗常量粒子，屏幕比例坐标 + 深度视差，绘制循环内零分配 ——
const AR_DUST=(function(){
  const n=ARENA.dustN, d=new Float32Array(n*6);
  for(let i=0;i<n;i++){
    const o=i*6;
    d[o]=Math.random(); d[o+1]=Math.random();
    d[o+2]=(Math.random()*2-1)*0.010;
    d[o+3]=-0.004-Math.random()*0.012;
    d[o+4]=0.30+Math.random()*0.70;
    d[o+5]=Math.random()*6.2832;
  }
  return d;
})();
let _dustYaw=0,_dustPitch=0,_dustOk=false;
function drawArenaDust(now, dtMs){
  const dpr=devicePixelRatio||1, n=ARENA.dustN, d=AR_DUST, sec=Math.min(0.08, (dtMs||16)/1000);
  if(!_dustOk){ _dustYaw=yaw; _dustPitch=pitch; _dustOk=true; }
  const dy=wrapPi(yaw-_dustYaw), dp=pitch-_dustPitch; _dustYaw=yaw; _dustPitch=pitch;
  const tsec=now*0.001;
  ctx.beginPath();

    const r=(0.6+1.6*depth)*(0.82+0.28*Math.sin(tsec*0.7+d[o+5]))*dpr;
    if(r<=0.1) continue;

}

// —— 离屏缓存：地平线雾带 / 暗角 + 边缘颗粒（场景或分辨率变化才重建） ——
let arKey=null, arW=0, arH=0, arHazeCv=null, arHazeH=0, arVigCv=null;
function _mkCv(w,h){ const c=document.createElement('canvas'); c.width=Math.max(1, Math.floor(w)); c.height=Math.max(1, Math.floor(h)); return c; }
function _rgbOf(hex, amt){
  const h=String(hex||'').replace('#','');
  if(!/^[0-9a-fA-F]{6}$/.test(h)) return [0,0,0];
  const n=parseInt(h,16), a=amt||0;
  return [Math.max(0,Math.min(255,((n>>16)&255)+a)), Math.max(0,Math.min(255,((n>>8)&255)+a)), Math.max(0,Math.min(255,(n&255)+a))];
}
function arenaOverlayTint(){

    // 文案区的局部 scrim：浅色场景用 SC.bg 的暖白（0.55），暗色用 SC.bg 的暗色（0.35）
    const c=_rgbOf(SC.bg,0);
    document.documentElement.style.setProperty('--scrim-rgb', c[0]+','+c[1]+','+c[2]);
    document.documentElement.style.setProperty('--scrim-a', light?'0.55':'0.35');

    document.documentElement.style.setProperty('--res-panel-a', light?'0.92':'0.86');
  }catch(e){}
}
function arenaEnsureCache(){
  if(arKey===SC && arW===W && arH===H) return;
  arKey=SC; arW=W; arH=H;
  arenaOverlayTint();
  const hw=Math.max(2, Math.floor(W*0.5));
  // —— 地平线雾带（宽扁光晕 + 剪影 + 雾） ——
  const bandH=Math.max(160, Math.floor(H*ARENA.hazeH));
  arHazeH=bandH;
  const hh=Math.max(2, Math.floor(bandH*0.5));
  arHazeCv=_mkCv(hw,hh);
  const hg=arHazeCv.getContext('2d');
  if(hg){
    const hy=hh*0.5;
    if(SC.dark){
      // —— 暗色场景：原有「光晕 + 雾」配方，保持不变 ——
      const sil=_rgbOf(SC.bg, SC.dark?16:-18);
      hg.fillStyle='rgb('+sil[0]+','+sil[1]+','+sil[2]+')';
      hg.globalAlpha=SC.dark?0.50:0.34;
      hg.beginPath(); hg.moveTo(0, hy+2);
      for(let x=0;x<=hw;x+=3){
        const h1=(0.5+0.5*Math.sin(x*0.012+1.7))*hh*0.045;
        const h2=(0.5+0.5*Math.sin(x*0.029+4.1))*hh*0.028;
        hg.lineTo(x, hy-(h1+h2));
      }
      hg.lineTo(hw, hy+2); hg.closePath(); hg.fill();

      const lg=hg.createLinearGradient(0,0,0,hh);
      lg.addColorStop(0,'rgba('+fog[0]+','+fog[1]+','+fog[2]+',0)');
      lg.addColorStop(0.36,'rgba('+fog[0]+','+fog[1]+','+fog[2]+','+(fgc*0.5)+')');
      lg.addColorStop(0.50,'rgba('+fog[0]+','+fog[1]+','+fog[2]+','+fgc+')');
      lg.addColorStop(0.64,'rgba('+fog[0]+','+fog[1]+','+fog[2]+','+(fgc*0.5)+')');
      lg.addColorStop(1,'rgba('+fog[0]+','+fog[1]+','+fog[2]+',0)');
      hg.fillStyle=lg; hg.fillRect(0,0,hw,hh);

      const ui=_rgbOf(SC.ui||SC.cross,0);
      hg.save(); hg.translate(hw*0.5, hy); hg.scale(1,0.16);
      const rg=hg.createRadialGradient(0,0,0, 0,0, Math.max(hw*0.42, hh*1.4));
      rg.addColorStop(0,'rgba('+ui[0]+','+ui[1]+','+ui[2]+','+(SC.dark?0.30:0.20)+')');
      rg.addColorStop(0.45,'rgba('+ui[0]+','+ui[1]+','+ui[2]+','+(SC.dark?0.09:0.06)+')');
      rg.addColorStop(1,'rgba('+ui[0]+','+ui[1]+','+ui[2]+',0)');
      hg.fillStyle=rg; hg.fillRect(-hw, -hh*4, hw*2, hh*8);
      hg.restore();

    } else {

      // 1) 远景剪影：比底色略深
      const silD=_rgbOf(SC.bg,-26);

      hg.globalAlpha=0.42;

      for(let x=0;x<=hw;x+=3){
        const h1=(0.5+0.5*Math.sin(x*0.012+1.7))*hh*0.050;
        const h2=(0.5+0.5*Math.sin(x*0.029+4.1))*hh*0.032;

      hg.lineTo(hw, hy+2); hg.closePath(); hg.fill();
      hg.globalAlpha=1;
      // 2) 暗色压边：地平线附近一条柔和的暗带（不是加亮）
      const dk=_rgbOf(SC.bg,-48);
      const dkc='rgba('+dk[0]+','+dk[1]+','+dk[2]+',';
      const lg=hg.createLinearGradient(0,0,0,hh);
      lg.addColorStop(0, dkc+'0)');

      lg.addColorStop(0.50, dkc+'0.50)');

      lg.addColorStop(1, dkc+'0)');
      hg.fillStyle=lg; hg.fillRect(0,0,hw,hh);
      // 3) 地平线：一道暗细线 + 极轻主色线，压出边界
      const ui2=_rgbOf(SC.ui||SC.cross,0);
      hg.globalAlpha=0.34;
      hg.strokeStyle='rgb('+dk[0]+','+dk[1]+','+dk[2]+')';
      hg.lineWidth=1.2; hg.beginPath(); hg.moveTo(0,hy); hg.lineTo(hw,hy); hg.stroke();
      hg.globalAlpha=0.10;

  const vw=Math.max(2, Math.floor(W*0.5)), vh=Math.max(2, Math.floor(H*0.5));

    const cx=(vw-1)*0.5, cy=(vh-1)*0.5, inv=1/Math.sqrt(cx*cx+cy*cy);

}

// —— 命中读数：扩散圆环 + 12 条径向刻线（像卡尺读数跳动；120–180ms 淡出） ——
function drawHitFeedback(now){
  if(!hitFx || hitFxMode==='off') return;
  const leftMs=hitFx.until-now;
  if(!(leftMs>70)) return;
  const cp=Math.cos(hitFx.tp);
  if(!_pt(DIST*cp*Math.sin(hitFx.ty), DIST*Math.sin(hitFx.tp), DIST*cp*Math.cos(hitFx.ty))) return;
  const hx=_px, hy=_py;
  const k=Math.min(1,(leftMs-70)/180);
  const dpr=devicePixelRatio||1;
  const ringR=(10+(1-k)*46)*dpr;
  ctx.save();
  ctx.globalAlpha=k*1.1;
  ctx.strokeStyle=SC.ring||SC.tgt; ctx.lineWidth=3*dpr;
  ctx.beginPath(); ctx.arc(hx, hy, ringR, 0, 6.2831853); ctx.stroke();
  ctx.globalAlpha=k*0.95;
  ctx.strokeStyle=SC.tgt; ctx.lineWidth=1.6*dpr;
  ctx.beginPath();
  for(let i=0;i<12;i++){
    const ca=AR_TICK_COS[i], sa=AR_TICK_SIN[i];
    const r1=ringR*1.05, r2=r1+7*dpr;
    ctx.moveTo(hx+ca*r1, hy+sa*r1);
    ctx.lineTo(hx+ca*r2, hy+sa*r2);
  }
  ctx.stroke();
  // 内圈：读数"跳动"的第二道刻线（更短更急）
  ctx.globalAlpha=k*0.55;
  ctx.lineWidth=1*dpr;
  ctx.beginPath(); ctx.arc(hx, hy, ringR*0.62, 0, 6.2831853); ctx.stroke();
  ctx.restore();
}

function atmBuildRidge(i){
  const dark=!!SC.dark, HD=Math.max(24, Math.floor(H*(dark?ATMOS.ridgeH[i]:ATMOS.ridgeHL[i])));
  const CWd=Math.floor(W + 2*ATMOS.par[i]*W*Math.PI);
  atmRidgeHD[i]=HD; atmRidgeWD[i]=CWd;
  atmRidgeCv[i]=_mkCv(CWd*0.5, HD*0.5);
  const g=atmRidgeCv[i].getContext('2d'); if(!g) return;
  const w2=atmRidgeCv[i].width, h2=atmRidgeCv[i].height;
  const col=dark? [0,0,0] : MIST.silhouette;
  const aTop=dark? ATMOS.ridgeA[i] : ATMOS.ridgeAL[i];
  const grd=g.createLinearGradient(0,0,0,h2);
  if(dark){
    grd.addColorStop(0,_atmCSS(col,aTop));
    grd.addColorStop(0.55,_atmCSS(col,aTop*0.62));
    grd.addColorStop(1,_atmCSS(col,0));
  } else {
    // 浅色：山脚不透明（压在地平线上），顶部略淡；避免山体“浮”在雾上
    grd.addColorStop(0,_atmCSS(col,aTop*0.55));
    grd.addColorStop(0.55,_atmCSS(col,aTop*0.85));
    grd.addColorStop(1,_atmCSS(col,aTop));
  }
  g.fillStyle=grd;
  const f1=1.7*(i+1)+0.8, f2=4.3*(i+1)+1.7, f3=9.7*(i+1)+0.4;
  const p1=i*2.1+0.6, p2=i*3.7+1.2, p3=i*1.3+2.4;
  const base=0.55+0.13*i;
  g.beginPath(); g.moveTo(0,h2);
  for(let x=0;x<=w2;x+=2){
    const t=x/w2*Math.PI*2;
    const v=0.56+0.25*Math.sin(t*f1+p1)+0.13*Math.sin(t*f2+p2)+0.06*Math.sin(t*f3+p3);

function atmEnsureCache(){

  const ui=_rgbOf(SC.ui||SC.cross,0);

  const M=Math.floor(H*ATMOS.margin);
  atmSkyHD=H+2*M;
  const sw=Math.max(2,Math.floor(W*0.5)), sh=Math.max(2,Math.floor(atmSkyHD*0.5));
  atmSkyCv=_mkCv(sw,sh); if(atmSkyCv) atmBuildSky(atmSkyCv, sw, sh);

  atmFogHD=Math.max(64, Math.floor(H*(dark?ATMOS.fogH:ATMOS.fogHL)));
  const fw=Math.max(2,Math.floor(W*0.5)), fh=Math.max(2,Math.floor(atmFogHD*0.5));
  atmFogCv=_mkCv(fw,fh); if(atmFogCv) atmBuildFog(atmFogCv, fw, fh);

function drawAtmosphereBackdrop(){

  const y0=hy-atmSkyHD*0.5;
  const visTop=Math.max(0,y0), visBot=Math.min(H,y0+atmSkyHD);
  const dh=visBot-visTop; if(dh<=0) return;

function drawAtmosphereRidges(){

    const CWd=atmRidgeWD[i], HD=atmRidgeHD[i];
    const par=ATMOS.par[i]*W;

function drawAtmosphereFog(){

    ctx.drawImage(atmCoreCv, _px-cr, _py-cr, cr*2, cr*2);
  }
  ctx.restore();
}
// 点击位置（准星中心）的 2px 十字刻点：让你看见自己打在哪
function drawClickTick(now){
  if(!hitFx || hitFxMode==='off' || !hitFx.tickUntil) return;
  const left=hitFx.tickUntil-now;
  if(!(left>0 && left<=ATMOS.tickMs)) return;
  const a=left/ATMOS.tickMs;                           // 1 → 0
  const dpr=devicePixelRatio||1, cx=W*0.5, cy=H*0.5, arm=7*dpr;
  ctx.save();
  ctx.globalAlpha=Math.min(1,a*1.25);
  ctx.beginPath();
  ctx.moveTo(cx-arm,cy); ctx.lineTo(cx+arm,cy);
  ctx.moveTo(cx,cy-arm); ctx.lineTo(cx,cy+arm);
  // 先暗描边、再亮刻点：白色核 / 白球上也能看见
  ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=4*dpr; ctx.stroke();
  ctx.strokeStyle=SC.dark? 'rgba(255,255,255,.95)' : 'rgba(17,24,39,.95)';
  ctx.lineWidth=2*dpr; ctx.stroke();
  ctx.restore();
}

// 地面纹理：预生成的常量网格段（近→远 3 档透明度）。
// 中远景线段用固定种子预生成「随机断裂」标记（数组第 8 位），运行时只读，避免看出网格规律。
function _atmGrid(step,range,seg,r0,r1,r2,breakMid,breakFar){
  const list=[], gY=-EYE;
  let seed=0x9e3779b9;                                  // 固定种子：每次加载断裂位置一致
  function rnd(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
  function add(x1,z1,x2,z2){
    const mx=(x1+x2)*0.5, mz=(z1+z2)*0.5, rr=Math.sqrt(mx*mx+mz*mz);
    const band= rr<r0?0 : rr<r1?1 : rr<r2?2 : -1;
    if(band<0) return;
    let keep=1;
    if(band===1) keep = rnd()<breakMid?0:1;
    else if(band===2) keep = rnd()<breakFar?0:1;
    list.push(x1,gY,z1,x2,gY,z2,band,keep);
  }
  for(let v=-range;v<=range;v+=step){
    for(let u=-range;u<range;u+=seg){ add(v,u, v,u+seg); add(u,v, u+seg,v); }
  }
  return new Float32Array(list);
}
const ATM_GRID=_atmGrid(ATMOS.gridStep, ATMOS.gridR, ATMOS.gridSeg, 14, 28, 44, 0.36, 0.56);
const ATM_GRID_FINE=_atmGrid(2, 16, 4, 8, 16, 17, 0.16, 0.30);
function _atmGridPass(list, bands, alphaScale){
  const dpr=devicePixelRatio||1;
  for(let b=0;b<bands;b++){
    ctx.beginPath();
    let any=false;
    for(let i=0;i<list.length;i+=8){
      if(list[i+6]!==b || list[i+7]===0) continue;
      any=true;
      _seg(list[i], list[i+1], list[i+2], list[i+3], list[i+4], list[i+5]);
    }
    if(!any) continue;
    ctx.globalAlpha=(SC.dark?ATMOS.gridA[b]:ATMOS.gridAL[b])*alphaScale;
    ctx.strokeStyle=SC.major; ctx.lineWidth=1*dpr; ctx.stroke();
  }
}
function arenaGroundTexture(){
  if(!ATM_GRID.length) return;
  _atmGridPass(ATM_GRID, 3, 1);      // 大格：地面结构（很淡）
  _atmGridPass(ATM_GRID_FINE, 2, 0.45);  // 小格：近处材质纹理
  ctx.globalAlpha=1;
}
function drawSceneBase(now, dtMs, withGlow){
  ctx.fillStyle=SC.bg; ctx.fillRect(0,0,W,H);
  if(ARENA_DECOR){                       // 旧装饰层回滚路径
    drawArenaHaze();
    grid();
    drawArenaDust(now, dtMs);
    drawArenaOverlay();
    return;
  }
  drawAtmosphereBackdrop();              // 天幕 + 地面光衰减（随 pitch 平移）
  drawAtmosphereRidges();                // 2–3 层远景剪影（随 yaw 视差）
  drawAtmosphereFog();                   // 地平线雾带
  grid();                                // 地面纹理（极淡）
  drawArenaDust(now, dtMs);              // 空气里的尘埃
  if(withGlow) drawCrossGlow();          // 准星周围很轻微的提亮
  drawArenaOverlay();                    // 很淡的暗角 + 颗粒
}

function grid(){
  const perf = (function(){ try{ return localStorage.getItem('cs2at.perf')==='1'; }catch(e){ return false; } })();
  arenaCamSetup();
  _arTune();

}

let rawLockFailed=false;
function doLock(){
  function safeLock(){
    rawLockFailed=true;   // 原始输入锁失败：像素被系统加速，测量不可比
    try{ const p=cv.requestPointerLock(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
    var el=document.getElementById('rawWarn');
    if(el) el.style.display='';
  }
  try{ const r=cv.requestPointerLock({unadjustedMovement:true});
    if(r&&r.catch) r.catch(safeLock); else safeLock(); }
  catch(e){ safeLock(); }
}

function readDelay(){
  try{
    var q=new URLSearchParams(location.search);
    if(q.get('delay')!==null){
      var v=parseInt(q.get('delay'));
      if(!isNaN(v)) return Math.max(0, Math.min(5, v));
    }
    var s=parseInt(localStorage.getItem('cs2at.delay'));
    return isNaN(s)? 3 : Math.max(0, Math.min(5, s));
  }catch(e){ return 3; }
}

// 分辨率只改训练内视角：按 CS2 的固定垂直 FOV(≈73.74°) 换水平视角
function applyRes(){
  try{
    var q=new URLSearchParams(location.search);
    var res=q.get('res') || localStorage.getItem('cs2at.res');
    var w=q.get('w') || localStorage.getItem('cs2at.resW');
    var h=q.get('h') || localStorage.getItem('cs2at.resH');
    if(res==='custom'){
      var cw=parseInt(w), ch=parseInt(h);
      if(!isNaN(cw)&&!isNaN(ch)&&cw>0&&ch>0){ FOVH=2*Math.atan(0.75*(cw/ch))*R2D; return; }
    }
    var A={'16:9':16/9,'16:10':16/10,'4:3':4/3,'5:4':5/4,'1:1':1};
    if(A[res]){ FOVH=2*Math.atan(0.75*A[res])*R2D; return; }
  }catch(e){}
  FOVH=90;   // 默认 4:3，和以前一样
}

/* 模式默认参数：从下拉框读出 mode，再按模式设半径/限时/状态。
   抽成函数是为了两件事：测试可以直接驱动，且不再依赖 start() 的执行上下文。 */
function applyModeDefaults(){
  mode=(document.getElementById('mode')||{value:'random'}).value||'random';
  if(mode==='precision'){ radius=0.7; limitChk.checked=false; }
  else if(mode==='block'){ radius=R0; limitChk.checked=false; blockLeft=0; }
  else if(mode==='wide'){ radius=Math.max(0.8, R0*0.8); limitChk.checked=false; }
  else if(mode==='track'){ radius=R0; limitChk.checked=false; trackSpeed=10; }
  else if(mode==='check'){ radius=0.7; limitChk.checked=false; checkIdx=0; checkData=[]; endMode='time'; endTime=90; }
  else if(mode==='staircase'){
    // 阶梯：从 1.5° 起步，步长 0.30°，每反转一次减半
    limitChk.checked=false; stRadius=1.5; stStep=0.30; stRun=0; stDir=0; stRev=[]; radius=stRadius;
  }
  else if(mode==='distance'){ radius=R0; limitChk.checked=false; dzDist=[]; dzHit=[]; dzMt=[]; }
  else if(mode==='axis'){ radius=AXIS_TIERS[1].r; limitChk.checked=true; axisTierIdx=0; axisTierForce=-1; axisLevelOverride=false; axisLoad(); }
  try{ if(mode!=='check'){ localStorage.setItem('cs2at.endMode',endMode); localStorage.setItem('cs2at.endTime',String(endTime)); } }catch(e){}
  try{
    var sz=parseFloat(document.getElementById('sizeOv').value);
    if(mode!=='staircase' && mode!=='axis' && !isNaN(sz)&&sz>=0.35&&sz<=3) radius=sz;   // 自定义球大小覆盖各模式默认值（阶梯/分轴的尺寸是模式变量）
  }catch(e){}
}

function applyHudColor(){
  // 浅色晨雾场景顶部是暗天空：HUD 用暖白字 + 金色强调；暗色场景维持原样
  try{
    const r=document.documentElement.style;
    if(SC.dark){
      hud.style.color='var(--txt)';
      r.removeProperty('--hud-acc'); r.removeProperty('--hud-dim'); r.removeProperty('--hud-fps');
    } else {
      hud.style.color='#f7f1e3';
      r.setProperty('--hud-acc','#ffd9a0');
      r.setProperty('--hud-dim','rgba(246,240,228,.72)');
      r.setProperty('--hud-fps','#ffd9a0');
    }
  }catch(e){}
}
function start(){
  endMode=document.getElementById('endMode').value||'count';
  endTime=Math.max(15, parseInt(document.getElementById('endTime').value)||120);
  // 结束方式持久化挪到模式判定之后：检查模式强制的 90 秒不写进存储
  TOTAL=parseInt(document.getElementById('cnt').value)||40;
  if(TOTAL<20) TOTAL=20; if(TOTAL>800) TOTAL=800;   // 与计划页步进器一致，不截断计划球数
  DPI=parseFloat(document.getElementById('dpi').value)||800;
  cm360=parseFloat(document.getElementById('cm').value)||27.2;
  if(cm360<12) cm360=12; if(cm360>60) cm360=60;
  try{
    fpsCap=parseInt(localStorage.getItem('cs2at.fps')||'0')||0;
    fpsShow=localStorage.getItem('cs2at.fpsShow')!=='0';
  }catch(e){}
  lastDraw=0; fpsFrames=0; fpsLast=performance.now(); fpsVal=0;
  // 输入设备与手柄参数在设置页配置，这里只复位运行时状态
  padFirePrev=false; lastPadT=0;
  try{
    SC = SCENES[pickScene()] || SCENES.night;
    document.body.style.background = SC.bg;
    applyHudColor();
  }catch(e){}
  try{
    // 参数面板的场景选择：自定义 = 只换背景与目标色；其余覆盖整份场景
    const ssv=(document.getElementById('sceneSel')||{}).value;
    if(ssv==='custom'){
      const bg=(document.getElementById('scBg')||{}).value;
      const tg=(document.getElementById('scTgt')||{}).value;
      if(bg){ SC.bg=bg; }
      if(tg){ SC.tgt=tg; SC.ring=tg; SC.tgtFill=tg; }
      try{ localStorage.setItem('cs2at.sceneCustom', JSON.stringify({bg:bg||'',tg:tg||''})); }catch(e){}
      document.body.style.background=SC.bg;
    } else if(ssv && ssv!=='auto' && SCENES[ssv]){
      SC = SCENES[ssv];
      document.body.style.background = SC.bg;
      applyHudColor();
      try{ localStorage.setItem('cs2at.scene', ssv); localStorage.setItem('cs2at.sceneUser','1'); }catch(e){}
    }
  }catch(e){}
  try{
    // 自定义准星：覆盖场景配色里的 cross/edge
    const q3=new URLSearchParams(location.search);
    const cm=q3.get('crossMode')||localStorage.getItem('cs2at.crossMode');
    if(cm==='custom'){
      const cc=q3.get('crossColor')||localStorage.getItem('cs2at.crossColor');
      const ce=q3.get('crossEdge')||localStorage.getItem('cs2at.crossEdge');
      if(cc) SC.cross='#'+String(cc).replace('#','');
      if(ce) SC.edge='#'+String(ce).replace('#','');
    }
  }catch(e){}
  applyCrosshairSettings();   // 开始页预览也要用设置里的准星
  try{
    // 检查模式默认「只有中心点」的小准星：0.7° 小球会被十字线整个盖住。
    // 用户自己设置过准星样式就尊重他。
    if(mode==='check' && localStorage.getItem('cs2at.crossType')===null){
      crossType='dot'; dotSize='small'; dotOutl=true; crossDyn='static';
    }
  }catch(e){}
  applyModeDefaults();
  // 设置只有一个真源：设置页写 localStorage，训练器只读不写（防反向覆盖）
  applyRes(); resize();   // 训练内视角按分辨率设置
  msg.classList.remove('show'); res.classList.remove('show');

  // 流程：全屏（独立按钮，可选）→ 点「开始」锁光标 → 倒计时 → 首球。
  // 不再在开跑时抢全屏：requestFullscreen 会吃掉 transient activation，
  // 官方要求 requestPointerLock() 必须先于它，拆成两次点击最稳。
  waiting=true; running=false; paused=false;
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  var cd0=document.getElementById('cd'); if(cd0) cd0.classList.remove('show');
  // 笔/手柄设备不用锁光标：直接开始倒计时
  if(device==='pen' || device==='pad'){ setTimeout(beginCountdownOrSession, 60); }
}

function beginCountdownOrSession(){
  if(!waiting) return;
  var delay=readDelay();
  if(delay>0){
    // 倒计时：等待期间不算训练
    cdUntil=performance.now()+delay*1000;
    var cd=document.getElementById('cd'), num=document.getElementById('cdNum');
    if(cd) cd.classList.add('show');
    if(num) num.textContent=String(delay);
    if(cdTimer) clearInterval(cdTimer);
    cdTimer=setInterval(function(){
      var left=Math.max(0, cdUntil-performance.now());
      if(num) num.textContent=String(Math.ceil(left/1000));
      if(left<=0){ if(cdTimer){ clearInterval(cdTimer); cdTimer=null; } beginSession(); }
    },100);
  } else {
    beginSession();
  }
}

function beginSession(){
  waiting=false;
  var cd=document.getElementById('cd'); if(cd) cd.classList.remove('show');
  if(cdTimer){ clearInterval(cdTimer); cdTimer=null; }
  running=true; paused=false; lockFails=0;   // hadLock/lockFree 都不在这里复位：ESC 丢锁要能暂停，无锁模式要延续
  // 抓取层显隐交给 sync()：这里不再强制显示，否则每局开始都会闪一下
  trial=0; hits=0; streak=0; bestStreak=0; if(mode==='random') radius=R0; allowed=800; timeouts=0; timeFactor=1.25;
  times=[]; errs=[]; hitFlags=[]; blocks=[]; blockTimes=[]; blockHits=0;
  if(mode==='check'){ checkIdx=0; checkData=[]; checkCur=null; checkSpeed=0; }
  if(mode==='axis'){ axisBalls=[]; axisTierIdx=0; axisEntered=false; axisEntryAt=0; axisT1=null; axisGreen=false; axisPulseUntil=0; axisLoad(); }
  yaw=0; pitch=0; alive=false; endStarted=false;
  nextAt=performance.now()+300;
  endAt = performance.now() + endTime*1000;   // 整场计时从首球出生起（spawn 里重设）
}

/* ===== 阶梯精度：变换阶梯（transformed staircase）=====
   k-down/1-up：连续 k 次命中降一档（变难），一次未中就升一档（变易）。
   k 由目标命中率反推：k = p/(1-p)，p=0.85 → k=6，收敛在 1/(1+1/6)=85.7%。
   每次方向反转就把步长减半（变换阶梯），阈值 = 收敛后反转点半径的均值。 */
function stUpdate(hit){
  if(hit){ stRun++; if(stRun>=stK){ stRun=0; stGo(-1); } }
  else { stRun=0; stGo(+1); }
}
function stGo(dir){
  if(stDir!==0 && dir!==stDir){        // 方向反转：记下当前半径，步长减半
    stStep=Math.max(0.05, stStep/2);
    stRev.push(radius);
  }
  stDir=dir;
  stRadius=Math.max(RMIN, Math.min(RMAX, radius + dir*stStep));
  radius=stRadius;
}

function spawn(){
  // 整场计时从首球出生那一刻算起
  if(endMode==='time' && !endStarted){ endStarted=true; endAt=performance.now()+endTime*1000; }
  sYaw=yaw; sPitch=pitch;
  if(mode==='block'){
    if(blockLeft<=0){
      // 新一组：以当前视角为中线，四轴轮换
      blockAnchorYaw=yaw; blockAnchorPitch=pitch;
      const AXES=[[1,0],[0,1],[0.7071,-0.7071],[0.7071,0.7071]];  // 水平/垂直/左上右下/右上左下
      blockAxis=AXES[blockAxisIdx++ % 4];
      blockAmp=(16+Math.random()*8)*D2R;
      blockLeft=8; blockSide=1;
    }
    const off=blockAmp*0.5*blockSide;
    blockSide=-blockSide;
    blockLeft--;
    // 纵向分量按 m_pitch/m_yaw 的比例压缩，避免竖直幅度过大
    tYaw  = blockAnchorYaw  + blockAxis[0]*off;
    tPitch= blockAnchorPitch + blockAxis[1]*off*0.62;
    if(tPitch> 13*D2R) tPitch= 13*D2R;
    if(tPitch<-13*D2R) tPitch=-13*D2R;
  } else if(mode==='wide'){
    const a=(Math.random()<0.5?-1:1)*(80+Math.random()*80)*D2R;   // 90-180° 回头枪
    const b=(Math.random()*2-1)*10*D2R;
    tYaw=yaw+a; tPitch=pitch+b;
  } else if(mode==='track'){
    // 移动目标：从准星附近起步，匀速直线漂移
    tsYaw=yaw+(Math.random()<0.5?-1:1)*(2+Math.random()*4)*D2R;
    tsPitch=pitch+(Math.random()*2-1)*3*D2R;
    const dir=Math.random()*Math.PI*2;
    tvYaw=Math.cos(dir)*trackSpeed*D2R;
    tvPitch=Math.sin(dir)*trackSpeed*D2R*0.7;
    tDur=1.5+Math.random()*1.0;
    tYaw=tsYaw; tPitch=tsPitch;
  } else if(mode==='check'){
    // 六维检查：配方决定球类型与角度档，方向随机（背不了板）
    const k=CHECK_RECIPE[checkIdx%CHECK_RECIPE.length];
    if(k==='micro'){
      const a=(Math.random()<0.5?-1:1)*(2+Math.random()*6)*D2R;
      const b=(Math.random()*2-1)*3*D2R;
      tYaw=yaw+a; tPitch=pitch+b; radius=0.7;
    } else if(k==='wide'){
      const a=(Math.random()<0.5?-1:1)*(100+Math.random()*30)*D2R;
      const b=(Math.random()*2-1)*10*D2R;
      tYaw=yaw+a; tPitch=pitch+b; radius=1.2;
    } else {
      const a=(Math.random()<0.5?-1:1)*(15+Math.random()*30)*D2R;
      const b=(Math.random()*2-1)*8*D2R;
      tYaw=yaw+a; tPitch=pitch+b; radius=1.0;
    }
    checkCur={kind:k, moved:false, firstMove:null, firstStop:false, firstErr:0, lastFast:0};
  } else if(mode==='staircase'){
    // 距离固定 18°（±2° 抖动）：难度只由球的尺寸决定，阈值才有意义
    const a=(Math.random()<0.5?-1:1)*(18+Math.random()*2)*D2R;
    const b=(Math.random()*2-1)*4*D2R;
    tYaw=yaw+a; tPitch=pitch+b;
    radius=stRadius;
  } else if(mode==='distance'){
    // 距离 5–45°、方向随机：情境干扰（contextual interference），逼你适应不同幅度
    const distDeg=5+Math.random()*40;              // 目标角距离，单位度
    const ang=Math.random()*Math.PI*2;
    let dyDeg=Math.sin(ang)*distDeg*0.5;
    dyDeg=Math.max(-10, Math.min(10, dyDeg));      // 纵向别撞 ±12° 夹子
    const dxDeg=Math.sqrt(Math.max(0, distDeg*distDeg - dyDeg*dyDeg));
    const sx=(Math.cos(ang)<0? -1 : 1);
    tYaw=yaw+sx*dxDeg*D2R; tPitch=pitch+dyDeg*D2R;
    radius=R0;
  } else if(mode==='axis'){
    // 三档球半径轮换；目标出现在中距离侧向，给横移留出动作空间
    axisCurTier=axisNextTier();
    const cfg=AXIS_TIERS[axisCurTier];
    radius=cfg.r; allowed=cfg.tmo;
    const side=(Math.random()<0.5?-1:1);
    tYaw=yaw+side*(8+Math.random()*10)*D2R;
    tPitch=pitch+(Math.random()*2-1)*4*D2R;
    axisEntered=false; axisEntryAt=0; axisT1=null; axisGreen=false; axisPulseUntil=0;
    window.__axisGreenAt=0;
  } else {
    const a=(Math.random()<0.5?-1:1)*(12+Math.random()*16)*D2R;
    const b=(Math.random()*2-1)*8*D2R;
    tYaw=yaw+a; tPitch=pitch+b;
  }
  if(tPitch> 12*D2R) tPitch= 12*D2R;
  if(tPitch<-12*D2R) tPitch=-12*D2R;
  alive=true; tSpawn=performance.now();
}

function judge(){
  if(!running||paused||!alive) return;
  const now=performance.now();
  const dxDeg=wrapPi(tYaw-yaw)*R2D;
  const dyDeg=wrapPi(tPitch-pitch)*R2D;
  const err=Math.hypot(dxDeg,dyDeg);
  const hitQ=Math.max(0, Math.min(1, err/Math.max(0.01,radius)));   // 反馈用：偏差 / 球半径（0=正中，1=擦边）
  const hitRad=radius;                                              // 反馈用：命中时的球半径（之后难度可能改它）
  const mt=now-tSpawn;
  const overtime = (mode==='track') ? (mt>=tDur*1000-1)
    : (mode==='axis' ? (mt>allowed) : (limitChk.checked && mt>allowed));
  // 分轴定位：横向进带即绿（当帧判定，无 dwell），同时记录 T1
  if(mode==='axis' && !axisEntered){
    const bh=axisBandHalfDeg();
    if(Math.abs(dxDeg)<=bh){
      axisEntered=true; axisEntryAt=now; axisT1=now-tSpawn; axisPulseUntil=now+80;
      window.__axisGreenAt=now;
    }
  }
  const hit = (mode==='axis')
    ? (!overtime && (axisLevel===4 ? err<=radius : (Math.abs(dxDeg)<=axisBandHalfDeg() && Math.abs(dyDeg)<=radius)))
    : ((err<=radius) && !overtime);
  if(overtime) timeouts++;

  trial++; times.push(mt); errs.push(err); hitFlags.push(hit);
  if(mode==='axis'){
    axisBalls.push({tierIdx:axisCurTier, r:radius, t1:axisT1,
      t2:(axisEntered&&!overtime)?Math.round(now-axisEntryAt):null,
      dy:dyDeg, hit:hit, entered:axisEntered, timeout:overtime});
    // 渐隐 A0–A4：连续 5 次进带升级；进带失败或连续 2 次未命中降级
    if(!axisLevelOverride){
      if(axisEntered){
        axisEnterStreak++; axisMissStreak=0;
        if(axisEnterStreak>=5 && axisLevel<4){ axisLevel++; axisEnterStreak=0; }
      } else { axisLevel=Math.max(0,axisLevel-1); axisEnterStreak=0; }
      if(!hit){ axisMissStreak++; if(axisMissStreak>=2){ axisLevel=Math.max(0,axisLevel-1); axisMissStreak=0; } }
      else axisMissStreak=0;
      axisSave();
    }
  }
  if(mode==='check'){
    const c=checkCur||{kind:'mid', firstStop:true, firstErr:err, firstMove:null, firstStopAt:0};
    if(checkIdx>=CHECK_WARMUP){   // 前 6 球热身，不计分
      checkData.push({ kind:c.kind, react:(c.firstMove===null?null:Math.round(c.firstMove)),
        firstErr:c.firstStop? c.firstErr : err, finalErr:err,
        stopToFire:(c.firstStop&&c.firstStopAt)? Math.round(now-c.firstStopAt) : null,   // 没停点=未知，不给满分
        dx:wrapPi(tYaw-yaw)*R2D, dy:wrapPi(tPitch-pitch)*R2D, hit:hit, mt:mt });
    }
    checkIdx++;
  }
  blockTimes.push(mt);
  if(hit){ hits++; streak++; blockHits++; if(streak>bestStreak) bestStreak=streak; }
  else streak=0;

  // 阶梯：这一步决定下一球的尺寸（命中够多就变小）
  if(mode==='staircase') stUpdate(hit);
  // 随机距离：按本球的真实角距离分箱（用出生点到目标的实际角度，不含夹子误差）
  if(mode==='distance'){
    const dDeg=Math.hypot(wrapPi(tYaw-sYaw), wrapPi(tPitch-sPitch))*R2D;
    dzDist.push(dDeg); dzHit.push(hit); dzMt.push(mt);
  }

  // 每 8 个按 85% 原则调整难度（同一时间只调一个变量）
  if(trial%8===0){
    const recent=hitFlags.slice(-8);
    const rate=recent.filter(Boolean).length/8;
    if(mode==='track'){
      // 跟枪：命中率调速度与大小
      if(rate>=0.70){ trackSpeed=Math.min(40, trackSpeed*1.10); radius=Math.max(RMIN, radius*0.95); }
      else if(rate<0.50){ trackSpeed=Math.max(3, trackSpeed*0.90); radius=Math.min(RMAX, radius*1.08); }
    }
    else if(mode!=='random'){ /* 定角/精度/大角度模式不调难度 */ }
    else if(limitChk.checked){
      // 只调允许时间：锚定在你的实际速度上，再按命中率微调系数
      const base = med(times.slice(-8)) || 400;
      if(rate>=0.85) timeFactor=Math.max(0.80, timeFactor-0.06);
      else if(rate<0.70) timeFactor=Math.min(1.60, timeFactor+0.06);
      allowed = Math.max(260, Math.min(1500, base*timeFactor));
    } else {
      // 只调球大小
      if(rate>=0.80) radius=Math.max(RMIN, radius*0.92);
      else if(rate<0.60) radius=Math.min(RMAX, radius*1.08);
    }
  }

  // 每 20 个记录一段
  if(trial%20===0){
    blocks.push({ n:blocks.length+1, mt:med(blockTimes), hit:blockHits/blockTimes.length, r:radius, lim:allowed });
    blockTimes=[]; blockHits=0;
  }

  alive=false;
  feedback={ err:err, hit:hit, mt:mt, over:overtime, until:now+600 };
  if(hit){
    hitFx={ty:tYaw, tp:tPitch, until:now+250, q:hitQ, r:hitRad,
           fxUntil:now+ATMOS.hitMs, tickUntil:now+ATMOS.tickMs};   // 反馈：精度编码 + 目标位置 + 点击刻点
    hitCrossUntil=now+200;   // 命中：准星闪一下
    if(hitFxMode==='shatter' || (hitFxMode==='both' && hitFxMix.charAt(1)==='1')){
      // 碎裂：10 片碎屑随机方向飞散
      const parts=[];
      for(let i=0;i<10;i++){
        const a=Math.random()*Math.PI*2, sp=(Math.random()*3.2+1.6)*devicePixelRatio;
        parts.push({a:a, x:0, y:0, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:(Math.random()*1.7+0.9)*devicePixelRatio, t:now+260+Math.random()*140});
      }
      hitFx.parts=parts;
    }
  }

  if((endMode==='count' && trial>=TOTAL)){ finish(); return; }
  if(endMode==='time' && performance.now()>=endAt){ finish(); return; }
  nextAt = (mode==='check')? now+1200+Math.random()*500 : now+150+Math.random()*250;
}

let feedback=null, hitFx=null, hitCrossUntil=0;

/* ===== 六维检查：评分与报告 ===== */
function checkScores(){
  const D=checkData;
  if(D.length<12) return null;   // 数据太少不评分
  const clamp=v=>Math.max(0,Math.min(100,Math.round(v)));
  const mid=D.filter(d=>d.kind==='mid');
  const micro=D.filter(d=>d.kind==='micro');
  const wide=D.filter(d=>d.kind==='wide');
  const react=mid.filter(d=>d.react!==null).map(d=>d.react);
  const sReact=react.length? clamp(100-(med(react)-150)/3) : 50;         // 150ms=100，300ms=50，450ms=0
  const reactMs=react.length? Math.round(med(react)) : null;
  const firstPool=mid.concat(wide).map(d=>d.firstErr);
  const sFirst=firstPool.length? clamp(100-med(firstPool)/0.03) : 50;     // 首次落点：0°=100，3°=0
  // 修正成本：首停到击发的耗时——一次到位 0ms=100，回拉 400ms=0；
  // 没检测到停点的球剔除（甩完不停手直接点的常见动作），而不是记 0 给满分
  const secondAll=mid.concat(wide);
  const secondPool=secondAll.map(d=>d.stopToFire).filter(v=>v!==null);
  const sSecond=secondPool.length? clamp(100-med(secondPool)/6) : null;   // 0ms=100，300ms=50，600ms=0
  const secondCov=secondAll.length? Math.round(secondPool.length/secondAll.length*100) : 100;
  const sMicro=micro.length? clamp(micro.filter(d=>d.hit).length/micro.length*100) : 50;
  const sWide=wide.length? clamp(
      (wide.filter(d=>d.hit).length/wide.length*60) + (clamp(100-(med(wide.map(d=>d.mt))-300)/6)*0.4)) : 50;
  const n3=Math.max(4,Math.floor(D.length/3));
  const fst=D.slice(0,n3), lst=D.slice(-n3);
  const hf=fst.filter(d=>d.hit).length/fst.length;
  const hl=lst.filter(d=>d.hit).length/lst.length;
  // 稳定性（样本少，仅粗分）：系数收窄到 100，噪声误判从 ±31 降到 ±10 分
  const sAttn=clamp(50+(hl-hf)*100);
  return { react:sReact, reactMs:reactMs, first:sFirst, second:sSecond, secondCov:secondCov, micro:sMicro, wide:sWide, attn:sAttn };
}

/* 落点图：每次击发的最终落点（相对目标），环 = 0.7° / 1.2° */
function drawCheckScatter(){
  try{
    var cv=document.getElementById('checkScatter'); if(!cv) return;
    var S=Math.min(cv.clientWidth||300, 300);
    var dpr=window.devicePixelRatio||1;
    cv.width=S*dpr; cv.height=S*dpr;
    var ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
    var cx=S/2, cy=S/2, px=34;   // 34px = 1°
    var css=getComputedStyle(document.documentElement);
    var dim=css.getPropertyValue('--dim').trim()||'#8b949e';
    var acc=css.getPropertyValue('--acc').trim()||'#7fbfa6';
    ctx.strokeStyle=dim; ctx.lineWidth=1;
    [0.7,1.2].forEach(function(r){ ctx.beginPath(); ctx.arc(cx,cy,r*px,0,Math.PI*2); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(cx-8,cy); ctx.lineTo(cx+8,cy); ctx.moveTo(cx,cy-8); ctx.lineTo(cx,cy+8); ctx.stroke();
    checkData.forEach(function(d){
      var x=cx+d.dx*px, y=cy-d.dy*px;
      if(Math.abs(x-cx)>S/2-4||Math.abs(y-cy)>S/2-4) return;
      ctx.beginPath(); ctx.arc(x,y,d.kind==='micro'?2:2.6,0,Math.PI*2);
      ctx.fillStyle=d.hit? acc : '#d29922';
      ctx.fill();
    });
  }catch(e){}
}

/* ===== 两个新模式的报告 ===== */
function staircaseReportHtml(){
  const rev=stRev.slice(2);                       // 前两次反转是热身，不计入阈值
  const thr=rev.length? med(rev) : (radius||R0);  // 半径，单位度
  const dia=thr*2;
  let sd=0;
  if(rev.length>1){
    const m=rev.reduce((a,b)=>a+b,0)/rev.length;
    sd=Math.sqrt(rev.reduce((a,b)=>a+(b-m)*(b-m),0)/(rev.length-1));
  }
  const ci=rev.length>1? 1.96*sd/Math.sqrt(rev.length) : 0;
  const hitRate=trial? Math.round(hits/trial*100) : 0;
  const mt=med(times.filter((v,i)=>hitFlags[i]));
  const T=(zh,en)=>EN_UI?en:zh;
  let advice;
  if(!rev.length) advice=T("反转次数不够，阈值还定不下来——再跑一组（至少 30 球）。","Not enough reversals yet — run another set (30+ shots).");
  else if(dia>2.4) advice=T("阈值偏大（>2.4°）：先用「小球精度」把静态准度练稳，再来测阶梯。","Large threshold (>2.4°): steady your static accuracy with Precision first.");
  else if(dia>1.2) advice=T("中等阈值：继续这条阶梯，盯住「反转点是否在变小」。","Mid threshold: keep running it and watch whether the reversal points shrink.");
  else advice=T("阈值很小（≤1.2°）：你在 85% 命中率下已经能稳定打小目标，可以加时间压力。","Tiny threshold (≤1.2°): you hold 85% on small targets — add time pressure.");
  const revTxt=rev.map(v=>v.toFixed(2)).join(" · ")||"—";
  let revRows='';
  stRev.forEach(function(v,i){
    revRows+='<tr><td>'+(i+1)+'</td><td>'+v.toFixed(2)+'</td></tr>';
  });
  const revTbl = stRev.length
    ? '<table class="res-table"><tr><th>'+T("反转点","Reversal")+'</th><th>'+T("半径 (°)","Radius (°)")+'</th></tr>'+revRows+'</table>'
    : '';
  var kp=resParamExtra();
  return resKicker('阶梯精度','Staircase precision', kp[0], kp[1])+
    '<div class="res-num">'+dia.toFixed(2)+'<i>°</i></div>'+
    '<div class="res-note">'+T("85% 命中率下的最小目标直径","smallest target diameter held at 85%")+' · ±'+ci.toFixed(2)+'° · '+
      (rev.length? T("反转 ","reversals ")+stRev.length+T(" 次（前 2 次热身）"," (first 2 warm-up)") : T("反转次数不足","not enough reversals"))+' · '+hitRate+'% · '+Math.round(mt)+' ms</div>'+
    resSec('02','判断','Verdict')+
    '<div class="res-advice">'+advice+'</div>'+
    (revTbl? resSec('03','反转','Reversals') : '')+
    revTbl+
    '<div class="res-foot">'+T("阶梯规则：连续 6 次命中变小一档，一次未中变大一档；每反转一次步长减半。","Staircase: 6 hits shrink the target one step, one miss grows it; the step halves at every reversal.")+'</div>';
}

function distanceReportHtml(){
  const T=(zh,en)=>EN_UI?en:zh;
  const BINS=[[5,15,"5–15°"],[15,25,"15–25°"],[25,35,"25–35°"],[35,45,"35–45°"]];
  let rows="";
  for(const b of BINS){
    const idx=[];
    for(let i=0;i<dzDist.length;i++) if(dzDist[i]>=b[0] && dzDist[i]<b[1]) idx.push(i);

    const hasHit=idx.filter(i=>dzHit[i]).length>0;
    rows+='<tr><td>'+b[2]+'</td><td>'+hr+'%</td><td>'+(hasHit? mtm+' ms' : '—')+'</td><td>'+idx.length+'</td></tr>';

  const mt=med(times.filter((v,i)=>hitFlags[i]));
  let advice;
  if(trial<20) advice=T("球数偏少，分箱还不可比——至少 30 球再看。","Few shots — bins are noisy; run 30+ before comparing.");
  else if(hitRate<60) advice=T("整体命中率偏低：先把球放大一档，或缩短距离区间。","Overall hit rate is low — enlarge the target or narrow the distance range.");

    T("距离 5–45° 随机","5–45° random")+' · '+kp2[0], T("距离 5–45° 随机","5–45° random")+' · '+kp2[1])+
    '<div class="res-num">'+hitRate+'<i>%</i></div>'+
    '<div class="res-note">'+T("中位用时 ","median ")+Math.round(mt)+' ms · '+trial+T(" 球"," shots")+' · '+T("距离 5–45° 随机","5–45° random")+'</div>'+
    resSec('02','判断','Verdict')+

    '<div class="res-foot">'+T("每个箱子只统计该距离区间内实际打过的球；用时只算命中球。","Each bin counts the shots actually fired at that distance; time uses hits only.")+'</div>';
}
function axisReportHtml(){

  const t2s=B.filter(function(b){ return b.t2!==null; }).map(function(b){ return b.t2; });
  const dys=B.filter(function(b){ return !b.timeout; }).map(function(b){ return Math.abs(b.dy); });
  const t1=Math.round(med(t1s)), t2=Math.round(med(t2s)), dy=med(dys);
  window.__axisReport={t1:t1, t2:t2, dy:Math.round(dy*100)/100, hit:hitRate, level:axisLevel, n:B.length};
  const levelTxt='A'+axisLevel+' · '+(AXIS_FADE_DESC[axisLevel]||'');

    // 只统计本档实际打过的球；没跑到的档显示「—」，绝不套用总体中位数
    const g=B.filter(function(b){ return b.tierIdx===ti; });

    tierRows+='<tr><td>'+(EN_UI?cfg.en:cfg.zh)+' · '+cfg.r.toFixed(1)+'°</td>'+

function aimDelta(dx,dy){
  const k=(360/((cm360/2.54)*DPI))*D2R;
  yaw += (dx||0)*k;
  pitch -= (dy||0)*k;
  if(pitch>PITCH_LIM) pitch=PITCH_LIM;
  if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
  bumpDyn(Math.hypot(dx||0, dy||0));
  // 六维检查：首动时间（反应）+ 首次停点（角度阈值，跨 DPI/灵敏度可比）
  if(mode==='check' && running && !paused && alive && checkCur && !checkCur.firstStop){
    const now=performance.now();
    const sp=(Math.abs(dx||0)+Math.abs(dy||0))*k;   // 换算成角度
    if(!checkCur.moved && sp>0.15*D2R){ checkCur.moved=true; checkCur.firstMove=now-tSpawn; }
    if(checkCur.moved){
      checkSpeed=checkSpeed*0.6+sp*0.4;
      if(sp>=0.5*D2R) checkCur.lastFast=now;
      if(checkSpeed<0.2*D2R && now-checkCur.lastFast>200){
        checkCur.firstStop=true; checkCur.firstStopAt=now;
        checkCur.firstErr=Math.hypot(wrapPi(tYaw-yaw), wrapPi(tPitch-pitch))*R2D;
      }
    }
  }
}
function penAim(e){
  // 笔：绝对坐标映射，悬停即可瞄准
  penActive=true;
  if(!running||paused) return;
  const f=(W/2)/Math.tan(FOVH/2*D2R);
  const nx=(e.clientX-W/2)/f, ny=(H/2-e.clientY)/f;
  const oy=yaw, op=pitch;
  yaw=Math.atan(nx);
  pitch=Math.atan(ny);
  if(pitch>PITCH_LIM) pitch=PITCH_LIM;
  if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
  bumpDyn(Math.hypot(yaw-oy, pitch-op)*f*0.5);
}
function applyPadCurve(v,dz,crv){
  const a=Math.abs(v);
  if(a<=dz) return 0;
  const t=(a-dz)/(1-dz);
  return Math.pow(t, crv)*(v>0?1:-1);
}
function padPoll(dt){
  if(device!=='pad' || padMode==='off') return;
  try{
    const gps=navigator.getGamepads? navigator.getGamepads() : null;
    if(!gps) return;
    const gp=gps[0];
    if(!gp || !gp.connected) return;
    padActive=true;
    if(waiting){ beginCountdownOrSession(); return; }   // 手柄即"锁定完成"
    if(!running||paused) return;
    const ax=gp.axes[2]||0, ay=gp.axes[3]||0;
    if(padMode==='abs'){
      // 绝对式：摇杆位置 = 视角
      yaw  = ax*45*D2R;
      pitch = -ay*25*D2R;
      if(pitch>PITCH_LIM) pitch=PITCH_LIM;
      if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
      bumpDyn((Math.abs(ax)+Math.abs(ay))*60);
    } else if(padMode==='raw'){
      // 原始输入：直接读摇杆原始值，不做死区/曲线/平滑，1:1 当角速度
      yaw += ax*dt; pitch -= ay*dt;
      if(pitch>PITCH_LIM) pitch=PITCH_LIM;
      if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
    } else {
      // 速度式：固定手感（死区 15%、线性、360°/s）
      const vx=applyPadCurve(ax,0.15,1.0)*360*D2R;
      const vy=applyPadCurve(ay,0.15,1.0)*360*D2R;
      yaw += vx*dt; pitch -= vy*dt;
      if(pitch>PITCH_LIM) pitch=PITCH_LIM;
      if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
      bumpDyn((Math.abs(ax)+Math.abs(ay))*60);
    }
    let fire=false;
    try{ fire=!!(gp.buttons[0]&&gp.buttons[0].pressed)||!!(gp.buttons[7]&&gp.buttons[7].pressed); }catch(e){}
    if(fire && !padFirePrev){ if(running && !paused && alive) judge(); }
    padFirePrev=fire;
  }catch(e){}
}
let haveRaw=false;
addEventListener('pointerrawupdate',function(e){
  haveRaw=true;
  if(!running||paused) return;
  var evs=(e.getCoalescedEvents && e.getCoalescedEvents().length)? e.getCoalescedEvents() : [e];
  for(var i=0;i<evs.length;i++) aimDelta(evs[i].movementX, evs[i].movementY);
},true);
addEventListener('pointermove',function(e){
  if(e.pointerType==='mouse' && haveRaw) return;   // 鼠标走 raw，不重复处理
  if(!running||paused) return;
  if(e.pointerType==='pen'){ penAim(e); return; }
  aimDelta(e.movementX, e.movementY);
},true);

function loop(){
  requestAnimationFrame(loop);

  const now=performance.now();
  const dt=Math.min(0.1, lastPadT? (now-lastPadT)/1000 : 0.016); lastPadT=now;
  padPoll(dt);   // 等待期也轮询：手柄可触发"锁定完成 → 倒计时"
  // 未开始（开始页 / 等待锁定 / 结果页）：只渲染静态竞技场背景，不画球和准星，限 30fps 省电；
  // 开始后走同一套绘制函数（drawFrame），无缝过渡。
  if(!running){
    fpsRunOn=false;
    if(now-(idleLast||0)>=ARENA.idleMs){
      const idt=Math.min(140, idleLast? now-idleLast : 33);
      idleLast=now;
      drawArenaIdle(now, idt);
    }
    return;
  }
  if(paused) return;
  // FPS 窗口从真正开跑那一刻起算（点击「开始」到开跑之间的等待空窗不算掉帧）
  if(!fpsRunOn){ fpsRunOn=true; fpsFrames=0; fpsLast=now; }

  if(alive && mode!=='track' && now-tSpawn>allowed && (mode==='axis' || limitChk.checked)){ judge(); }
  // 分轴定位：横向进带当帧变绿（与绘制同一帧），并记录 T1
  if(mode==='axis' && alive){
    const dxDegNow=wrapPi(tYaw-yaw)*R2D;
    const inside=Math.abs(dxDegNow)<=axisBandHalfDeg();
    if(inside && !axisEntered){
      axisEntered=true; axisEntryAt=now; axisT1=now-tSpawn; axisPulseUntil=now+80;
      window.__axisGreenAt=now;
    }
    if(inside!==axisGreen){ axisGreen=inside; }
  }
  // 六维检查：停点兜底——鼠标不动 200ms 即视为第一段甩动结束
  // （低速鼠标停下时不产生移动事件，纯靠事件流测不到停点）
  if(mode==='check' && alive && checkCur && checkCur.moved && !checkCur.firstStop && now-checkCur.lastFast>350){
    checkCur.firstStop=true; checkCur.firstStopAt=now;
    checkCur.firstErr=Math.hypot(wrapPi(tYaw-yaw), wrapPi(tPitch-pitch))*R2D;
  }
  if(!alive && now>=nextAt) spawn();
  if(alive && mode==='track'){
    const el=(now-tSpawn)/1000;
    tYaw=tsYaw+tvYaw*el; tPitch=tsPitch+tvPitch*el;
    if(tPitch> 12*D2R){ tPitch=12*D2R; tvPitch=-Math.abs(tvPitch); }
    if(tPitch<-12*D2R){ tPitch=-12*D2R; tvPitch=Math.abs(tvPitch); }
    if(el>=tDur){ judge(); }   // 没跟住 → 按超时算
  }
  if(alive && shrinkChk.checked){
    const el=(now-tSpawn)/1000;
    radius=Math.max(RMIN, radius*Math.pow(0.88, 1/60));
  }

  // 帧率上限（FPS 只统计主循环帧）
  if(fpsCap){ const gap=1000/fpsCap; if(now-lastDraw < gap-1) return; }
  fpsFrames++;
  if(now-fpsLast>=500){ fpsVal=Math.round(fpsFrames*1000/(now-fpsLast)); fpsFrames=0; fpsLast=now; }
  drawFrame(now);
}

// 动态准星：输入速度驱动张开，随时间收回
function bumpDyn(speed){
  if(crossDyn!=='dyn') return;
  dynAmt=Math.min(1, Math.max(dynAmt, speed*0.02));
}
function dynamicFactor(now){
  dynAmt=Math.max(0, dynAmt-(now-(dynLast||now))*0.003);
  dynLast=now;
  return dynAmt;
}

// 分轴定位：两条 1px 竖线标出水平带；进带变绿（当帧），只做 80ms 亮度脉冲，不缩放/不位移
function axisGuideAlpha(now){
  if(axisLevel!==3) return 1;
  const mt=now-tSpawn;
  if(mt<=400) return 1;
  if(mt>=650) return 0;
  return 1-(mt-400)/250;
}
// 进带变绿后：300ms 内保持，之后 200ms 淡到 40%（提示在，但不抢纵向微调的注意力）
function axisEnterAlpha(now){
  if(!axisEntered) return 1;
  const e=now-axisEntryAt;
  if(e<=300) return 1;
  if(e>=500) return 0.4;
  return 1-(e-300)/200*0.6;
}
function drawAxisGuides(now, p){
  if(mode!=='axis' || axisLevel>=4) return;
  const a=axisGuideAlpha(now); if(a<=0.02) return;
  const bh=axisBandHalfDeg()*D2R;
  const dpr=devicePixelRatio||1;
  const horizonY=H*0.5+f*Math.tan(pitch);
  const topY=Math.max(horizonY, p? p.sy : horizonY);   // 顶部与目标中心同高截断；不穿过天空
  const x1=W*0.5+f*Math.tan(wrapPi(tYaw-bh-yaw));
  const x2=W*0.5+f*Math.tan(wrapPi(tYaw+bh-yaw));
  const aa=a*axisEnterAlpha(now);
  window.__axisGuideAlpha=Math.round(aa*100)/100;
  window.__axisGuideEntered=axisEntered;
  ctx.save();
  ctx.globalAlpha=aa;
  ctx.strokeStyle=axisGreen? '#4ade80' : '#E0407F';
  ctx.lineWidth=1*dpr;
  if(axisLevel===2) ctx.setLineDash([6*dpr,6*dpr]);
  ctx.beginPath();
  ctx.moveTo(x1, topY); ctx.lineTo(x1, H);
  ctx.moveTo(x2, topY); ctx.lineTo(x2, H);
  ctx.stroke();
  if(axisGreen && now<axisPulseUntil){   // 变绿瞬间 80ms 亮度脉冲
    ctx.globalAlpha=aa*0.55;
    ctx.strokeStyle='#b7ffd0';
    ctx.setLineDash([]);
    ctx.stroke();
  }
  ctx.restore();
}

// 渲染与输入分离：输入只改角度，绘制全走 rAF 主循环
function drawFrame(now){
  const frameDt=Math.min(80, lastDraw? now-lastDraw : 16);
  lastDraw=now;

  drawSceneBase(now, frameDt, true);

  if(alive){
    const cp=Math.cos(tPitch);
    const tw=DIST*cp*Math.sin(tYaw), th=DIST*Math.sin(tPitch), td=DIST*cp*Math.cos(tYaw);
    const p=project(tw,th,td);
    if(p){
      if(mode==='axis') drawAxisGuides(now,p);
      const rad=Math.max(4, f*Math.tan(radius*D2R));
      // 统一球体（与标定页/跟枪页同款）：tgtFill 填充 + tgt 描边 + 中心点
      // 单一平面渲染：不加高光、不加阴影——2D 里偏移的高光会跟着球跑，像脏点
      ctx.beginPath(); ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);
      ctx.fillStyle=SC.tgtFill; ctx.fill();
      ctx.strokeStyle=SC.ring||SC.tgt; ctx.lineWidth=2.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*0.25,0,Math.PI*2);
      ctx.fillStyle=SC.tgt; ctx.fill();
      // 倒计时只当警告：剩余 <35% 才出现，画在球内侧，不冒充靶子
      if(limitChk.checked){
        const left=Math.max(0, 1-(now-tSpawn)/allowed);
        if(left<0.35){
          ctx.beginPath();
          ctx.arc(p.sx,p.sy, rad*0.95, -Math.PI/2, -Math.PI/2+Math.PI*2*left);
          ctx.strokeStyle='rgba(248,81,73,.55)';
          ctx.lineWidth=1.5*devicePixelRatio; ctx.stroke();
        }
      }
    }
    // 画面外的球：屏幕边缘画指向箭头，180° 也能立刻知道往哪转
    {
      const m=52*devicePixelRatio;
      const c2=toCam(tw,th,td);
      let ex=null, ey=null;
      if(c2.z>NEAR){
        ex=p? p.sx : W/2+(c2.x/c2.z)*f;
        ey=p? p.sy : H/2-(c2.y/c2.z)*f;
        const inX=ex>m&&ex<W-m, inY=ey>m&&ey<H-m;
        if(inX&&inY){ ex=null; }
      } else {
        // 在身后：按水平差决定左右
        ex=(wrapPi(tYaw-yaw)>=0)? W-m : m;
        ey=H/2-Math.max(-1,Math.min(1,wrapPi(tPitch-pitch)))*H*0.32;
      }
      if(ex!==null){
        const dx=ex-W/2, dy=ey-H/2;
        const len=Math.hypot(dx,dy)||1;
        const ux=dx/len, uy=dy/len;
        // 把指向位置压到屏幕边缘内
        ex=W/2+ux*Math.min(W/2-m*0.6, Math.abs(dx));
        ey=H/2+uy*Math.min(H/2-m*0.6, Math.abs(dy));
        const ang=Math.atan2(uy,ux);
        const s=13*devicePixelRatio;
        ctx.save();
        ctx.translate(ex,ey); ctx.rotate(ang);
        ctx.beginPath();
        ctx.moveTo(s,0); ctx.lineTo(-s*0.7, s*0.7); ctx.lineTo(-s*0.7, -s*0.7);
        ctx.closePath();
        // 高对比：目标色填充 + 明暗对应的描边（原 ring/edge 在浅色场景会隐形）
        ctx.fillStyle=SC.tgt; ctx.fill();
        ctx.strokeStyle=SC.dark? 'rgba(255,255,255,.92)' : 'rgba(17,24,39,.92)';
        ctx.lineWidth=2*devicePixelRatio; ctx.stroke();
        ctx.restore();
      }
    }
  }

  const cx=W/2, cy=H/2;
  const dynF=dynamicFactor(now);
  // 准星击中反馈：命中后闪 0.2 秒——默认背景对比色，可自定义
  let crossC=SC.cross;
  if(hitCrossMode!=='off' && hitCrossUntil>now){
    crossC = (hitCrossMode==='custom' && hitCrossColor)
      ? hitCrossColor
      : (SC.dark? 'rgba(255,255,255,.95)' : 'rgba(17,24,39,.95)');
  }
  ctx.save();
  ctx.globalAlpha=crossAlpha;
  if(crossType==='dot'){
    // 圆点准星：只有大小与边框
    const r=(dotSize==='large'?6:3)*(1+0.4*dynF)*devicePixelRatio;
    if(dotOutl){ ctx.beginPath(); ctx.arc(cx,cy,r+1.5*devicePixelRatio,0,Math.PI*2); ctx.fillStyle=SC.edge; ctx.fill(); }
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=crossC; ctx.fill();
  } else {
    // 十字准星：长/宽/间隙 + 中心点 + 描边；动态模式随移动速度张开
    const len=(crossLen*(1+0.5*dynF))*devicePixelRatio;
    const gap=(crossGap*(1+0.9*dynF))*devicePixelRatio;
    const wd=crossWid*devicePixelRatio;
    function drawBars(col,lw){
      ctx.strokeStyle=col; ctx.lineWidth=lw;
      ctx.beginPath();
      ctx.moveTo(cx-gap-len,cy); ctx.lineTo(cx-gap,cy);
      ctx.moveTo(cx+gap,cy); ctx.lineTo(cx+gap+len,cy);
      ctx.moveTo(cx,cy-gap-len); ctx.lineTo(cx,cy-gap);
      ctx.moveTo(cx,cy+gap); ctx.lineTo(cx,cy+gap+len);
      ctx.stroke();
    }
    if(crossOutl) drawBars(SC.edge, wd+2.5*devicePixelRatio);
    drawBars(crossC, wd);
    if(crossDot){
      // 中心点：小方块，粗细与十字线一致；描边同样覆盖它
      let s=Math.max(2, Math.round(wd/devicePixelRatio));
      if(s%2) s++;
      const sPx=s*devicePixelRatio;
      if(crossOutl){
        ctx.fillStyle=SC.edge;
        ctx.fillRect(cx-sPx/2-devicePixelRatio, cy-sPx/2-devicePixelRatio, sPx+2*devicePixelRatio, sPx+2*devicePixelRatio);
      }
      ctx.fillStyle=crossC;
      ctx.fillRect(cx-sPx/2, cy-sPx/2, sPx, sPx);
    }
  }
  ctx.restore();

  // 旧命中特效：闪光 / 碎裂（仅回滚模式保留；默认路径用精度编码反馈）
  if(ARENA_DECOR && hitFx && now<hitFx.until+200){
    const cp=Math.cos(hitFx.tp);
    const tp=project(DIST*cp*Math.sin(hitFx.ty), DIST*Math.sin(hitFx.tp), DIST*cp*Math.cos(hitFx.ty));
    if(tp){
      if((hitFxMode==='flash' || (hitFxMode==='both' && hitFxMix.charAt(0)==='1')) && now<hitFx.until){
        const k=(hitFx.until-now)/250;
        const fr=16*devicePixelRatio;
        const fg=ctx.createRadialGradient(tp.sx,tp.sy,fr*0.5, tp.sx,tp.sy, fr*1.7);
        fg.addColorStop(0, hexA(SC.tgt, (SC.dark? 0.28 : 0.18)*k));
        fg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=fg;
        ctx.beginPath(); ctx.arc(tp.sx,tp.sy,fr*1.7,0,Math.PI*2); ctx.fill();
      }
      if(hitFx.parts){
        const m=(now-(lastDraw||now))/16.7;
        hitFx.parts.forEach(pt=>{
          if(now>=pt.t) return;
          pt.x+=pt.vx*m; pt.y+=pt.vy*m;
          const k=Math.max(0,(pt.t-now)/140);
          ctx.beginPath();
          ctx.arc(tp.sx+pt.x, tp.sy+pt.y, pt.r, 0, Math.PI*2);
          ctx.fillStyle=hexA(SC.tgt, Math.min(1, k));
          ctx.fill();
        });
      }
    }
  }

  // 命中反馈（精度编码）：先画目标残影保住轮廓，再叠光晕，最后点自己打中的位置
  if(ARENA_DECOR){ drawHitFeedback(now); }
  else { drawHitGhost(now); drawHitBurst(now); drawClickTick(now); }

  if(feedback && now<feedback.until){
    ctx.textAlign='center';
    ctx.font='bold '+(26*devicePixelRatio)+'px "Microsoft YaHei"';
    ctx.fillStyle= feedback.hit? '#3fb950' : '#f85149';
    ctx.fillText(feedback.over ? (EN_UI?'TIMEOUT':'超时')
      : feedback.hit ? ((EN_UI?'HIT ':'命中 ')+Math.round(feedback.mt)+'ms')
      : ((EN_UI?'OFF ':'偏 ')+(feedback.err-radius).toFixed(2)+'°'), W/2, H*0.28);
    ctx.textAlign='left';
  }

  updateHud(now);
}

let hudLastHtml='';
function updateHud(now){
  // 内容不变就不碰 DOM：每帧重建 innerHTML 是帧时间抖动的主要来源
  const recent=hitFlags.slice(-10);
  const rate=recent.length? Math.round(recent.filter(Boolean).length/recent.length*100) : 0;
  const html=(endMode==='time'
      ? '剩余 <b>'+Math.max(0,((endAt-performance.now())/1000)).toFixed(1)+'</b>s &nbsp; 已打 <b>'+trial+'</b> 球'
      : '第 <b>'+(trial+1)+'</b>/'+TOTAL)
      +' &nbsp; 球半径 <b>'+radius.toFixed(2)+'°</b> &nbsp; '+cm360.toFixed(1)+' cm/360'+
      (mode==='axis'? ' &nbsp; 分轴 <b>A'+axisLevel+'</b>':'')+'<br>'+
    '近 10 球命中率 <b>'+rate+'%</b> &nbsp; 连击 <b>'+streak+'</b>'+(limitChk.checked? ' &nbsp; 限时 <b>'+Math.round(allowed)+'ms</b>':'')+'<br>'+
    (fpsShow? ' <span style="color:var(--hud-fps,var(--acc))">· '+fpsVal+' fps</span>':'')+
    '<br><span style="font-size:13px;color:var(--hud-dim,var(--dim))">'+
      (mode==='axis'? (axisLevel>=4? 'A4 无线：直接二维瞄准 → 点击' : '先横移进带（线变绿）→ 上下微调 → 点击') : '看到球 → 甩过去 → 手停 → 点击')+'</span>';
  if(html!==hudLastHtml){ hudLastHtml=html; hud.innerHTML=html; }
}

(function(){
  var hint = document.getElementById('sensHint');
  if(!hint) return;
  function num(id, def){ var el=document.getElementById(id); if(!el) return def; var v=parseFloat(el.value); return isFinite(v)? v : def; }
  function upd(){
    var d = num('dpi',800), y = num('yaw', document.getElementById('yaw')?0.022:0), c = num('cm',27);
    if(!(d>0 && c>0)) { hint.textContent=''; return; }
    var s = y>0 ? 360/((c/2.54)*d)/y : 0;
    var sIn = num('sens', NaN);   // 用户自己存的灵敏度优先显示
    if(isFinite(sIn) && sIn>0) s = sIn;
    var ms=document.getElementById('mode');
    var mName=(ms && ms.options && ms.selectedIndex>=0)? ms.options[ms.selectedIndex].textContent : '';
    var em=document.getElementById('endMode');

    else { info=(EN_UI?' · ':' · ')+Math.max(20,parseInt(document.getElementById('cnt').value)||40)+(EN_UI?' shots':' 球'); }
    var txt=mName+info+(EN_UI?' · ':' · ')+c.toFixed(1)+' cm/360';
    if(y>0) txt += (EN_UI?' · sens ':' · 灵敏度 ')+'<b style="color:var(--txt);font-weight:600">'+s.toFixed(2)+'</b>';
    hint.innerHTML = txt;
  }
  ['dpi','yaw','cm','cnt','endTime'].forEach(function(id){

    if(el){ el.addEventListener('input',upd); el.addEventListener('change',upd); }
  });

})();

(function(){
  var dpi=document.getElementById('dpi'), yaw=document.getElementById('yaw'),
      cm=document.getElementById('cm'), sn=document.getElementById('sens');
  if(!dpi||!cm||!sn) return;
  var busy=false;
  function n(el,def){ var v=parseFloat(el&&el.value); return isFinite(v)? v : def; }
  function toCm(){
    var d=n(dpi,1000), y= yaw? n(yaw,0.022) : 0.022, s=n(sn,0);
    if(d>0 && y>0 && s>0) cm.value=(360/(s*y)/d*2.54).toFixed(1);
  }
  function toSens(){
    var d=n(dpi,1000), y= yaw? n(yaw,0.022) : 0.022, c=n(cm,0);
    if(d>0 && y>0 && c>0) sn.value=(360/((c/2.54)*d)/y).toFixed(2);
  }
  sn.addEventListener('input', function(){ if(busy)return; busy=true; toCm(); busy=false; if(window.__updSensHint) window.__updSensHint(); });
  [dpi,yaw,cm].forEach(function(el){ if(!el) return; el.addEventListener('input', function(){ if(busy)return; busy=true; toSens(); busy=false; }); });
  toSens();
})();

    device = q.get('device') || localStorage.getItem('cs2at.device') || 'mouse';
    if(device!=='pad'){
      padMode='off';
    } else {
      padMode = q.get('padMode') || localStorage.getItem('cs2at.padMode') || 'vel';
    }
    if(window.__updSensHint) window.__updSensHint();
  }catch(e){}
})();

    if(D[s]!==undefined) return t.replace(s, D[s]);
    for(var i=0;i<RULES.length;i++){ if(RULES[i][0].test(s)) return t.replace(s, s.replace(RULES[i][0], RULES[i][1])); }
    return t;
  }
  function walk(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n;
    while((n=w.nextNode())){
      var v=n.nodeValue; if(!v || !/[\u4e00-\u9fa5]/.test(v)) continue;

<script>
(function(){
  var back=document.getElementById('back');
  // 返回键不能被游戏的 mousedown（射击/继续）吃掉
  ['mousedown','pointerdown','mouseup','pointerup','click'].forEach(function(t){
    back.addEventListener(t, function(e){ e.stopPropagation(); }, true);
  });
  // 返回键只在开始/暂停/结果等浮层（.overlay.show）出现时显示：游戏中隐藏，全屏里点不到，还会压住左上角 HUD
  function sync(){
    var shown=document.querySelectorAll('.overlay.show').length>0;
    var resShown=!!(document.getElementById('res') && document.getElementById('res').classList.contains('show'));
    // 结果页的出口都在面板里：隐藏左上角「← 返回」；开始/暂停页仍保留
    back.classList.toggle('on', shown && !resShown);
    // 浮层出现时隐藏游戏 HUD：结果页/暂停页不再叠着旧 HUD 文字（开始页 HUD 本来就是空的）
    hud.style.visibility = shown? 'hidden' : '';
  }
  ['msg','res'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:['class']});
  });
  sync();
  addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    if(document.fullscreenElement) return;   // 全屏时 Esc 只退出全屏，不离开页面
    location.href='../app.html#play';
  });
})();

/* ===== 暂停面板：参数折叠 ===== */
(function(){
  var more=document.getElementById('more'), msg=document.getElementById('msg');
  if(!more||!msg) return;
  function sync(){
    more.style.display = 'inline-block';
    more.textContent = msg.classList.contains('showParams') ? '收起参数 ▴' : '参数 ▾';
  }
  more.addEventListener('click', function(e){
    e.stopPropagation();
    msg.classList.toggle('showParams');
    sync();
  });
  new MutationObserver(sync).observe(msg,{attributes:true,attributeFilter:['class']});
  sync();
})();

/* ===== 交互补丁：场景色块 / 可点提示 ===== */
(function(){
  var row=document.getElementById('sceneRow');
  var adv=document.getElementById('adv');
  var hint=document.getElementById('sensHint');
  var NAMES={classic:'经典',lake:'湖泊',jade:'墨玉',ink:'墨鱼',light:'浅灰',night:'暗蓝',mono:'纯黑',cs:'沙色'};

  function current(){
    var keys=Object.keys(SCENES);
    for(var i=0;i<keys.length;i++){ if(SCENES[keys[i]]===SC) return keys[i]; }
    return 'classic';
  }

  function paint(){
    if(!row) return;
    var cur=current();
    var isAuto=(function(){ try{ return localStorage.getItem('cs2at.sceneUser')!=='1'; }catch(e){ return true; } })();
    var html='<button data-follow="1" style="display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;'
      +'border:1px solid '+(isAuto?'var(--acc)':'var(--line)')+';background:transparent;cursor:pointer;font-size:12.5px;'
      +'font-family:inherit;color:'+(isAuto?'var(--txt)':'var(--dim)')+'">跟随主题</button>';
    html += Object.keys(SCENES).map(function(k){
      var s=SCENES[k];
      var on=(k===cur)?'border-color:var(--acc);color:var(--txt)':'border-color:var(--line);color:var(--dim)';
      return '<button data-scene="'+k+'" style="display:flex;align-items:center;gap:7px;padding:6px 11px;'
        +'border-radius:9px;border:1px solid;background:transparent;cursor:pointer;font-size:12.5px;font-family:inherit;'+on+'">'
        +'<span style="width:11px;height:11px;border-radius:50%;background:'+s.bg+';border:1px solid '+s.cross+'"></span>'
        +NAMES[k]+'</button>';
    }).join('');
    row.innerHTML=html;

    row.querySelector('[data-follow]').addEventListener('click', function(){
      try{ localStorage.removeItem('cs2at.sceneUser'); }catch(e){}
      SC=SCENES[pickScene()];   // 只换训练场景
      paint();
    });
    row.querySelectorAll('[data-scene]').forEach(function(b){
      b.addEventListener('click', function(){
        var k=b.dataset.scene;
        try{ localStorage.setItem('cs2at.scene', k); localStorage.setItem('cs2at.sceneUser','1'); }catch(e){}
        SC=SCENES[k];          // 只换训练场景（球/准星/背景），界面不动
        paint();
      });
    });
  }
  paint();

  // 灵敏度那行：点一下展开参数
  if(hint){
    hint.title='去设置里改灵敏度';
    hint.addEventListener('click', function(e){ e.stopPropagation(); location.href='../app.html#set'; });
  }
})();

/* 恢复上次的结束方式 */
(function(){
  try{
    var m=localStorage.getItem('cs2at.endMode'), t=localStorage.getItem('cs2at.endTime');
    var sm=document.getElementById('endMode'), st=document.getElementById('endTime');
    if(m && sm) sm.value=m;
    if(t && st) st.value=t;
  }catch(e){}
})();

/* 六维检查：结束方式/时长自动锁 90 秒，防止在参数面板改坏检查 */
(function(){
  try{
    var ms=document.getElementById('mode'), em=document.getElementById('endMode'),
        et=document.getElementById('endTime'), cnt=document.getElementById('cnt');
    var checkPre=null;
    function syncCheck(){
      var on=(ms.value==='check');
      // 进检查：记住用户选的结束方式/时长，强制 90 秒；退出时还原，不污染下一个模式
      if(on && !checkPre){ checkPre={ em: em? em.value : null, et: et? et.value : null }; }
      if(on){ if(em) em.value='time'; if(et) et.value='90'; }
      else if(checkPre){ if(em && checkPre.em) em.value=checkPre.em; if(et && checkPre.et) et.value=checkPre.et; checkPre=null; }
      if(em) em.disabled=on;
      if(et) et.disabled=on;
      if(cnt) cnt.disabled=on;
      // 标题跟着所选模式走（选项文案本身已按语言翻译）
      var tt=document.getElementById('titleTop');
      if(tt && ms.options && ms.selectedIndex>=0) tt.textContent=ms.options[ms.selectedIndex].textContent;
      // 每个模式一行说明：这个模式练什么、指标是什么
      var mn=document.getElementById('modeNote');
      if(mn){
        var notes={
          staircase:'固定 18° 距离，球会按命中率自动变大变小；收敛后的尺寸 = 你在 85% 命中率下能稳定打中的最小目标。',
          distance:'距离 5–45° 随机、方向随机；练「换距离」时的适应力，结果按距离分箱对比。',
          axis:'分轴定位：目标出现 → 两条竖线标出水平带 → 准星横移进带立刻变绿 → 只剩上下微调 → 点击。记 T1 横移 / T2 微调 / 纵向误差。'
        };
        mn.textContent = notes[ms.value] || '';
        mn.style.display = notes[ms.value] ? '' : 'none';
      }
      if(window.__updSensHint) window.__updSensHint();
      // 检查模式下死控件直接隐藏，换成一行只读说明
      var fe=document.getElementById('fldEnd'), fc=document.getElementById('fldCnt'), ft=document.getElementById('fldEndTime'), cn=document.getElementById('checkNote'), cr=document.getElementById('chkRow');
      if(fe) fe.style.display = on? 'none' : '';
      if(fc) fc.style.display = on? 'none' : '';
      if(ft) ft.style.display = on? 'none' : '';
      if(cr) cr.style.display = on? 'none' : '';
      if(cn) cn.style.display = on? '' : 'none';
    }
    ms.addEventListener('change', syncCheck);
    syncCheck();
    var sw=document.getElementById('switchMode');
    if(sw) sw.addEventListener('click', function(e){ e.preventDefault(); e.stopPropagation(); if(ms){ ms.value='random'; } syncCheck(); });

    // 场景选择器：记住上次选择，自定义时展开取色器
    var ss=document.getElementById('sceneSel'), cs=document.getElementById('customScene');
    try{
      var custom=localStorage.getItem('cs2at.sceneCustom');
      if(custom){
        var cc=JSON.parse(custom);
        if(cc.bg){ var b=document.getElementById('scBg'); if(b) b.value=cc.bg; }
        if(cc.tg){ var t=document.getElementById('scTgt'); if(t) t.value=cc.tg; }
        if(ss) ss.value='custom';
      } else if(localStorage.getItem('cs2at.sceneUser')==='1'){
        var sc=localStorage.getItem('cs2at.scene');
        if(sc && ss && ['classic','jade','ink','light','night','mono','cs'].indexOf(sc)>=0) ss.value=sc;
      }
    }catch(e){}
    function syncScene(){ if(cs) cs.style.display=(ss.value==='custom')? '' : 'none'; }
    ss.addEventListener('change', syncScene);
    syncScene();
  }catch(e){}
})();
</script>

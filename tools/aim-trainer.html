<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>甩枪训练 · 自适应难度</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;color:#e6edf3;font-family:"Microsoft YaHei",sans-serif}
  canvas{display:block;cursor:none}
  #hud{position:fixed;left:22px;top:16px;font-size:14px;line-height:1.9;pointer-events:none;text-shadow:0 0 6px #000}
  #hud b{color:#58a6ff}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;font-size:16px;line-height:2;color:#c9d1d9;background:rgba(11,15,20,.96);overflow:auto;padding:24px}
  .overlay.show{display:flex}
  .btn{margin-top:22px;padding:13px 40px;font-size:16px;font-family:inherit;cursor:pointer;
    background:#238636;border:1px solid #2ea043;color:#fff;border-radius:8px;pointer-events:auto}
  .btn:hover{background:#2ea043}
  .btn.alt{background:#21262d;border-color:#30363d;margin-left:10px}
  table{border-collapse:collapse;margin-top:12px}
  td,th{padding:6px 16px;text-align:right;border-bottom:1px solid #21262d;font-size:14px}
  th{color:#8b949e;font-weight:500}
  input[type=checkbox]{width:16px;height:16px;vertical-align:-2px;pointer-events:auto}
  .fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#8b949e}
  .fld input,.fld select{padding:7px 9px;background:#0d1117;border:1px solid #30363d;color:#e6edf3;
    border-radius:7px;font-size:14px;font-family:inherit;width:112px}
  summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>

<div id="msg" class="overlay show">
  <div style="font-size:26px;color:#e9eef3;font-weight:700;letter-spacing:2px">甩枪训练</div>
  <div style="margin-top:8px;color:#9fb0bd;font-size:14px">看到球 → 甩过去 → 手停 → 点击</div>
  <button id="go" class="btn" style="margin-top:26px;padding:16px 64px;font-size:18px;letter-spacing:2px">开 始</button>
  <div id="sensHint" style="margin-top:14px;font-size:13px;color:#8b949e"></div>
  <div id="bw" style="margin-top:10px;font-size:13px;color:#d29922"></div>

  <details style="margin-top:22px;width:100%;max-width:520px;text-align:left">
    <summary style="cursor:pointer;color:#8b949e;font-size:13px;text-align:center;list-style:none">
      ▸ 高级设置
    </summary>
    <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center">
      <label class="fld">模式
        <select id="mode">
          <option value="random">自适应随机</option>
          <option value="block">定角重复</option>
          <option value="precision">小球精度</option>
        </select>
      </label>
      <label class="fld">球数<input id="cnt" type="number" step="10" value="40"></label>
      <label class="fld">DPI<input id="dpi" type="number" step="100" value="1000"></label>
      <label class="fld">m_yaw<input id="yaw" type="number" step="0.0001" value="0.013052"></label>
      <label class="fld">CS 灵敏度<input id="sens" type="number" step="0.01" placeholder="自动"></label>
      <label class="fld">cm/360<input id="cm" type="number" step="0.1" value="36.5"></label>
    </div>
    <div style="margin-top:12px;display:flex;gap:18px;justify-content:center;font-size:13px;color:#9fb0bd">
      <label><input id="limit" type="checkbox" checked> 时间限制</label>
      <label><input id="shrink" type="checkbox"> 收缩模式</label>
    </div>
  </details>
</div>

<div id="res" class="overlay"><div id="resBody"></div>
  <div><button id="again" class="btn">再来一组</button>
  <button id="copy" class="btn alt">复制本组数据</button>
  <button id="close" class="btn alt">关闭</button></div>
</div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hud=document.getElementById('hud');
const msg=document.getElementById('msg'), go=document.getElementById('go');
const res=document.getElementById('res'), resBody=document.getElementById('resBody');
const shrinkChk=document.getElementById('shrink');
const limitChk=document.getElementById('limit');

let DPI=1000, TOTAL=40, FOVH=90, DIST=10, EYE=1.6, NEAR=0.25;
const R0=1.5, RMIN=0.35, RMAX=3.0;
const PITCH_LIM=75*Math.PI/180, D2R=Math.PI/180, R2D=180/Math.PI;

let W=0,H=0,f=1;
let yaw=0, pitch=0, tYaw=0, tPitch=0, sYaw=0, sPitch=0;
let running=false, paused=false, pauseAt=0;
let cm360=27.2, radius=R0, trial=0, hits=0, streak=0, bestStreak=0;
let tSpawn=0, alive=false, nextAt=0;
let times=[], errs=[], hitFlags=[], blocks=[], allowed=800, timeouts=0, timeFactor=1.25;
let blockTimes=[], blockHits=0;
let mode='random', blockYaw=0, blockPitch=0, blockLeft=0;
let fpsCap=0, fpsShow=true, lastDraw=0, fpsFrames=0, fpsLast=0, fpsVal=0;

const wrapPi=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
const med=a=>{ if(!a.length)return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; };

function resize(){
  W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  f=(W/2)/Math.tan(FOVH/2*D2R);
}
addEventListener('resize',resize); resize();

function toCam(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1=x*cy-z*sy, z1=x*sy+z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return {x:x1, y:y*cp-z1*sp, z:y*sp+z1*cp};
}
const projCam=c=>({sx:W/2+(c.x/c.z)*f, sy:H/2-(c.y/c.z)*f});
const project=(x,y,z)=>{ const c=toCam(x,y,z); return c.z<=NEAR?null:projCam(c); };
function line3(x1,y1,z1,x2,y2,z2,col){
  let a=toCam(x1,y1,z1), b=toCam(x2,y2,z2);
  if(a.z<NEAR&&b.z<NEAR) return;
  if(a.z<NEAR){ const t=(NEAR-a.z)/(b.z-a.z); a={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:NEAR}; }
  else if(b.z<NEAR){ const t=(NEAR-b.z)/(a.z-b.z); b={x:b.x+(a.x-b.x)*t,y:b.y+(a.y-b.y)*t,z:NEAR}; }
  const pa=projCam(a), pb=projCam(b);
  ctx.strokeStyle=col; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
}
const SCENES={
  classic:{dark:true,halo:.22,bg:'#0b0f14',major:'rgba(88,166,255,.55)',minor:'rgba(64,76,90,1)',ceil:'rgba(50,60,72,1)',
       tgt:'#f85149',tgtFill:'rgba(248,81,73,.30)',ring:'rgba(248,81,73,.95)',cross:'#3fb950',edge:'#000000'},
  jade:{dark:true,halo:.40,bg:'#101917',major:'rgba(127,191,166,.50)',minor:'rgba(58,84,78,1)',ceil:'rgba(44,64,60,1)',
       tgt:'#e0a458',tgtFill:'rgba(224,164,88,.85)',ring:'#fff6e6',cross:'#7fbfa6',edge:'#000000'},
  ink:{dark:true,halo:.45,bg:'#12181d',major:'rgba(15,118,110,.55)',minor:'rgba(58,74,82,1)',ceil:'rgba(44,58,66,1)',
       tgt:'#ffb020',tgtFill:'rgba(255,176,32,.85)',ring:'#ffffff',cross:'#ffffff',edge:'#000000'},
  light:{dark:false,halo:.30,bg:'#eef1f4',major:'rgba(15,118,110,.45)',minor:'rgba(160,172,182,1)',ceil:'rgba(184,194,203,1)',
       tgt:'#e8590c',tgtFill:'rgba(232,89,12,.85)',ring:'#ffffff',cross:'#111827',edge:'#ffffff'},
  night:{dark:true,halo:.35,bg:'#0b0f14',major:'rgba(88,166,255,.50)',minor:'rgba(64,76,90,1)',ceil:'rgba(50,60,72,1)',
       tgt:'#ff5f56',tgtFill:'rgba(255,95,86,.85)',ring:'#ffffff',cross:'#7ee787',edge:'#000000'},
  mono:{dark:true,halo:.40,bg:'#0f1113',major:'rgba(200,205,215,.40)',minor:'rgba(88,92,100,1)',ceil:'rgba(70,73,80,1)',
       tgt:'#ffd166',tgtFill:'rgba(255,209,102,.85)',ring:'#000000',cross:'#ffffff',edge:'#000000'},
  cs:{dark:true,halo:.35,bg:'#2b2620',major:'rgba(214,181,120,.45)',minor:'rgba(120,110,88,1)',ceil:'rgba(98,90,72,1)',
       tgt:'#e5484d',tgtFill:'rgba(229,72,77,.85)',ring:'#ffffff',cross:'#b8e986',edge:'#000000'}
};
let SC = SCENES[ (function(){ try{ return localStorage.getItem('cs2at.scene')||'classic'; }catch(e){ return 'ink'; } })() ] || SCENES.classic;
try{
  document.body.style.background=SC.bg;
  document.body.style.color = SC.dark? '#e9eef3' : '#1f2b2c';
}catch(e){}


function grid(){
  const perf = (function(){ try{ return localStorage.getItem('cs2at.perf')==='1'; }catch(e){ return false; } })();
  const R=44, step = perf? 8 : 3;
  for(let v=-R;v<=R;v+=step){
    line3(v,-EYE,-R,v,-EYE,R,(v===0)? SC.major : SC.minor);
    line3(-R,-EYE,v,R,-EYE,v,(v===0)? SC.major : SC.minor);
    if(!perf){ line3(v,4.2,-R,v,4.2,R,SC.ceil);
               line3(-R,4.2,v,R,4.2,v,SC.ceil); }
  }
}

function doLock(){
  try{ const r=cv.requestPointerLock({unadjustedMovement:true});
    if(r&&r.catch) r.catch(()=>{ try{cv.requestPointerLock()}catch(e){} }); }
  catch(e){ try{cv.requestPointerLock()}catch(e2){} }
}

function start(){
  TOTAL=parseInt(document.getElementById('cnt').value)||40;
  if(TOTAL<20) TOTAL=20; if(TOTAL>120) TOTAL=120;
  DPI=parseFloat(document.getElementById('dpi').value)||1000;
  cm360=parseFloat(document.getElementById('cm').value)||27.2;
  if(cm360<12) cm360=12; if(cm360>60) cm360=60;
  try{
    fpsCap=parseInt(localStorage.getItem('cs2at.fps')||'0')||0;
    fpsShow=localStorage.getItem('cs2at.fpsShow')!=='0';
  }catch(e){}
  lastDraw=0; fpsFrames=0; fpsLast=performance.now(); fpsVal=0;
  try{
    SC = SCENES[localStorage.getItem('cs2at.scene')||'night'] || SCENES.night;
    document.body.style.background = SC.bg;
    hud.style.color = SC.dark? '#e9eef3' : '#1f2b2c';
  }catch(e){}
  mode=(document.getElementById('mode')||{value:'random'}).value||'random';
  if(mode==='precision'){ radius=0.7; limitChk.checked=false; }
  else if(mode==='block'){ radius=R0; limitChk.checked=false; blockLeft=0; }
  try{ localStorage.setItem('cs2at.cfg', JSON.stringify({
      dpi: DPI, cm: cm360,
      yaw: (document.getElementById('yaw')||{}).value,
      sens: (document.getElementById('sens')||{}).value })); }catch(e){}
  running=true; paused=false;
  trial=0; hits=0; streak=0; bestStreak=0; if(mode==='random') radius=R0; allowed=800; timeouts=0; timeFactor=1.25;
  times=[]; errs=[]; hitFlags=[]; blocks=[]; blockTimes=[]; blockHits=0;
  msg.classList.remove('show'); res.classList.remove('show');
  yaw=0; pitch=0; alive=false;
  nextAt=performance.now()+300;
  if(!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
  doLock();
}

function spawn(){
  sYaw=yaw; sPitch=pitch;
  if(mode==='block'){
    if(blockLeft<=0){
      blockYaw=(Math.random()<0.5?-1:1)*(14+Math.random()*10)*D2R;
      blockPitch=(Math.random()*2-1)*5*D2R;
      blockLeft=8;
    }
    blockLeft--;
    tYaw=yaw+blockYaw; tPitch=pitch+blockPitch;
  } else {
    const a=(Math.random()<0.5?-1:1)*(12+Math.random()*16)*D2R;
    const b=(Math.random()*2-1)*8*D2R;
    tYaw=yaw+a; tPitch=pitch+b;
  }
  if(tPitch> 12*D2R) tPitch= 12*D2R;
  if(tPitch<-12*D2R) tPitch=-12*D2R;
  alive=true; tSpawn=performance.now();
}

function judge(){
  if(!running||paused||!alive) return;
  const now=performance.now();
  const err=Math.hypot(wrapPi(tYaw-yaw), wrapPi(tPitch-pitch))*R2D;
  const mt=now-tSpawn;
  const overtime = limitChk.checked && mt>allowed;
  const hit = (err<=radius) && !overtime;
  if(overtime) timeouts++;

  trial++; times.push(mt); errs.push(err); hitFlags.push(hit);
  blockTimes.push(mt);
  if(hit){ hits++; streak++; blockHits++; if(streak>bestStreak) bestStreak=streak; }
  else streak=0;

  // 每 8 个按 85% 原则调整难度（同一时间只调一个变量）
  if(trial%8===0){
    const recent=hitFlags.slice(-8);
    const rate=recent.filter(Boolean).length/8;
    if(mode!=='random'){ /* 定角/精度模式不调难度 */ }
    else if(limitChk.checked){
      // 只调允许时间：锚定在你的实际速度上，再按命中率微调系数
      const base = med(times.slice(-8)) || 400;
      if(rate>=0.85) timeFactor=Math.max(0.80, timeFactor-0.06);
      else if(rate<0.70) timeFactor=Math.min(1.60, timeFactor+0.06);
      allowed = Math.max(260, Math.min(1500, base*timeFactor));
    } else {
      // 只调球大小
      if(rate>=0.80) radius=Math.max(RMIN, radius*0.92);
      else if(rate<0.60) radius=Math.min(RMAX, radius*1.08);
    }
  }

  // 每 20 个记录一段
  if(trial%20===0){
    blocks.push({ n:blocks.length+1, mt:med(blockTimes), hit:blockHits/blockTimes.length, r:radius, lim:allowed });
    blockTimes=[]; blockHits=0;
  }

  alive=false;
  feedback={ err:err, hit:hit, mt:mt, over:overtime, until:now+600 };

  if(trial>=TOTAL){ finish(); return; }
  nextAt=now+150+Math.random()*250;
}

let feedback=null;

function finish(){
  running=false; alive=false;
  if(document.pointerLockElement) document.exitPointerLock();
  const overallHit=hits/trial, overallMT=med(times.filter((v,i)=>hitFlags[i]));
  let rows='';
  blocks.forEach(b=>{
    rows+='<tr><td>第 '+b.n+' 段</td><td>'+b.mt.toFixed(0)+' ms</td><td>'+Math.round(b.hit*100)+'%</td><td>'+Math.round(b.lim)+' ms</td><td>'+b.r.toFixed(2)+'°</td></tr>';
  });
  resBody.innerHTML='<div style="font-size:18px;color:#58a6ff">训练报告</div>'+
    '<table><tr><th>阶段</th><th>命中用时(中位)</th><th>命中率</th><th>限时</th><th>球半径</th></tr>'+rows+'</table>'+
    '<div style="margin-top:14px;font-size:14px;color:#8b949e">'+
    '总计 '+trial+' 球 · 命中率 '+Math.round(overallHit*100)+'% · 中位用时 '+overallMT.toFixed(0)+' ms · 超时 '+timeouts+' 次 · 最长连击 '+bestStreak+
    '</div>';
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const minLim = blocks.length? Math.min.apply(null, blocks.map(b=>b.lim)) : allowed;
  window.__logLine = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+
    '  限时'+Math.round(minLim)+'ms  命中率'+Math.round(overallHit*100)+'%'+
    '  中位'+overallMT.toFixed(0)+'ms  超时'+timeouts+'次';
  const _d=new Date(), _p=n=>String(n).padStart(2,'0');
  const TODAY=_d.getFullYear()+'-'+_p(_d.getMonth()+1)+'-'+_p(_d.getDate());
  try{
    const key='cs2at.best', histKey='cs2at.runs';
    const b=JSON.parse(localStorage.getItem(key)||'{}');
    const rec=b[mode]||{runs:0};
    const limN=Math.round(minLim), hitN=Math.round(overallHit*100), mtN=Math.round(overallMT);
    if(rec.bestLimit===undefined || limN<rec.bestLimit) rec.bestLimit=limN;
    if(rec.bestHit===undefined || hitN>rec.bestHit) rec.bestHit=hitN;
    if(rec.bestMT===undefined || mtN<rec.bestMT) rec.bestMT=mtN;
    rec.runs=(rec.runs||0)+1; rec.date=TODAY;
    b[mode]=rec; localStorage.setItem(key, JSON.stringify(b));

    const hist=JSON.parse(localStorage.getItem(histKey)||'[]');
    hist.push({d:TODAY, mode:mode, limit:limN, hit:hitN, mt:mtN, to:timeouts});
    while(hist.length>300) hist.shift();
    localStorage.setItem(histKey, JSON.stringify(hist));
  }catch(e){}

  res.classList.add('show');
}

go.addEventListener('click',e=>{ e.stopPropagation(); start(); });
document.getElementById('again').addEventListener('click',e=>{ e.stopPropagation(); start(); });
document.getElementById('copy').addEventListener('click', function(e){
  e.stopPropagation();
  var t = window.__logLine || '';
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){
      e.target.textContent='已复制 ✓';
      setTimeout(function(){ e.target.textContent='复制本组数据'; }, 1500);
    }).catch(function(){ alert(t); });
  } else { alert(t); }
});
document.getElementById('close').addEventListener('click',e=>{ e.stopPropagation(); res.classList.remove('show'); msg.classList.add('show'); });

document.addEventListener('mousedown',e=>{
  if(!running) return;
  if(paused){ resume(); return; }
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
  judge();
});

function pause(){ if(!running||paused)return; paused=true; pauseAt=performance.now();
  go.textContent='继续'; msg.classList.add('show'); if(document.pointerLockElement) document.exitPointerLock(); }
function resume(){ if(!paused)return; const d=performance.now()-pauseAt;
  if(alive) tSpawn+=d; nextAt+=d; paused=false; msg.classList.remove('show'); doLock(); }
document.addEventListener('pointerlockchange',()=>{ if(!document.pointerLockElement && running && !paused) pause(); });
document.addEventListener('pointerlockerror',()=>{ if(running) pause(); });

addEventListener('pointerrawupdate',e=>{
  if(!running||paused) return;
  const k=(360/((cm360/2.54)*DPI))*D2R;
  yaw += (e.movementX||0)*k;
  pitch -= (e.movementY||0)*k;
  if(pitch>PITCH_LIM) pitch=PITCH_LIM;
  if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
},true);

function loop(){
  requestAnimationFrame(loop);
  if(!running||paused) return;

  const now=performance.now();
  if(alive && limitChk.checked && now-tSpawn>allowed){ judge(); }
  if(!alive && now>=nextAt) spawn();
  if(alive && shrinkChk.checked){
    const el=(now-tSpawn)/1000;
    radius=Math.max(RMIN, radius*Math.pow(0.88, 1/60));
  }

  // 帧率上限
  if(fpsCap){ const gap=1000/fpsCap; if(now-lastDraw < gap-1) return; }
  lastDraw=now;
  fpsFrames++;
  if(now-fpsLast>=500){ fpsVal=Math.round(fpsFrames*1000/(now-fpsLast)); fpsFrames=0; fpsLast=now; }

  ctx.fillStyle=SC.bg; ctx.fillRect(0,0,W,H);
  grid();

  if(alive){
    const cp=Math.cos(tPitch);
    const tw=DIST*cp*Math.sin(tYaw), th=DIST*Math.sin(tPitch), td=DIST*cp*Math.cos(tYaw);
    const p=project(tw,th,td);
    if(p){
      const rad=Math.max(5, f*Math.tan(radius*D2R));
      // 暗色光晕，保证任何背景上都跳出来
      const halo=ctx.createRadialGradient(p.sx,p.sy,rad*0.8,p.sx,p.sy,rad*2.4);
      halo.addColorStop(0,'rgba(0,0,0,'+SC.halo+')'); halo.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*2.4,0,Math.PI*2); ctx.fill();
      // 实心目标 + 白环
      ctx.beginPath(); ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);
      ctx.fillStyle=SC.tgtFill; ctx.fill();
      ctx.strokeStyle=SC.ring; ctx.lineWidth=Math.max(1.5,rad*0.10); ctx.stroke();
      // 中心点
      ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*0.20,0,Math.PI*2);
      ctx.fillStyle=SC.edge; ctx.fill();
      if(limitChk.checked){
        const left=Math.max(0, 1-(now-tSpawn)/allowed);
        ctx.beginPath();
        ctx.arc(p.sx,p.sy, rad+9*devicePixelRatio, -Math.PI/2, -Math.PI/2+Math.PI*2*left);
        ctx.strokeStyle= left>0.35? 'rgba(63,185,80,.9)' : 'rgba(248,81,73,.95)';
        ctx.lineWidth=3*devicePixelRatio; ctx.stroke();
      }
    }
  }

  const g2=16*devicePixelRatio, cx=W/2, cy=H/2;
  function drawCross(col,w){
    ctx.strokeStyle=col; ctx.lineWidth=w;
    ctx.beginPath();
    ctx.moveTo(cx-g2,cy); ctx.lineTo(cx-5,cy);
    ctx.moveTo(cx+5,cy); ctx.lineTo(cx+g2,cy);
    ctx.moveTo(cx,cy-g2); ctx.lineTo(cx,cy-5);
    ctx.moveTo(cx,cy+5); ctx.lineTo(cx,cy+g2);
    ctx.stroke();
  }
  drawCross(SC.edge, 5*devicePixelRatio);
  drawCross(SC.cross, 2*devicePixelRatio);

  if(feedback && now<feedback.until){
    ctx.textAlign='center';
    ctx.font='bold '+(26*devicePixelRatio)+'px "Microsoft YaHei"';
    ctx.fillStyle= feedback.hit? '#3fb950' : '#f85149';
    ctx.fillText(feedback.over? '超时' : feedback.hit? '命中 '+Math.round(feedback.mt)+'ms' : '偏 '+(feedback.err-radius).toFixed(2)+'°', W/2, H*0.28);
    ctx.textAlign='left';
  }

  const recent=hitFlags.slice(-10);
  const rate=recent.length? Math.round(recent.filter(Boolean).length/recent.length*100) : 0;
  hud.innerHTML='第 <b>'+(trial+1)+'</b>/'+TOTAL+' &nbsp; 球半径 <b>'+radius.toFixed(2)+'°</b> &nbsp; '+cm360.toFixed(1)+' cm/360<br>'+
    '近 10 球命中率 <b>'+rate+'%</b> &nbsp; 连击 <b>'+streak+'</b>'+(limitChk.checked? ' &nbsp; 限时 <b>'+Math.round(allowed)+'ms</b>':'')+'<br>'+
    (fpsShow? ' <span style="color:#3fb950">· '+fpsVal+' fps</span>':'')+
    '<br><span style="font-size:13px;color:#6e7681">看到球 → 甩过去 → 手停 → 点击</span>';
}
requestAnimationFrame(loop);

(function(){
  var el = document.getElementById('bw');
  if(!el) return;
  var ok = (typeof window !== 'undefined') && ('onpointerrawupdate' in window);
  if(!ok){
    el.innerHTML = '⚠️ 当前浏览器不支持 pointerrawupdate，采样精度会降低<br>' +
      '建议使用 <b style="color:#3fb950">Chrome</b> 或 <b style="color:#3fb950">Edge</b>';
  }
})();

(function(){
  var hint = document.getElementById('sensHint');
  if(!hint) return;
  function num(id, def){ var el=document.getElementById(id); if(!el) return def; var v=parseFloat(el.value); return isFinite(v)? v : def; }
  function upd(){
    var d = num('dpi',1000), y = num('yaw', document.getElementById('yaw')?0.022:0), c = num('cm',27);
    if(!(d>0 && c>0)) { hint.textContent=''; return; }
    var s = y>0 ? 360/((c/2.54)*d)/y : 0;
    if(y<=0){
      var sA = 360/((c/2.54)*d)/0.022, sB = 360/((c/2.54)*d)/0.0165;
      hint.innerHTML = '→ CS 灵敏度：m_yaw 0.022 → <b style="color:#3fb950">'+sA.toFixed(2)+
        '</b>　m_yaw 0.0165 → <b style="color:#3fb950">'+sB.toFixed(2)+'</b>' +
        '<br><span style="color:#6e7681;font-size:13px">'+c.toFixed(1)+' cm/360 · DPI '+d+
        ' · 180° 转身 '+(c/2).toFixed(1)+' cm</span>';
      return;
    }
    var txt = '→ 对应 <b style="color:#3fb950">' + (y>0? 'CS 灵敏度 '+s.toFixed(2) : 'cm/360 '+c.toFixed(1)) + '</b>';
    txt += ' &nbsp;<span style="color:#6e7681">(' + c.toFixed(1) + ' cm/360 · DPI ' + d + (y>0? ' · m_yaw '+y : '') + ')</span>';
    if(y>0) txt += '<br><span style="color:#6e7681;font-size:13px">360° 转身需要 ' + c.toFixed(1) + ' cm，180° 需要 ' + (c/2).toFixed(1) + ' cm</span>';
    hint.innerHTML = txt;
  }
  ['dpi','yaw','cm'].forEach(function(id){
    var el=document.getElementById(id);
    if(el){ el.addEventListener('input',upd); el.addEventListener('change',upd); }
  });
  upd();
  window.__updSensHint = upd;
})();

(function(){
  var dpi=document.getElementById('dpi'), yaw=document.getElementById('yaw'),
      cm=document.getElementById('cm'), sn=document.getElementById('sens');
  if(!dpi||!cm||!sn) return;
  var busy=false;
  function n(el,def){ var v=parseFloat(el&&el.value); return isFinite(v)? v : def; }
  function toCm(){
    var d=n(dpi,1000), y= yaw? n(yaw,0.022) : 0.022, s=n(sn,0);
    if(d>0 && y>0 && s>0) cm.value=(360/(s*y)/d*2.54).toFixed(1);
  }
  function toSens(){
    var d=n(dpi,1000), y= yaw? n(yaw,0.022) : 0.022, c=n(cm,0);
    if(d>0 && y>0 && c>0) sn.value=(360/((c/2.54)*d)/y).toFixed(2);
  }
  sn.addEventListener('input', function(){ if(busy)return; busy=true; toCm(); busy=false; if(window.__updSensHint) window.__updSensHint(); });
  [dpi,yaw,cm].forEach(function(el){ if(!el) return; el.addEventListener('input', function(){ if(busy)return; busy=true; toSens(); busy=false; }); });
  toSens();
})();

(function(){
  try{
    var q=new URLSearchParams(location.search);
    function set(id,v){ var el=document.getElementById(id); if(el && v!==null && v!=='') el.value=v; }
    set('mode',q.get('mode')); set('cnt',q.get('count')); set('dpi',q.get('dpi'));
    set('cm',q.get('cm')); set('yaw',q.get('yaw')); set('sens',q.get('sens'));
    if(q.get('limit')==='0'){ var l=document.getElementById('limit'); if(l) l.checked=false; }
    if(q.get('shrink')==='1'){ var sh=document.getElementById('shrink'); if(sh) sh.checked=true; }
    if(window.__updSensHint) window.__updSensHint();
  }catch(e){}
})();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵敏度标定 · 过冲法</title>
<style>
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);font-family:"Microsoft YaHei",sans-serif}
  canvas{display:block;cursor:none}
  #ui{position:fixed;left:24px;top:20px;font-size:14px;line-height:1.9;pointer-events:none;text-shadow:0 0 6px #000}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;font-size:16px;line-height:2;color:var(--txt);background:var(--overlay)}
  .overlay.show{display:flex}
  #back{position:fixed;left:16px;top:14px;z-index:40;display:none;font-size:13px;color:var(--dim);
    text-decoration:none;padding:7px 12px;border-radius:9px;border:1px solid transparent;transition:.15s}
  #back:hover{color:var(--acc);border-color:var(--line);background:var(--panel)}
  #back.on{display:inline-block}
  .btn{margin-top:24px;padding:13px 40px;font-size:16px;font-family:inherit;cursor:pointer;
    background:var(--acc);border:1px solid var(--acc);color:var(--on-acc);border-radius:8px;pointer-events:auto}
  .btn:hover{background:var(--acc)}
  input{width:110px;padding:8px;background:var(--panel);border:1px solid var(--line);color:var(--txt);
    border-radius:6px;font-size:15px;text-align:center;pointer-events:auto}
  table{border-collapse:collapse;margin-top:8px}
  .rt td,.rt th{padding:5px 14px;font-size:14px}
  #res{overflow:auto;padding:20px}
  #resBody{max-height:78vh;overflow:auto}
  td,th{padding:9px 20px;text-align:right;border-bottom:1px solid var(--panel)}
  th{color:var(--dim);font-weight:500}
  .big{font-size:30px;font-weight:700;color:var(--acc)}
</style>
</head>
<body>
<a id="back" href="../app.html#play">← 返回</a>
<canvas id="c"></canvas>
<div id="ui"></div>

<div id="msg" class="overlay show">
  <div style="font-size:19px;color:var(--acc);margin-bottom:10px">灵敏度标定 · 过冲法</div>
  <div>每次只出现一个球。看到球后<b>最快速度甩过去并点击</b>。<br>
  程序记录你点击时准星的位置，算出你<b>冲过头还是没到</b>。</div>
  <div style="margin-top:22px;color:#8b949e;font-size:14px">
    鼠标 DPI：<input id="dpi" type="number" step="100" value="1000" style="width:90px">
    &nbsp;m_yaw：<input id="yaw" type="number" step="0.0001" value="0.022" style="width:100px"><br>
    <span style="margin-top:10px;display:inline-block">当前 cm/360：<input id="cm" type="number" step="0.1" value="27"></span>
      <span style="margin-top:10px;display:inline-block">&nbsp;游戏灵敏度：<input id="sens" type="number" step="0.01" value="" placeholder="自动" style="width:90px"></span>
    &nbsp;&nbsp;球数：<input id="n" type="number" step="10" value="40" style="width:80px">
    &nbsp;球大小：<select id="bs" style="padding:7px;background:var(--panel);border:1px solid #30363d;color:#e6edf3;border-radius:6px;font-size:14px;pointer-events:auto">
      <option value="2.0">大（2.0°）</option>
      <option value="1.5" selected>标准（1.5°）</option>
      <option value="1.0">小（1.0°）</option>
      <option value="0.7">很小（0.7°）</option>
      <option value="0.45">极小（0.45°）</option>
    </select>
    <div style="margin-top:14px"><label style="pointer-events:auto;cursor:pointer">
      <input id="ex" type="checkbox" checked style="width:16px;height:16px;vertical-align:-2px">
      排除已命中（|过冲| &lt; 3%）的球</label></div></div>
  <div id="sensHint" style="margin-top:10px;font-size:14px;color:#8b949e"></div>
  <div id="bw" style="margin-top:12px;font-size:13px;line-height:1.8;color:#d29922"></div>
  <button id="go" class="btn">开始</button>
</div>

<div id="res" class="overlay"><div id="resBody"></div>
  <button id="again" class="btn">再测一轮</button>
  <button id="clr" class="btn" style="margin-top:10px;background:#21262d;border-color:#30363d;font-size:14px;padding:9px 26px">清空累计（输入值保留）</button></div>

<script src="../assets/scenes.js"></script>
<script>
const SCENES=window.GAME_SCENES;
const THEME2SCENE=window.THEME2SCENE;
function pickScene(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('scene') && SCENES[q.get('scene')]) return q.get('scene');
    const th=q.get('theme')||localStorage.getItem('cs2at.theme');
    if(th && THEME2SCENE[th]) return THEME2SCENE[th];
    const sc=localStorage.getItem('cs2at.scene');
    if(sc && SCENES[sc]) return sc;
  }catch(e){}
  return 'classic';
}
const SC=SCENES[pickScene()]||SCENES.classic;
(function(){
  const dark=!!SC.dark, r=document.documentElement.style;
  r.setProperty('--bg',SC.bg);
  r.setProperty('--txt',dark?'#e6edf3':'#14313a');
  r.setProperty('--dim',dark?'#8b949e':'#5b6b73');
  r.setProperty('--panel',dark?'var(--panel)':'#ffffff');
  r.setProperty('--line',dark?'#30363d':'#d7e0e4');
  const ui=SC.ui||SC.cross;
  const rgb=(function(h){h=(h||'').replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const v=parseInt(h,16);return isNaN(v)?[255,255,255]:[(v>>16)&255,(v>>8)&255,v&255];})(ui);
  const lum=(0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2])/255;
  r.setProperty('--acc',ui);
  r.setProperty('--on-acc', lum>0.62?'#111820':'#ffffff');
  r.setProperty('--overlay',dark?'rgba(11,15,20,.96)':'rgba(238,244,246,.97)');
})();

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ui=document.getElementById('ui');
const msg=document.getElementById('msg'), go=document.getElementById('go');
const res=document.getElementById('res'), resBody=document.getElementById('resBody'), again=document.getElementById('again');
const cmInput=document.getElementById('cm');

let DPI=1000, YAW=0.022;
const FOVH=90, DIST=10, EYE=1.6, NEAR=0.25;
const MIN_DIST=6, MAX_RATIO=3.2;
let nTrial=40;
const PITCH_LIM=75*Math.PI/180;
const D2R=Math.PI/180, R2D=180/Math.PI;

let W=0,H=0,f=1;
let yaw=0, pitch=0, tYaw=0, tPitch=0, sYaw=0, sPitch=0;
let running=false, paused=false, pauseAt=0, trial=0, tSpawn=0;
let ballDeg=1.5, lastSug=0, allRuns=[], cm360=23.2, result=null, fb=null, lastY=yaw, lastP=pitch, lastT=0, fastSeen=false, stopPos=null;

function wrapPi(a){ while(a> Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; }
const sensOf = cm => 360/((cm/2.54)*DPI)/YAW;
const kOf = cm => (360/((cm/2.54)*DPI))*D2R;

function resize(){
  W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  f=(W/2)/Math.tan(FOVH/2*D2R);
}
addEventListener('resize',resize); resize();

function toCam(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1= x*cy - z*sy, z1= x*sy + z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return {x:x1, y:y*cp - z1*sp, z:y*sp + z1*cp};
}
function projCam(c){ return {sx:W/2+(c.x/c.z)*f, sy:H/2-(c.y/c.z)*f}; }
function project(x,y,z){ const c=toCam(x,y,z); return c.z<=NEAR? null : projCam(c); }
function line3(x1,y1,z1,x2,y2,z2,color){
  let a=toCam(x1,y1,z1), b=toCam(x2,y2,z2);
  if(a.z<NEAR && b.z<NEAR) return;
  if(a.z<NEAR){ const t=(NEAR-a.z)/(b.z-a.z); a={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:NEAR}; }
  else if(b.z<NEAR){ const t=(NEAR-b.z)/(a.z-b.z); b={x:b.x+(a.x-b.x)*t,y:b.y+(a.y-b.y)*t,z:NEAR}; }
  const pa=projCam(a), pb=projCam(b);
  ctx.strokeStyle=color; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
}

function newTarget(){
  // 固定水平甩动幅度 18~22°，纵向小幅随机
  const mag=(18+Math.random()*4)*D2R*(Math.random()<0.5?-1:1);
  const a=mag, b=(Math.random()*2-1)*6*D2R;
  sYaw=yaw; sPitch=pitch;
  tYaw=yaw+a; tPitch=pitch+b;
  if(tPitch> 14*D2R) tPitch= 14*D2R;
  if(tPitch<-14*D2R) tPitch=-14*D2R;
  tSpawn=performance.now();
  stopPos=null; fastSeen=false; lastT=0;
}

function doLock(){
  try{ const r=cv.requestPointerLock({unadjustedMovement:true});
    if(r&&r.catch) r.catch(()=>{ try{cv.requestPointerLock()}catch(e){} }); }
  catch(e){ try{cv.requestPointerLock()}catch(e2){} }
}

function start(){
  ballDeg=parseFloat(document.getElementById('bs').value)||1.5;
  DPI=parseFloat(document.getElementById('dpi').value)||1000;
  YAW=parseFloat(document.getElementById('yaw').value)||0.022;
  cm360=parseFloat(cmInput.value)||27;
  if(!isFinite(cm360) || cm360<12) cm360=12;
  if(cm360>60) cm360=60;
  cmInput.value=cm360.toFixed(1);
  nTrial=parseInt(document.getElementById('n').value)||40;
  if(nTrial<10) nTrial=10; if(nTrial>300) nTrial=300;
  running=true; paused=false; trial=0; result={f:[],t:[],lat:[],dist:[],hit:[],err:[],pts:[]};
  msg.classList.remove('show'); res.classList.remove('show');
  yaw=0; pitch=0; newTarget();
  if(!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
  doLock();
}

function pause(){ if(!running||paused) return; paused=true; pauseAt=performance.now();
  go.textContent='继续'; msg.classList.add('show'); if(document.pointerLockElement) document.exitPointerLock(); }
function resume(){ if(!paused) return; const d=performance.now()-pauseAt; tSpawn+=d;
  paused=false; msg.classList.remove('show'); doLock(); }

function judge(now){
  const ey = yaw;      // 零延迟：用点击那一刻的位置
  const ep = pitch;
  const dxT=wrapPi(tYaw-sYaw), dyT=wrapPi(tPitch-sPitch);
  const dxC=wrapPi(ey-sYaw),   dyC=wrapPi(ep-sPitch);
  const L=Math.hypot(dxT,dyT);
  if(L < MIN_DIST*D2R) { newTarget(); return; }

  const ux=dxT/L, uy=dyT/L;
  const projC=dxC*ux + dyC*uy;
  const lat=Math.abs(dxC*(-uy) + dyC*ux);

  const ratio=projC/L;
  if(ratio > MAX_RATIO || ratio < -MAX_RATIO) { newTarget(); return; }
  if(Math.abs(ratio) < 0.25) { newTarget(); return; }   // 根本没甩，忽略

  fb={ pct:(ratio-1)*100, off:lat/L*100, until:now+700 };
  const errDeg = Math.hypot(wrapPi(tYaw-ey), wrapPi(tPitch-ep))*R2D;
  result.hit.push(errDeg <= ballDeg);
  result.err.push(errDeg);
  result.f.push(ratio-1);
  try{ if(!result.pts) result.pts=[]; result.pts.push({a:(ratio-1)*L*R2D, l:(dxC*(-uy)+dyC*ux)*R2D, hit:(errDeg<=ballDeg)}); }catch(e){}
  result.lat.push(lat/L);
  result.dist.push(L*R2D);
  result.t.push(now-tSpawn);
  trial++;

  if(trial>=nTrial) finish(); else newTarget();
}

function med(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; }

function finish(){
  running=false;
  if(document.pointerLockElement) document.exitPointerLock();
  const exclude=document.getElementById('ex').checked;
  allRuns.push({cm:cm360, f:result.f.slice()});

  // 汇总估计：把每个样本换算成"它建议的 cm/360"，取中位
  const impliedAll=[], impliedMiss=[];
  allRuns.forEach(r=>{
    r.f.forEach(v=>{
      impliedAll.push(r.cm*(1+v));
      if(Math.abs(v)>=0.03) impliedMiss.push(r.cm*(1+v));
    });
  });
  const implied = exclude ? impliedMiss : impliedAll;
  const posF=[], negF=[];
  result.f.forEach((v,i)=>{ if(result.hit[i]) return; (v>0?posF:negF).push(v); });
  const missF = posF.concat(negF);
  const usedF = missF.length>=5 ? missF : result.f;      // 未命中不足 5 个时回退到全部
  const meanOf = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const fm = meanOf(usedF);                              // 带符号均值 = 系统偏差
  const lm=med(result.lat), tm=med(result.t), dm=med(result.dist);
  let cmNew=cm360*(1+fm);
  if(cmNew<8) cmNew=8; if(cmNew>80) cmNew=80;
  const conv = lastSug>0 && Math.abs(cmNew-lastSug)/lastSug < 0.01;
  lastSug = cmNew;
  result.summary={conv:conv, fm:fm, cmNew:cmNew, sensNew:sensOf(cmNew), sensNow:sensOf(cm360), tm:tm, lm:lm, dm:dm};

  const hitN=result.hit.filter(Boolean).length, totalN=result.f.length;
  const row=(k,v,cls)=>'<tr><th>'+k+'</th><td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td></tr>';
  let verdict;
  {
    const p2=posF.length, n2=negF.length, tot=p2+n2;
    if(tot<5) verdict='未命中球太少，数据不足';
    else if(p2 >= n2*1.3) verdict='<b>过头 '+p2+' &gt; 不足 '+n2+'</b> → 灵敏度偏高，调低';
    else if(n2 >= p2*1.3) verdict='<b>不足 '+n2+' &gt; 过头 '+p2+'</b> → 灵敏度偏低，调高';
    else verdict='<b>过头 '+p2+' ≈ 不足 '+n2+'</b> → 灵敏度合适，偏的是动作稳定性';
  }
  const pp=Math.round(posF.length/Math.max(1,posF.length+negF.length)*100);
  const np=Math.round(negF.length/Math.max(1,posF.length+negF.length)*100);

  resBody.innerHTML=
    '<div style="font-size:17px;color:var(--acc);margin-bottom:4px">结果</div>'+
    '<table class="rt">'+
    row('甩动 / 用时', dm.toFixed(1)+'° / '+tm.toFixed(0)+' ms')+
    row('横向偏差', lm.toFixed(1)+'%')+
    row('命中', hitN+' / '+totalN+'（'+Math.round(hitN/Math.max(1,totalN)*100)+'%）', 'big')+
    row('过头', posF.length+' 球 ('+pp+'%)，中位 +'+(med(posF)*100).toFixed(1)+'%')+
    row('不足', negF.length+' 球 ('+np+'%)，中位 '+(med(negF)*100).toFixed(1)+'%')+
    row('合计偏差', (fm>=0?'+':'')+(fm*100).toFixed(1)+'%', 'big')+
    row('本次', cm360.toFixed(1)+' → '+cmNew.toFixed(1)+' cm　'+sensOf(cm360).toFixed(2)+' → <b>'+sensOf(cmNew).toFixed(2)+'</b>')+
    row('累计 '+impliedAll.length+' 球 · 全部', med(impliedAll).toFixed(1)+' cm → sens <b>'+sensOf(med(impliedAll)).toFixed(2)+'</b>')+
    row('累计 · 仅未命中', (impliedMiss.length? med(impliedMiss).toFixed(1)+' cm → sens <b>'+sensOf(med(impliedMiss)).toFixed(2)+'</b>' : '-'))+
    '</table>'+
    '<div style="margin-top:12px;font-size:14px">'+verdict+'</div>'+
    (conv? '<div style="margin-top:8px;color:var(--acc);font-weight:700">✓ 连续两轮变化 &lt;1%，已收敛 —— 可以定稿</div>' : '');
  res.classList.add('show');
  try{ addScatter(); }catch(e){}
}

function addScatter(){
  var old=document.getElementById('scatter'); if(old) old.remove();
  var pts=(result.pts||[]).slice();
  if(!pts.length) return;
  var cv=document.createElement('canvas');
  cv.id='scatter';
  var dpr=devicePixelRatio||1, S=260;
  cv.width=S*dpr; cv.height=S*dpr;
  cv.style.cssText='display:block;margin:14px auto 0;width:'+S+'px;height:'+S+'px;border-radius:12px;background:var(--panel)';
  var g=cv.getContext('2d'); g.scale(dpr,dpr);
  var c=S/2;
  var maxR=Math.max(1, ...pts.map(function(p){ return Math.hypot(p.a,p.l); }));
  var k=(S*0.42)/maxR;

  // 网格
  g.strokeStyle='rgba(139,148,158,.28)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(c,8); g.lineTo(c,S-8); g.moveTo(8,c); g.lineTo(S-8,c); g.stroke();
  g.beginPath(); g.arc(c,c,Math.max(2,ballDeg*k),0,Math.PI*2); g.strokeStyle='rgba(139,148,158,.45)'; g.stroke();

  // 落点：a 向上偏（过头在上），l 向右
  pts.forEach(function(p){
    var x=c+p.l*k, y=c-p.a*k;
    g.beginPath(); g.arc(x,y,3.2,0,Math.PI*2);
    g.fillStyle=p.hit?'rgba(63,185,80,.85)':'rgba(248,81,73,.85)'; g.fill();
  });

  // 中心
  g.beginPath(); g.arc(c,c,2,0,Math.PI*2); g.fillStyle='rgba(88,166,255,.9)'; g.fill();

  var cap=document.createElement('div');
  cap.style.cssText='text-align:center;font-size:12px;color:var(--dim);margin-top:6px';
  cap.textContent='落点：上=过头 下=不足 · 圈内=命中';

  var body=document.getElementById('resBody');
  if(body){ body.appendChild(cv); body.appendChild(cap); }
}

go.addEventListener('click',e=>{ e.stopPropagation(); if(paused) resume(); else start(); });
document.getElementById('clr').addEventListener('click',e=>{
  e.stopPropagation();
  allRuns.length=0;
  resBody.innerHTML+='<div style="margin-top:10px;color:var(--acc);font-size:13px">累计已清空</div>';
});

again.addEventListener('click',e=>{
  e.stopPropagation();
  if(result && result.summary){
    const cur=parseFloat(cmInput.value)||27, sug=result.summary.cmNew;
    if(Math.abs(sug/cur-1) <= 0.35) cmInput.value=sug.toFixed(1);
  }
  start();
});

document.addEventListener('mousedown',e=>{
  if(!running) return;
  if(paused){ resume(); return; }
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
  judge(performance.now());
});
document.addEventListener('pointerlockchange',()=>{ if(!document.pointerLockElement && running && !paused) pause(); });
document.addEventListener('pointerlockerror',()=>{ if(running) pause(); });

addEventListener('pointerrawupdate',e=>{
  if(!running||paused) return;
  const k=kOf(cm360);
  yaw += (e.movementX||0)*k;
  pitch -= (e.movementY||0)*k;
  if(pitch> PITCH_LIM) pitch= PITCH_LIM;
  if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
},true);

function grid(){
  const R=44, step=3;
  for(let v=-R; v<=R; v+=step){
    line3(v,-EYE,-R, v,-EYE,R, (v===0)?SC.major:SC.minor);
    line3(-R,-EYE,v, R,-EYE,v, (v===0)?'rgba(88,166,255,.60)':SC.minor);
    line3(v, 4.2,-R, v, 4.2,R, SC.ceil);
    line3(-R, 4.2,v, R, 4.2,v, SC.ceil);
  }
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, px=Math.sin(a)*18, pz=Math.cos(a)*18;
    line3(px,-EYE,pz, px,4.2,pz, 'rgba(110,122,138,1)');
  }
}

function loop(){
  requestAnimationFrame(loop);
  if(!running||paused) return;

  const nowT=performance.now();
  const dtS=Math.max(1, nowT-lastT);
  const spd=Math.hypot(wrapPi(yaw-lastY), wrapPi(pitch-lastP))*R2D/(dtS/1000);
  lastY=yaw; lastP=pitch; lastT=nowT;
  if(spd>200) fastSeen=true;
  if(fastSeen && !stopPos && spd<40) stopPos={yaw:yaw, pitch:pitch};

  ctx.fillStyle=SC.bg; ctx.fillRect(0,0,W,H);
  grid();

  const cp2=Math.cos(tPitch);
  const tx=DIST*cp2*Math.sin(tYaw), ty=DIST*Math.sin(tPitch), tz=DIST*cp2*Math.cos(tYaw);
  const p=project(tx,ty,tz);
  if(p){
    const rad=Math.max(5, f*Math.tan(ballDeg*D2R));
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);
    ctx.fillStyle=SC.tgtFill; ctx.fill();
    ctx.strokeStyle=SC.tgt; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*0.25,0,Math.PI*2);
    ctx.fillStyle=SC.tgt; ctx.fill();
  }

  ctx.strokeStyle=SC.cross; ctx.lineWidth=3;
  const g2=15*devicePixelRatio, cx=W/2, cy=H/2;
  ctx.beginPath();
  ctx.moveTo(cx-g2,cy); ctx.lineTo(cx-5,cy);
  ctx.moveTo(cx+5,cy); ctx.lineTo(cx+g2,cy);
  ctx.moveTo(cx,cy-g2); ctx.lineTo(cx,cy-5);
  ctx.moveTo(cx,cy+5); ctx.lineTo(cx,cy+g2);
  ctx.stroke();

  if(fb && performance.now()<fb.until){
    const over=fb.pct>0;
    ctx.fillStyle= over? 'rgba(248,81,73,.95)' : 'rgba(210,153,34,.95)';
    ctx.font='bold '+(30*devicePixelRatio)+'px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText((over?'过头 +':'不足 ')+fb.pct.toFixed(1)+'%', W/2, H*0.30);
    ctx.font=(17*devicePixelRatio)+'px "Microsoft YaHei"';
    ctx.fillStyle='rgba(139,148,158,.95)';
    ctx.fillText('横向偏 '+fb.off.toFixed(1)+'%', W/2, H*0.30+34*devicePixelRatio);
    ctx.textAlign='left';
  }

  const d=Math.hypot(wrapPi(tYaw-yaw), wrapPi(tPitch-pitch))*R2D;
  const liveHit=result? result.hit.filter(Boolean).length : 0;
  ui.innerHTML='第 '+(trial+1)+'/'+nTrial+' &nbsp; 命中 <b>'+liveHit+'</b>'+
    ' &nbsp; cm/360 = '+cm360.toFixed(1)+
    ' &nbsp; 距目标 <b>'+d.toFixed(1)+'°</b><br>'+
    '<span style="color:#6e7681;font-size:13px">甩过去 → 点击左键</span>';
}
requestAnimationFrame(loop);

(function(){
  var el = document.getElementById('bw');
  if(!el) return;
  var ok = (typeof window !== 'undefined') && ('onpointerrawupdate' in window);
  if(!ok){
    el.innerHTML = '⚠️ 当前浏览器不支持 pointerrawupdate，采样精度会降低<br>' +
      '建议使用 <b style="color:var(--acc)">Chrome</b> 或 <b style="color:var(--acc)">Edge</b>';
  }
})();

(function(){
  var hint = document.getElementById('sensHint');
  if(!hint) return;
  function num(id, def){ var el=document.getElementById(id); if(!el) return def; var v=parseFloat(el.value); return isFinite(v)? v : def; }
  function upd(){
    var d = num('dpi',1000), y = num('yaw', document.getElementById('yaw')?0.022:0), c = num('cm',27);
    if(!(d>0 && c>0)) { hint.textContent=''; return; }
    var s = y>0 ? 360/((c/2.54)*d)/y : 0;
    var txt = '→ 对应 <b style="color:var(--acc)">' + (y>0? '游戏灵敏度 '+s.toFixed(2) : 'cm/360 '+c.toFixed(1)) + '</b>';
    txt += ' &nbsp;<span style="color:#6e7681">(' + c.toFixed(1) + ' cm/360 · DPI ' + d + (y>0? ' · m_yaw '+y : '') + ')</span>';
    if(y>0) txt += '<br><span style="color:#6e7681;font-size:13px">360° 转身需要 ' + c.toFixed(1) + ' cm，180° 需要 ' + (c/2).toFixed(1) + ' cm</span>';
    hint.innerHTML = txt;
  }
  ['dpi','yaw','cm'].forEach(function(id){
    var el=document.getElementById(id);
    if(el){ el.addEventListener('input',upd); el.addEventListener('change',upd); }
  });
  upd();
  window.__updSensHint = upd;
})();

(function(){
  var dpi=document.getElementById('dpi'), yaw=document.getElementById('yaw'),
      cm=document.getElementById('cm'), sn=document.getElementById('sens');
  if(!dpi||!cm||!sn) return;
  var busy=false;
  function n(el,def){ var v=parseFloat(el&&el.value); return isFinite(v)? v : def; }
  function toCm(){
    var d=n(dpi,1000), y= yaw? n(yaw,0.022) : 0.022, s=n(sn,0);
    if(d>0 && y>0 && s>0) cm.value=(360/(s*y)/d*2.54).toFixed(1);
  }
  function toSens(){
    var d=n(dpi,1000), y= yaw? n(yaw,0.022) : 0.022, c=n(cm,0);
    if(d>0 && y>0 && c>0) sn.value=(360/((c/2.54)*d)/y).toFixed(2);
  }
  sn.addEventListener('input', function(){ if(busy)return; busy=true; toCm(); busy=false; if(window.__updSensHint) window.__updSensHint(); });
  [dpi,yaw,cm].forEach(function(el){ if(!el) return; el.addEventListener('input', function(){ if(busy)return; busy=true; toSens(); busy=false; }); });
  toSens();
})();

/* ===== 英文界面 ===== */
(function(){
  var EN=(function(){ try{ var q=new URLSearchParams(location.search); if(q.get('lang')) return q.get('lang')==='en'; return localStorage.getItem('cs2at.lang')==='en'; }catch(e){ return false; } })();
  if(!EN) return;
  var D={
    '灵敏度标定 · 过冲法':'Sensitivity calibration · overshoot',
    '灵敏度标定 · 过冲法（全样本）':'Sensitivity calibration · overshoot (all samples)',
    '每次只出现一个球。看到球后最快速甩过去并点击。':'One dot at a time. Flick to it as fast as you can and click.',
    '程序记录你甩完的落点，算出你冲过头还是没到。':'It records where you land and whether you overshot or undershot.',
    '本版本：全部球都计入统计':'This build: every dot counts',
    '每次只出现一个球。看到球后':'One dot at a time. Spot it, ',
    '最快速度甩过去并点击':'flick as fast as you can and click',
    '程序记录你甩完的落点，算出你':'It records where you land — ',
    '冲过头还是没到':'overshot or undershot',
    '程序记录你点击时准星的位置，算出你':'It records your crosshair position and tells whether you ',
    '排除已命中（|过冲| < 3%）的球':'Exclude dots already hit (|overshoot| < 3%)',
    '。':'.',
    '开始':'START','重新开始':'Restart','结束':'End','结果':'Result',
    '鼠标 DPI':'Mouse DPI','当前 cm/360':'Current cm/360','游戏灵敏度':'Game sensitivity',
    '球数':'Shots','球大小':'Dot size','标准（1.5°）':'Standard (1.5°)','大（2.2°）':'Large (2.2°)','小（1.0°）':'Small (1.0°)',
    '大（2.0°）':'Large (2.0°)','很小（0.7°）':'Very small (0.7°)','极小（0.45°）':'Tiny (0.45°)',
    '← 返回':'← Back','自动':'auto',
    '中位偏移':'Median offset','偏慢':'too slow','偏快':'too fast',
    '建议灵敏度':'Suggested sensitivity','当前灵敏度':'Current sensitivity','误差':'error',
    '复制结果':'Copy result','关闭':'Close','继续':'Continue',
    '过冲':'Overshoot','欠冲':'Undershoot','命中':'Hit','超时':'Timeout'
  };
  var RULES=[
    [/^→ 对应\s*$/,'→ '],
    [/^游戏灵敏度 ([\d.]+)$/,'Game sensitivity $1'],
    [/^→ 对应 游戏灵敏度 ([\d.]+)/,'→ Game sensitivity $1'],
    [/^→ 对应 cm\/360 ([\d.]+)/,'→ cm/360 $1'],
    [/^360° 转身需要 ([\d.]+) cm，180° 需要 ([\d.]+) cm$/,'360° needs $1 cm · 180° needs $2 cm'],
    [/^第 (\d+) 球$/,'Shot $1'],
    [/^([\d.]+) cm\/360 · DPI (\d+) · m_yaw ([\d.]+)$/,'$1 cm/360 · DPI $2 · m_yaw $3']
  ];
  var D2={}; for(var k in D){ D2[k.replace(/\s+/g,'')]=D[k]; }
  function tr(t){
    var s=t.trim(); if(!s) return t;
    var m=s.match(/^(.+?)[:：]$/);
    if(m && D[m[1]]!==undefined) return t.replace(s, D[m[1]]+':');
    if(D[s]!==undefined) return t.replace(s,D[s]);
    var flat=s.replace(/\s+/g,'');
    if(D2[flat]!==undefined) return t.replace(s, D2[flat]);
    for(var i=0;i<RULES.length;i++) if(RULES[i][0].test(s)) return t.replace(s, s.replace(RULES[i][0], RULES[i][1]));
    return t;
  }
  function walk(){
    var w=document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null), n;
    while((n=w.nextNode())){ var v=n.nodeValue; if(!v||!/[\u4e00-\u9fa5]/.test(v)) continue; var nv=tr(v); if(nv!==v) n.nodeValue=nv; }
    document.querySelectorAll('option').forEach(function(o){ var t=o.textContent.trim(); if(D[t]) o.textContent=D[t]; });
    document.querySelectorAll('input[placeholder]').forEach(function(el){
      var ph=el.getAttribute('placeholder'); if(ph && D[ph.trim()]) el.setAttribute('placeholder', D[ph.trim()]);
    });
  }
  walk();
  new MutationObserver(walk).observe(document.body,{childList:true,subtree:true,characterData:true});
})();

</script>

<script>
(function(){
  var back=document.getElementById('back');
  ['mousedown','pointerdown','mouseup','pointerup','click'].forEach(function(t){
    back.addEventListener(t, function(e){ e.stopPropagation(); }, true);
  });
  function sync(){
    var shown=document.querySelectorAll('.overlay.show').length>0;
    if(back) back.classList.toggle('on', shown);
  }
  ['msg','res'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:['class']});
  });
  sync();
  addEventListener('keydown', function(e){ if(e.key==='Escape') location.href='../app.html#play'; });
})();
</script>

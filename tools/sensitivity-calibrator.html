<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵敏度标定 · 过冲法（全样本）</title>
<style>
  html,body{margin:0;height:100%;background:#0b0f14;overflow:hidden;color:#e6edf3;font-family:"Microsoft YaHei",sans-serif}
  canvas{display:block;cursor:none}
  #ui{position:fixed;left:24px;top:20px;font-size:14px;line-height:1.9;pointer-events:none;text-shadow:0 0 6px #000}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    text-align:center;font-size:16px;line-height:2;color:#c9d1d9;background:rgba(11,15,20,.96)}
  .overlay.show{display:flex}
  .btn{margin-top:24px;padding:13px 40px;font-size:16px;font-family:inherit;cursor:pointer;
    background:#238636;border:1px solid #2ea043;color:#fff;border-radius:8px;pointer-events:auto}
  .btn:hover{background:#2ea043}
  input{width:110px;padding:8px;background:#161b22;border:1px solid #30363d;color:#e6edf3;
    border-radius:6px;font-size:15px;text-align:center;pointer-events:auto}
  table{border-collapse:collapse;margin-top:8px}
  .rt td,.rt th{padding:5px 14px;font-size:14px}
  #res{overflow:auto;padding:20px}
  #resBody{max-height:78vh;overflow:auto}
  td,th{padding:9px 20px;text-align:right;border-bottom:1px solid #21262d}
  th{color:#8b949e;font-weight:500}
  .big{font-size:30px;font-weight:700;color:#3fb950}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>

<div id="msg" class="overlay show">
  <div style="font-size:19px;color:#58a6ff;margin-bottom:10px">灵敏度标定 · 过冲法（全样本）</div>
  <div>每次只出现一个球。看到球后<b>最快速度甩过去并点击</b>。<br>
  程序记录你甩完的落点，算出你<b>冲过头还是没到</b>。<br><span style="color:#3fb950">本版本：全部球都计入统计</span></div>
  <div style="margin-top:22px;color:#8b949e;font-size:14px">
    鼠标 DPI：<input id="dpi" type="number" step="100" value="1000" style="width:90px">
    &nbsp;m_yaw：<input id="yaw" type="number" step="0.0001" value="0.022" style="width:100px"><br>
    <span style="margin-top:10px;display:inline-block">当前 cm/360：<input id="cm" type="number" step="0.1" value="27">
    &nbsp;&nbsp;球数：<input id="n" type="number" step="10" value="40" style="width:80px">
    &nbsp;球大小：<select id="bs" style="padding:7px;background:#161b22;border:1px solid #30363d;color:#e6edf3;border-radius:6px;font-size:14px;pointer-events:auto">
      <option value="2.0">大（2.0°）</option>
      <option value="1.5" selected>标准（1.5°）</option>
      <option value="1.0">小（1.0°）</option>
      <option value="0.7">很小（0.7°）</option>
      <option value="0.45">极小（0.45°）</option>
    </select></div>
  <div id="bw" style="margin-top:12px;font-size:13px;line-height:1.8;color:#d29922"></div>
  <button id="go" class="btn">开始</button>
</div>

<div id="res" class="overlay"><div id="resBody"></div>
  <button id="again" class="btn">再测一轮</button>
  <button id="clr" class="btn" style="margin-top:10px;background:#21262d;border-color:#30363d;font-size:14px;padding:9px 26px">清空累计（输入值保留）</button></div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ui=document.getElementById('ui');
const msg=document.getElementById('msg'), go=document.getElementById('go');
const res=document.getElementById('res'), resBody=document.getElementById('resBody'), again=document.getElementById('again');
const cmInput=document.getElementById('cm');

let DPI=1000, YAW=0.022;
const FOVH=90, DIST=10, EYE=1.6, NEAR=0.25;
const MIN_DIST=6, MAX_RATIO=3.2;
let nTrial=40;
const PITCH_LIM=75*Math.PI/180;
const D2R=Math.PI/180, R2D=180/Math.PI;

let W=0,H=0,f=1;
let yaw=0, pitch=0, tYaw=0, tPitch=0, sYaw=0, sPitch=0;
let running=false, paused=false, pauseAt=0, trial=0, tSpawn=0;
let ballDeg=1.5, lastSug=0, allRuns=[], cm360=23.2, result=null, fb=null, lastY=yaw, lastP=pitch, lastT=0, fastSeen=false, stopPos=null;

function wrapPi(a){ while(a> Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; }
const sensOf = cm => 360/((cm/2.54)*DPI)/YAW;
const kOf = cm => (360/((cm/2.54)*DPI))*D2R;

function resize(){
  W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  f=(W/2)/Math.tan(FOVH/2*D2R);
}
addEventListener('resize',resize); resize();

function toCam(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1= x*cy - z*sy, z1= x*sy + z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return {x:x1, y:y*cp - z1*sp, z:y*sp + z1*cp};
}
function projCam(c){ return {sx:W/2+(c.x/c.z)*f, sy:H/2-(c.y/c.z)*f}; }
function project(x,y,z){ const c=toCam(x,y,z); return c.z<=NEAR? null : projCam(c); }
function line3(x1,y1,z1,x2,y2,z2,color){
  let a=toCam(x1,y1,z1), b=toCam(x2,y2,z2);
  if(a.z<NEAR && b.z<NEAR) return;
  if(a.z<NEAR){ const t=(NEAR-a.z)/(b.z-a.z); a={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:NEAR}; }
  else if(b.z<NEAR){ const t=(NEAR-b.z)/(a.z-b.z); b={x:b.x+(a.x-b.x)*t,y:b.y+(a.y-b.y)*t,z:NEAR}; }
  const pa=projCam(a), pb=projCam(b);
  ctx.strokeStyle=color; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
}

function newTarget(){
  // 固定水平甩动幅度 18~22°，纵向小幅随机
  const mag=(18+Math.random()*4)*D2R*(Math.random()<0.5?-1:1);
  const a=mag, b=(Math.random()*2-1)*6*D2R;
  sYaw=yaw; sPitch=pitch;
  tYaw=yaw+a; tPitch=pitch+b;
  if(tPitch> 14*D2R) tPitch= 14*D2R;
  if(tPitch<-14*D2R) tPitch=-14*D2R;
  tSpawn=performance.now();
  stopPos=null; fastSeen=false; lastT=0;
}

function doLock(){
  try{ const r=cv.requestPointerLock({unadjustedMovement:true});
    if(r&&r.catch) r.catch(()=>{ try{cv.requestPointerLock()}catch(e){} }); }
  catch(e){ try{cv.requestPointerLock()}catch(e2){} }
}

function start(){
  ballDeg=parseFloat(document.getElementById('bs').value)||1.5;
  DPI=parseFloat(document.getElementById('dpi').value)||1000;
  YAW=parseFloat(document.getElementById('yaw').value)||0.022;
  cm360=parseFloat(cmInput.value)||27;
  if(!isFinite(cm360) || cm360<12) cm360=12;
  if(cm360>60) cm360=60;
  cmInput.value=cm360.toFixed(1);
  nTrial=parseInt(document.getElementById('n').value)||40;
  if(nTrial<10) nTrial=10; if(nTrial>300) nTrial=300;
  running=true; paused=false; trial=0; result={f:[],t:[],lat:[],dist:[],hit:[],err:[]};
  msg.classList.remove('show'); res.classList.remove('show');
  yaw=0; pitch=0; newTarget();
  if(!document.fullscreenElement && document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().catch(()=>{});
  doLock();
}

function pause(){ if(!running||paused) return; paused=true; pauseAt=performance.now();
  go.textContent='继续'; msg.classList.add('show'); if(document.pointerLockElement) document.exitPointerLock(); }
function resume(){ if(!paused) return; const d=performance.now()-pauseAt; tSpawn+=d;
  paused=false; msg.classList.remove('show'); doLock(); }

function judge(now){
  const ey = yaw;      // 零延迟：用点击那一刻的位置
  const ep = pitch;
  const dxT=wrapPi(tYaw-sYaw), dyT=wrapPi(tPitch-sPitch);
  const dxC=wrapPi(ey-sYaw),   dyC=wrapPi(ep-sPitch);
  const L=Math.hypot(dxT,dyT);
  if(L < MIN_DIST*D2R) { newTarget(); return; }

  const ux=dxT/L, uy=dyT/L;
  const projC=dxC*ux + dyC*uy;
  const lat=Math.abs(dxC*(-uy) + dyC*ux);

  const ratio=projC/L;
  if(ratio > MAX_RATIO || ratio < -MAX_RATIO) { newTarget(); return; }
  if(Math.abs(ratio) < 0.25) { newTarget(); return; }   // 根本没甩，忽略

  fb={ pct:(ratio-1)*100, off:lat/L*100, until:now+700 };
  const errDeg = Math.hypot(wrapPi(tYaw-ey), wrapPi(tPitch-ep))*R2D;
  result.hit.push(errDeg <= ballDeg);
  result.err.push(errDeg);
  result.f.push(ratio-1);
  result.lat.push(lat/L);
  result.dist.push(L*R2D);
  result.t.push(now-tSpawn);
  trial++;

  if(trial>=nTrial) finish(); else newTarget();
}

function med(a){ if(!a.length) return 0; const s=[...a].sort((x,y)=>x-y); return s[s.length>>1]; }

function finish(){
  running=false;
  if(document.pointerLockElement) document.exitPointerLock();
  allRuns.push({cm:cm360, f:result.f.slice()});

  // 汇总估计：把每个样本换算成"它建议的 cm/360"，取中位
  const impliedAll=[], impliedMiss=[];
  allRuns.forEach(r=>{
    r.f.forEach(v=>{
      impliedAll.push(r.cm*(1+v));
      if(Math.abs(v)>=0.03) impliedMiss.push(r.cm*(1+v));
    });
  });
  const implied = impliedAll;
  const posF=[], negF=[];
  result.f.forEach((v,i)=>{ if(result.hit[i]) return; (v>0?posF:negF).push(v); });
  const missF = posF.concat(negF);
  const usedF = result.f;                                 // 全样本版本：全部计入
  const meanOf = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
  const fm = meanOf(usedF);                              // 带符号均值 = 系统偏差
  const lm=med(result.lat), tm=med(result.t), dm=med(result.dist);
  let cmNew=cm360*(1+fm);
  if(cmNew<8) cmNew=8; if(cmNew>80) cmNew=80;
  const conv = lastSug>0 && Math.abs(cmNew-lastSug)/lastSug < 0.01;
  lastSug = cmNew;
  result.summary={conv:conv, fm:fm, cmNew:cmNew, sensNew:sensOf(cmNew), sensNow:sensOf(cm360), tm:tm, lm:lm, dm:dm};

  const hitN=result.hit.filter(Boolean).length, totalN=result.f.length;
  const row=(k,v,cls)=>'<tr><th>'+k+'</th><td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td></tr>';
  let verdict;
  {
    const p2=posF.length, n2=negF.length, tot=p2+n2;
    if(tot<5) verdict='未命中球太少，数据不足';
    else if(p2 >= n2*1.3) verdict='<b>过头 '+p2+' &gt; 不足 '+n2+'</b> → 灵敏度偏高，调低';
    else if(n2 >= p2*1.3) verdict='<b>不足 '+n2+' &gt; 过头 '+p2+'</b> → 灵敏度偏低，调高';
    else verdict='<b>过头 '+p2+' ≈ 不足 '+n2+'</b> → 灵敏度合适，偏的是动作稳定性';
  }
  const pp=Math.round(posF.length/Math.max(1,posF.length+negF.length)*100);
  const np=Math.round(negF.length/Math.max(1,posF.length+negF.length)*100);

  resBody.innerHTML=
    '<div style="font-size:17px;color:#58a6ff;margin-bottom:4px">结果</div>'+
    '<table class="rt">'+
    row('甩动 / 用时', dm.toFixed(1)+'° / '+tm.toFixed(0)+' ms')+
    row('横向偏差', lm.toFixed(1)+'%')+
    row('命中', hitN+' / '+totalN+'（'+Math.round(hitN/Math.max(1,totalN)*100)+'%）', 'big')+
    row('过头', posF.length+' 球 ('+pp+'%)，中位 +'+(med(posF)*100).toFixed(1)+'%')+
    row('不足', negF.length+' 球 ('+np+'%)，中位 '+(med(negF)*100).toFixed(1)+'%')+
    row('合计偏差', (fm>=0?'+':'')+(fm*100).toFixed(1)+'%', 'big')+
    row('本次', cm360.toFixed(1)+' → '+cmNew.toFixed(1)+' cm　'+sensOf(cm360).toFixed(2)+' → <b>'+sensOf(cmNew).toFixed(2)+'</b>')+
    row('累计 '+impliedAll.length+' 球 · 全部', med(impliedAll).toFixed(1)+' cm → sens <b>'+sensOf(med(impliedAll)).toFixed(2)+'</b>')+
    row('累计 · 仅未命中', (impliedMiss.length? med(impliedMiss).toFixed(1)+' cm → sens <b>'+sensOf(med(impliedMiss)).toFixed(2)+'</b>' : '-'))+
    '</table>'+
    '<div style="margin-top:12px;font-size:14px">'+verdict+'</div>'+
    (conv? '<div style="margin-top:8px;color:#3fb950;font-weight:700">✓ 连续两轮变化 &lt;1%，已收敛 —— 可以定稿</div>' : '');
  res.classList.add('show');
}

go.addEventListener('click',e=>{ e.stopPropagation(); if(paused) resume(); else start(); });
document.getElementById('clr').addEventListener('click',e=>{
  e.stopPropagation();
  allRuns.length=0;
  resBody.innerHTML+='<div style="margin-top:10px;color:#3fb950;font-size:13px">累计已清空</div>';
});

again.addEventListener('click',e=>{
  e.stopPropagation();
  if(result && result.summary){
    const cur=parseFloat(cmInput.value)||27, sug=result.summary.cmNew;
    if(Math.abs(sug/cur-1) <= 0.35) cmInput.value=sug.toFixed(1);
  }
  start();
});

document.addEventListener('mousedown',e=>{
  if(!running) return;
  if(paused){ resume(); return; }
  if(e.target.tagName==='BUTTON'||e.target.tagName==='INPUT') return;
  judge(performance.now());
});
document.addEventListener('pointerlockchange',()=>{ if(!document.pointerLockElement && running && !paused) pause(); });
document.addEventListener('pointerlockerror',()=>{ if(running) pause(); });

addEventListener('pointerrawupdate',e=>{
  if(!running||paused) return;
  const k=kOf(cm360);
  yaw += (e.movementX||0)*k;
  pitch -= (e.movementY||0)*k;
  if(pitch> PITCH_LIM) pitch= PITCH_LIM;
  if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
},true);

function grid(){
  const R=44, step=3;
  for(let v=-R; v<=R; v+=step){
    line3(v,-EYE,-R, v,-EYE,R, (v===0)?'rgba(88,166,255,.60)':'rgba(72,84,98,1)');
    line3(-R,-EYE,v, R,-EYE,v, (v===0)?'rgba(88,166,255,.60)':'rgba(72,84,98,1)');
    line3(v, 4.2,-R, v, 4.2,R, 'rgba(56,66,78,1)');
    line3(-R, 4.2,v, R, 4.2,v, 'rgba(56,66,78,1)');
  }
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, px=Math.sin(a)*18, pz=Math.cos(a)*18;
    line3(px,-EYE,pz, px,4.2,pz, 'rgba(110,122,138,1)');
  }
}

function loop(){
  requestAnimationFrame(loop);
  if(!running||paused) return;

  const nowT=performance.now();
  const dtS=Math.max(1, nowT-lastT);
  const spd=Math.hypot(wrapPi(yaw-lastY), wrapPi(pitch-lastP))*R2D/(dtS/1000);
  lastY=yaw; lastP=pitch; lastT=nowT;
  if(spd>200) fastSeen=true;
  if(fastSeen && !stopPos && spd<40) stopPos={yaw:yaw, pitch:pitch};

  ctx.fillStyle='#0b0f14'; ctx.fillRect(0,0,W,H);
  grid();

  const cp2=Math.cos(tPitch);
  const tx=DIST*cp2*Math.sin(tYaw), ty=DIST*Math.sin(tPitch), tz=DIST*cp2*Math.cos(tYaw);
  const p=project(tx,ty,tz);
  if(p){
    const rad=Math.max(5, f*Math.tan(ballDeg*D2R));
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);
    ctx.fillStyle='rgba(248,81,73,.30)'; ctx.fill();
    ctx.strokeStyle='#f85149'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*0.25,0,Math.PI*2);
    ctx.fillStyle='#f85149'; ctx.fill();
  }

  ctx.strokeStyle='#3fb950'; ctx.lineWidth=3;
  const g2=15*devicePixelRatio, cx=W/2, cy=H/2;
  ctx.beginPath();
  ctx.moveTo(cx-g2,cy); ctx.lineTo(cx-5,cy);
  ctx.moveTo(cx+5,cy); ctx.lineTo(cx+g2,cy);
  ctx.moveTo(cx,cy-g2); ctx.lineTo(cx,cy-5);
  ctx.moveTo(cx,cy+5); ctx.lineTo(cx,cy+g2);
  ctx.stroke();

  if(fb && performance.now()<fb.until){
    const over=fb.pct>0;
    ctx.fillStyle= over? 'rgba(248,81,73,.95)' : 'rgba(210,153,34,.95)';
    ctx.font='bold '+(30*devicePixelRatio)+'px "Microsoft YaHei"';
    ctx.textAlign='center';
    ctx.fillText((over?'过头 +':'不足 ')+fb.pct.toFixed(1)+'%', W/2, H*0.30);
    ctx.font=(17*devicePixelRatio)+'px "Microsoft YaHei"';
    ctx.fillStyle='rgba(139,148,158,.95)';
    ctx.fillText('横向偏 '+fb.off.toFixed(1)+'%', W/2, H*0.30+34*devicePixelRatio);
    ctx.textAlign='left';
  }

  const d=Math.hypot(wrapPi(tYaw-yaw), wrapPi(tPitch-pitch))*R2D;
  const liveHit=result? result.hit.filter(Boolean).length : 0;
  ui.innerHTML='第 '+(trial+1)+'/'+nTrial+' &nbsp; 命中 <b>'+liveHit+'</b>'+
    ' &nbsp; cm/360 = '+cm360.toFixed(1)+
    ' &nbsp; 距目标 <b>'+d.toFixed(1)+'°</b><br>'+
    '<span style="color:#6e7681;font-size:13px">甩过去 → 点击左键</span>';
}
requestAnimationFrame(loop);

(function(){
  var el = document.getElementById('bw');
  if(!el) return;
  var ok = (typeof window !== 'undefined') && ('onpointerrawupdate' in window);
  if(!ok){
    el.innerHTML = '⚠️ 当前浏览器不支持 pointerrawupdate，采样精度会降低<br>' +
      '建议使用 <b style="color:#3fb950">Chrome</b> 或 <b style="color:#3fb950">Edge</b>';
  }
})();
</script>
</body>
</html>

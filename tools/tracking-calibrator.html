<script>/* 剪贴板兜底：writeText 在失焦/无权限时抛 NotAllowedError（未捕获会进 console），统一降级到 execCommand */
(function(){
  try{
    var c = navigator.clipboard;
    if(!c || !c.writeText) return;
    var orig = c.writeText.bind(c);
    c.writeText = function(t){
      return orig(t).catch(function(){
        var ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly','');
        ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, ta.value.length);
        var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
        ta.remove();
        if(!ok){ try{ window.prompt('复制失败，请手动复制：', t); }catch(e){} }   // 兜底：绝不抛未捕获异常
      });
    };
  }catch(e){}
})();</script>

<script>
'use strict';
/* ————— 场景与主题（同标定器：页面皮肤跟随站点） ————— */
const SCENES=window.GAME_SCENES;
const THEME2SCENE=window.THEME2SCENE;
function pickScene(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get('scene') && SCENES[q.get('scene')]) return q.get('scene');
    const th=q.get('theme')||localStorage.getItem('cs2at.theme')||(function(){var d=new Date(),tm=d.getHours()*60+d.getMinutes();return (tm>=1410||tm<460)?'forest':'sand';})();
    if(th && THEME2SCENE[th]) return THEME2SCENE[th];
    const sc=localStorage.getItem('cs2at.scene');
    if(sc && SCENES[sc]) return sc;
  }catch(e){}
  return 'classic';
}
const SC=SCENES[pickScene()]||SCENES.classic;
const SITE_THEMES={
  ink:{bg:'#f7f5f0',panel:'#fffefb',line:'#e2dccf',txt:'#202b2c',dim:'#6d7a7b',acc:'#0f766e'},
  jade:{bg:'#101917',panel:'#16211f',line:'#2a3a36',txt:'#efeade',dim:'#93a8a1',acc:'#7fbfa6'},
  lake:{bg:'#eef4f6',panel:'#ffffff',line:'#d2e2e7',txt:'#14313a',dim:'#587a85',acc:'#0e7490'},
  light:{bg:'#f4f6f9',panel:'#ffffff',line:'#dde4ed',txt:'#1a2230',dim:'#5b6879',acc:'#2f6feb'},
  sand:{bg:'#f7f2e8',panel:'#fffdf8',line:'#e3d9c6',txt:'#33291c',dim:'#7b6a54',acc:'#c2410c'},
  forest:{bg:'#0f1a14',panel:'#16241b',line:'#2a4433',txt:'#e8f2ea',dim:'#8aa697',acc:'#4ade80'},
  mono:{bg:'#15171b',panel:'#1c1f24',line:'#2e333b',txt:'#e8eaee',dim:'#98a0aa',acc:'#c9d1d9'},
  cyber:{bg:'#120a1f',panel:'#1b1032',line:'#3a2166',txt:'#f1eaff',dim:'#a98fd6',acc:'#c084fc'},
  night:{bg:'#0b0f14',panel:'#151b24',line:'#2a3442',txt:'#e6edf3',dim:'#8b949e',acc:'#58a6ff'}
};
(function(){
  const th=(function(){ try{ var q=new URLSearchParams(location.search); return q.get('theme')||localStorage.getItem('cs2at.theme')||(function(){var d=new Date(),tm=d.getHours()*60+d.getMinutes();return (tm>=1410||tm<460)?'forest':'sand';})(); }catch(e){ return 'sand'; } })();
  const t=SITE_THEMES[th]||SITE_THEMES.sand;
  const dark=!(th==='ink'||th==='light'||th==='lake'||th==='sand');
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg); r.setProperty('--panel',t.panel); r.setProperty('--line',t.line);
  r.setProperty('--txt',t.txt); r.setProperty('--dim',t.dim); r.setProperty('--acc',t.acc);
  r.setProperty('--on-acc','#ffffff');
  r.setProperty('--overlay',dark?'rgba(11,15,20,.96)':'rgba(238,244,246,.97)');
})();

/* --on-acc 自适应：按强调色亮度自动选黑/白，修「白字压亮绿 1.74:1」的老问题。
   只改 --on-acc 这一个变量，不动 --acc 本身，也不动其它任何颜色。 */
(function(){
  function relLum(c){
    var s=String(c||'').trim(), rgb=null;
    if(s.charAt(0)==='#'){
      s=s.slice(1);
      if(s.length===3) s=s.charAt(0)+s.charAt(0)+s.charAt(1)+s.charAt(1)+s.charAt(2)+s.charAt(2);
      if(/^[0-9a-fA-F]{6}$/.test(s)){ var n=parseInt(s,16); rgb=[(n>>16)&255,(n>>8)&255,n&255]; }
    } else {
      var m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(s);
      if(m) rgb=[+m[1],+m[2],+m[3]];
    }
    if(!rgb) return 0;
    function f(v){ v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4); }
    return 0.2126*f(rgb[0]) + 0.7152*f(rgb[1]) + 0.0722*f(rgb[2]);
  }
  var root=document.documentElement;
  function apply(){
    var acc=getComputedStyle(root).getPropertyValue('--acc').trim();
    if(!acc) return;
    var next=relLum(acc)>0.32 ? '#0b0f14' : '#ffffff';
    if(root.style.getPropertyValue('--on-acc').trim()===next) return;   // 幂等：避免 MutationObserver 自激
    root.style.setProperty('--on-acc', next);
  }
  apply();
  try{ new MutationObserver(apply).observe(root,{attributes:true,attributeFilter:['class','data-theme','style']}); }catch(e){}
  try{ addEventListener('load',apply); }catch(e){}
})();

/* ————— 基础 ————— */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const ui=document.getElementById('ui');
const msg=document.getElementById('msg'), go=document.getElementById('go');
const res=document.getElementById('res'), resBody=document.getElementById('resBody');
const D2R=Math.PI/180, R2D=180/Math.PI;
const FOVH=90, DIST=10, EYE=1.6, NEAR=0.25;
const PITCH_LIM=75*Math.PI/180;
let W=0,H=0,f=1;
let yaw=0, pitch=0;
let running=false, paused=false, pauseAt=0;
let t0=0, T=90000;
let DPI=800, YAW=0.022, CM=27.1, W_DEG=60, R_DEG=15;
let tA=[], thY=[], thP=[], phY=[], phP=[], erA=[];
let result=null, lastT=0, firstFrame=true;
let rawLockFailed=false, plainMode=false;
let L2=function(zh,en){ return window.__IS_EN? en: zh; };

function wrapPi(a){ while(a> Math.PI) a-=2*Math.PI; while(a<-Math.PI) a+=2*Math.PI; return a; }
const sensOf = cm => 360/((cm/2.54)*DPI)/YAW;
const kOf = cm => (360/((cm/2.54)*DPI))*D2R;

/* ————— 共享竞技场背景（assets/arena.js）：只画背景，不碰球 / 准星 / 判定 / 统计 ————— */
const arena=Arena.create(cv,{scene:SC});

function resize(){
  W=cv.width=innerWidth*devicePixelRatio; H=cv.height=innerHeight*devicePixelRatio;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  f=(W/2)/Math.tan(FOVH/2*D2R);
  arena.resize();
}
addEventListener('resize',resize); resize();

function toCam(x,y,z){
  const cy=Math.cos(yaw), sy=Math.sin(yaw);
  const x1= x*cy - z*sy, z1= x*sy + z*cy;
  const cp=Math.cos(pitch), sp=Math.sin(pitch);
  return {x:x1, y:y*cp - z1*sp, z:y*sp + z1*cp};
}
function projCam(c){ return {sx:W/2+(c.x/c.z)*f, sy:H/2-(c.y/c.z)*f}; }
function project(x,y,z){ const c=toCam(x,y,z); return c.z<=NEAR? null : projCam(c); }

/* ————— 运行诊断：输入采样率 / 帧间隔 P99 —————
   不再报告「输入→显示延迟」这类绝对毫秒数（对输入链路无意义且不可比）；
   改为可复现的两个量：输入事件采样率 Hz、渲染帧间隔 P99。 */
let inEvtT=[], frameT=[], lastFrameNow=0;
function resetDiag(){ inEvtT=[]; frameT=[]; lastFrameNow=0; }
function _med(a){
  if(!a.length) return NaN;
  const s=a.slice().sort(function(x,y){return x-y;});
  const m=s.length>>1;
  return s.length%2? s[m] : (s[m-1]+s[m])/2;
}
function diagStats(){
  let hz=NaN, p99=NaN;
  if(inEvtT.length>=2){
    const iv=[];
    for(let i=1;i<inEvtT.length;i++){ const d=inEvtT[i]-inEvtT[i-1]; if(d>0 && d<1000) iv.push(d); }
    const md=_med(iv);
    if(md>0) hz=1000/md;
  }
  if(frameT.length>=20){
    const s=frameT.slice().sort(function(a,b){return a-b;});
    p99=s[Math.min(s.length-1, Math.floor(s.length*0.99))];
  }
  return {hz:hz, p99:p99};
}
function diagLineHtml(){
  const d=diagStats();
  return '<div style="margin-top:6px;font-size:12.5px;line-height:16px;color:var(--dim)">'+
    L2('输入采样率 ','Input sampling rate ')+(isFinite(d.hz)? Math.round(d.hz)+' Hz' : '—')+
    ' · '+L2('帧间隔 P99 ','Frame interval P99 ')+(isFinite(d.p99)? d.p99.toFixed(1)+' ms' : '—')+
    '</div>';
}

/* ————— 参数读取（URL 优先，其次 cs2at.cfg） ————— */
const dpiEl=document.getElementById('dpi'), yawEl=document.getElementById('yaw'),
      cmEl=document.getElementById('cm'), wEl=document.getElementById('w'),
      rEl=document.getElementById('r'), tEl=document.getElementById('t');
function setVal(el,v){ if(!el) return; el.value=v; try{ el.dispatchEvent(new Event('input',{bubbles:true})); }catch(e){} }
function updSum(){
  var s=''; try{
    s=window.__IS_EN
      ? Math.round(CM*10)/10+' cm/360 · sensitivity '+sensOf(CM).toFixed(2)+' · DPI '+DPI
      : Math.round(CM*10)/10+' cm/360 · 灵敏度 '+sensOf(CM).toFixed(2)+' · DPI '+DPI;
  }catch(e){}
  document.getElementById('sum').textContent=s;
}
dpiEl.addEventListener('input',function(){ DPI=parseFloat(dpiEl.value)||800; updSum(); });
yawEl.addEventListener('input',function(){ YAW=parseFloat(yawEl.value)||0.022; updSum(); });
cmEl.addEventListener('input',function(){ CM=parseFloat(cmEl.value)||27.1; updSum(); });
try{
  var q=new URLSearchParams(location.search);
  var cfg=JSON.parse(localStorage.getItem('cs2at.cfg')||'null');
  if(q.get('dpi')) setVal(dpiEl,q.get('dpi')); else if(cfg&&cfg.dpi) setVal(dpiEl,cfg.dpi);
  if(q.get('yaw')) setVal(yawEl,q.get('yaw')); else if(cfg&&cfg.yaw) setVal(yawEl,cfg.yaw);
  if(q.get('cm')) setVal(cmEl,q.get('cm')); else if(cfg&&cfg.cm) setVal(cmEl,cfg.cm);
}catch(e){}
updSum();

/* ————— 模式：连续正弦 / 步进跟随（灵敏度探针） ————— */
let mode='sine';
const modeSineBtn=document.getElementById('modeSine'), modeStepBtn=document.getElementById('modeStep'),
      modeHintEl=document.getElementById('modeHint');
function setMode(m){
  mode=(m==='step')?'step':'sine';
  if(modeSineBtn) modeSineBtn.classList.toggle('is-on', mode==='sine');
  if(modeStepBtn) modeStepBtn.classList.toggle('is-on', mode==='step');
  document.querySelectorAll('.sineOnly').forEach(function(el){ el.style.display = mode==='sine' ? '' : 'none'; });
  if(modeHintEl) modeHintEl.innerHTML = mode==='step'
    ? L2('步进跟随：目标瞬移，间隔阶梯自适应（连 3 次到位缩 8%、失败加 8%），A/B 交错 4 块 × 10 秒，约 43 秒。','Step follow: targets teleport; adaptive interval staircase (3 hits → −8%, miss → +8%); A/B interleaved 4 × 10 s, ~43 s.')
    : L2('连续正弦：目标绕圆匀速运动，测跟踪误差 / 相位滞后 / 速度增益。','Continuous sine: target orbits at constant speed; measures tracking error / phase lag / speed gain.');
  try{ updSum(); }catch(e){}
}
function pickMode(m){ if(running) return; setMode(m); }
if(modeSineBtn) modeSineBtn.addEventListener('click',function(e){ e.stopPropagation(); pickMode('sine'); });
if(modeStepBtn) modeStepBtn.addEventListener('click',function(e){ e.stopPropagation(); pickMode('step'); });
setMode('sine');

try{
  if(!('onpointerrawupdate' in window)){
    var bw=document.getElementById('bw');
    if(bw) bw.textContent=(window.__IS_EN?'No pointerrawupdate in this browser — sampling is coarser; use Chrome / Edge.':'当前浏览器不支持 pointerrawupdate，采样精度降低，建议 Chrome / Edge。');
  }
}catch(e){}
/* 返回键只在开始/暂停/结果时出现：全屏里点不到，还会压住左上角 HUD */
(function(){
  var b=document.getElementById('back');
  if(!b) return;
  function sync(){ b.classList.toggle('on', document.querySelectorAll('.overlay.show').length>0); }
  ['msg','res'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) new MutationObserver(sync).observe(el,{attributes:true,attributeFilter:['class']});
  });
  sync();
})();

/* ————— 指针与锁 ————— */
/* 原始输入：只有 unadjustedMovement 这条路。失败时不自动重试——
   自动重试发生在 promise 回调里，已脱离用户手势，必然再失败。
   改为显示原因 + 两个按钮，点按钮才是新的用户手势。 */
function lockWarn(reason){
  rawLockFailed=true;
  var el=document.getElementById('rawWarn');
  if(el){
    el.style.display='';
    var EN = !!window.__IS_EN;
    el.innerHTML=(EN?'⚠️ Raw input lock failed ('+reason+') — system acceleration distorts the numbers.'
                    :'⚠️ 原始输入锁定失败（'+reason+'）——系统加速会让增益类数字失真。')
      +'<span style="display:inline-flex;gap:8px;margin-left:10px;vertical-align:middle">'
      +'<button id="lockRetry" class="wb">'+(EN?'Retry':'重试')+'</button>'
      +'<button id="lockPlain" class="wb">'+(EN?'Continue accelerated':'用加速输入继续')+'</button></span>'
      +'<div style="margin-top:6px;font-size:12px;opacity:.85">'+(EN?'Fix: turn off Windows “Enhance pointer precision” · avoid remote desktop / editor previews · open directly in Chrome / Edge':'修法：关掉 Windows「提高指针精确度」 · 别在远程桌面 / 编辑器预览里跑 · 用 Chrome / Edge 直接打开')+'</div>';
    var a=document.getElementById('lockRetry'), b=document.getElementById('lockPlain');
    if(a) a.onclick=function(ev){ ev.stopPropagation(); doLock(); };
    if(b) b.onclick=function(ev){ ev.stopPropagation(); plainLock(); };
  }
  if(running && !paused) pause();
}
function plainLock(){
  rawLockFailed=true; plainMode=true;        // 明确降级：结果会标红，且不再强求原始输入
  try{
    var p=cv.requestPointerLock();
    if(p&&p.catch) p.catch(function(){});
    var el=document.getElementById('rawWarn'); if(el) el.style.display='none';
  }catch(e){}
  if(paused) resume();
}
function doLock(){
  rawLockFailed=false;
  var p;
  try{ p=cv.requestPointerLock({unadjustedMovement:true}); }
  catch(e){ lockWarn((e&&e.name)||'unsupported'); return; }
  if(p&&p.then){
    p.then(function(){
      rawLockFailed=false; plainMode=false;
      var el=document.getElementById('rawWarn'); if(el) el.style.display='none';
    }).catch(function(err){
      lockWarn((err&&err.name)||'unsupported');
    });
  }
}
function moveEv(e){
  if(!running||paused) return;
  if(inEvtT.length<6000) inEvtT.push(performance.now());
  // 步进探针：B 块把「鼠标→角度」灵敏度乘 ×1.15（A = 当前灵敏度，B = 更高一档）
  const k=kOf(CM)*((mode==='step'&&SP)?SP.kMul:1);
  yaw  += (e.movementX||0)*k;
  pitch-= (e.movementY||0)*k;
  if(pitch> PITCH_LIM) pitch= PITCH_LIM;
  if(pitch<-PITCH_LIM) pitch=-PITCH_LIM;
}
addEventListener(('onpointerrawupdate' in window)?'pointerrawupdate':'pointermove', moveEv, true);
document.addEventListener('pointerlockchange',()=>{
  if(document.pointerLockElement){   // 重新锁上
    if(!plainMode) rawLockFailed=false; // 降级（普通锁）不得清掉警告
    try{ var rwEl=document.getElementById('rawWarn'); if(rwEl) rwEl.style.display='none'; }catch(e){}
  }

});
document.addEventListener('pointerlockerror',()=>{
  if(plainMode){ lockWarn('SecurityError'); return; }   // 连普通锁都失败：别静默暂停，给回按钮
  if(running) pause();
});

/* ————— 任务 ————— */
function start(){

  DPI=parseFloat(dpiEl.value)||800;

  W_DEG=parseFloat(wEl.value)||60; if(W_DEG<5) W_DEG=5; if(W_DEG>400) W_DEG=400;
  R_DEG=parseFloat(rEl.value)||15; if(R_DEG<3) R_DEG=3; if(R_DEG>40) R_DEG=40;
  yaw=0; pitch=0; t0=performance.now();
  tA=[]; thY=[]; thP=[]; phY=[]; phP=[]; erA=[];
  firstFrame=true; lastT=0;
  rawLockFailed=false; plainMode=false;
  try{ var rw=document.getElementById('rawWarn'); if(rw) rw.style.display='none'; }catch(e){}
  running=true; paused=false; result=null;

  /* 不再自动全屏：部分环境进全屏会拿不到原始输入（unadjustedMovement），开跑只锁指针 */
}

function pause(){
  if(!running||paused) return;
  paused=true; pauseAt=performance.now();
  go.textContent=L2('继续','Resume'); msg.classList.add('show');
  if(document.pointerLockElement) document.exitPointerLock();
  /* 全屏不再是开跑流程的一部分 */
}
function resume(){
  if(!paused) return;
  const d=performance.now()-pauseAt; t0+=d;
  if(SP){ SP.startAt+=d; if(SP.trial) SP.trial.t0+=d; }
  lastFrameNow=0;
  paused=false; msg.classList.remove('show'); if(!plainMode) doLock();
  /* 全屏不再是开跑流程的一部分 */
}
go.addEventListener('click',function(){ if(paused){ resume(); } else { start(); } });

/* 全屏单独一个按钮：官方文档要求 requestPointerLock() 必须在 requestFullscreen() 之前调用，

/* 全屏改成手动（F 键）：部分环境下进全屏会拿不到 unadjustedMovement 原始输入，

/* ————— 步进跟随 · 灵敏度探针 —————
   连续正弦追踪测不出灵敏度：人是闭环控制器，会用手速把增益误差补偿掉。
   改用「瞬移目标」：目标在水平方向随机角度瞬移；每次允许时间 = 阶梯自适应间隔
   （连续 3 次到位 ×0.92，失败 ×1.08）→ 收敛到 ~75–80% 成功率，避免天花板 / 地板效应。
   A/B/A/B 交错块：A = 当前灵敏度，B = 灵敏度 ×1.15；
   比较 A/B 的过冲比 → 方向判断（过冲随灵敏度上升 = 当前偏高）。
   指标：到位用时 / 过冲比（首次越过目标的角度 ÷ 目标距离）/ 抖动次数。
   总时长 3s 准备 + 4×10s = 43s（<45s）。 */
const PROBE={
  blocks:['A','B','A','B'],
  blockMs:10000,
  countdownMs:3000,
  bMul:1.15,                 // B 块灵敏度倍数
  tolDeg:1.6,                // 到位容差（度）
  stepMinDeg:10, stepMaxDeg:22,
  jitterDeadbandDeg:0.05,    // 抖动判定的位置增量死区（度）
  interval0:1200, intervalMin:350, intervalMax:2500,
  down:0.92, up:1.08, streak:3
};
let SP=null;

function newProbeBlock(){ return {n:0,succ:0,arrN:0,arrSum:0,ovSum:0,jitSum:0}; }

function startProbe(){
  DPI=parseFloat(dpiEl.value)||800;
  YAW=parseFloat(yawEl.value)||0.022;
  CM=parseFloat(cmEl.value)||27.1;
  if(!isFinite(CM)||CM<12) CM=12; if(CM>60) CM=60;
  cmEl.value=CM.toFixed(1);
  yaw=0; pitch=0;
  rawLockFailed=false; plainMode=false;
  resetDiag();
  try{ var rw=document.getElementById('rawWarn'); if(rw) rw.style.display='none'; }catch(e){}
  SP={
    startAt:performance.now()+PROBE.countdownMs,
    blockIdx:-1, kMul:1, interval:PROBE.interval0, streak:0,
    trial:null, trials:[],
    blockStats:{A:newProbeBlock(),B:newProbeBlock()}
  };
  running=true; paused=false; result=null;
  msg.classList.remove('show'); res.classList.remove('show');
  doLock();
}

function spawnProbeTrial(now){
  if(!SP) return;
  const dir=Math.random()<0.5?-1:1;
  const stepDeg=PROBE.stepMinDeg+Math.random()*(PROBE.stepMaxDeg-PROBE.stepMinDeg);
  const block=PROBE.blocks[SP.blockIdx]||'A';
  SP.tYaw=wrapPi(yaw+dir*stepDeg*D2R);
  SP.tPitch=pitch;
  SP.trial={
    t0:now, block:block, dir:dir, dist:stepDeg*D2R,
    sYaw:yaw, sPitch:pitch, tYaw:SP.tYaw, tPitch:SP.tPitch,
    arrived:false, arrival:null, maxProj:0, lastProg:0, lastSign:0,
    jitter:0, endErr:null, success:false, overshoot:0
  };
}

function updateProbeTrial(tr,now){
  const dx=wrapPi(tr.tYaw-yaw), dy=wrapPi(tr.tPitch-pitch);
  const err=Math.hypot(dx,dy)*R2D;
  const prog=wrapPi(yaw-tr.sYaw)*tr.dir;          // 沿目标方向的带符号进度（rad）
  if(prog>tr.maxProj) tr.maxProj=prog;
  if(err<=PROBE.tolDeg && !tr.arrived){ tr.arrived=true; tr.arrival=now-tr.t0; }
  // 抖动：到位之后，沿目标轴的位置增量方向反转（死区过滤手抖噪声）
  const dprog=prog-tr.lastProg;
  if(tr.arrived && Math.abs(dprog)>PROBE.jitterDeadbandDeg*D2R){
    const sign=dprog>0?1:-1;
    if(tr.lastSign && sign!==tr.lastSign) tr.jitter++;
    tr.lastSign=sign;
  }
  tr.lastProg=prog;
  tr.endErr=err;
}

function resolveProbeTrial(tr,now){
  if(!SP||!tr) return;
  if(tr.endErr===null || tr.endErr===undefined){
    tr.endErr=Math.hypot(wrapPi(tr.tYaw-yaw),wrapPi(tr.tPitch-pitch))*R2D;
  }
  tr.success=!!(tr.arrived && tr.endErr<=PROBE.tolDeg);
  tr.overshoot=tr.dist>0 ? Math.max(0,(tr.maxProj-tr.dist)/tr.dist) : 0;
  const b=SP.blockStats[tr.block];
  b.n++;
  if(tr.success) b.succ++;
  if(tr.arrived){ b.arrN++; b.arrSum+=tr.arrival; }
  b.ovSum+=tr.overshoot;
  b.jitSum+=tr.jitter;
  SP.trials.push(tr);
  if(tr.success){
    SP.streak++;
    if(SP.streak>=PROBE.streak){ SP.interval=Math.max(PROBE.intervalMin, SP.interval*PROBE.down); SP.streak=0; }
  } else {
    SP.interval=Math.min(PROBE.intervalMax, SP.interval*PROBE.up);
    SP.streak=0;
  }
  SP.trial=null;
}

function drawTargetBall(yawT,pitchT){
  const cp2=Math.cos(pitchT);
  const tx=DIST*cp2*Math.sin(yawT), ty=DIST*Math.sin(pitchT), tz=DIST*cp2*Math.cos(yawT);
  const p=project(tx,ty,tz);
  if(!p) return;
  const rad=Math.max(5*devicePixelRatio, f*Math.tan(1.5*D2R));
  ctx.beginPath(); ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);
  ctx.fillStyle=SC.tgtFill; ctx.fill();
  ctx.strokeStyle=SC.ring||SC.tgt; ctx.lineWidth=2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*0.25,0,Math.PI*2);
  ctx.fillStyle=SC.tgt; ctx.fill();
}
function drawCrosshair(){
  ctx.strokeStyle=SC.cross||'#fff'; ctx.lineWidth=2;
  const cxp=W/2, cyp=H/2;
  ctx.beginPath(); ctx.moveTo(cxp-12,cyp); ctx.lineTo(cxp+12,cyp); ctx.moveTo(cxp,cyp-12); ctx.lineTo(cxp,cyp+12); ctx.stroke();
}

function loopStep(now){
  if(!SP){ running=false; return; }
  arena.setView(yaw,pitch,f); arena.draw(now);
  const P=SP, t=now-P.startAt;
  const total=PROBE.blockMs*PROBE.blocks.length;
  if(t<0){
    drawCrosshair();
    const n=Math.max(1, Math.ceil(-t/1000));
    ui.innerHTML=L2('准备 '+n+' · 步进跟随','Ready '+n+' · step follow');
    return;
  }
  if(t>=total){ finishProbe(); return; }
  const bi=Math.min(PROBE.blocks.length-1, Math.floor(t/PROBE.blockMs));
  if(bi!==P.blockIdx){
    if(P.trial) resolveProbeTrial(P.trial, now);
    P.blockIdx=bi;
    P.kMul=PROBE.blocks[bi]==='B'? PROBE.bMul : 1;
    spawnProbeTrial(now);
  } else if(!P.trial){
    spawnProbeTrial(now);
  }
  if(P.trial){
    updateProbeTrial(P.trial, now);
    if(now-P.trial.t0>=P.interval){ resolveProbeTrial(P.trial, now); spawnProbeTrial(now); }
  }
  if(P.trial) drawTargetBall(P.trial.tYaw, P.trial.tPitch);
  drawCrosshair();
  const left=Math.max(0, Math.ceil((total-t)/1000));
  const b=PROBE.blocks[P.blockIdx]||'A';
  const st=P.blockStats[b];
  const sr=st.n? Math.round(st.succ/st.n*100):0;
  ui.innerHTML=L2('步进跟随 · '+left+' 秒 · '+b+' 块 · 间隔 '+Math.round(P.interval)+' ms · 成功率 '+sr+'%',
                  'Step follow · '+left+'s · block '+b+' · interval '+Math.round(P.interval)+'ms · hit '+sr+'%');
}

/* ————— 步进探针历史：趋势图 + 存图 —————
   同一探针最近 10 次方向判断结果（dOv，带符号）画成折线；数据存 localStorage cs2at.probeRuns（最多 30 条）。 */
const PROBE_STORE_KEY='cs2at.probeRuns';
// 历史数据可能同时存在两种 dOv 单位：旧版百分数（9.6）与当前分数（0.096）。
// 统一归一化成分数，轴标签再乘 100 显示，避免 9.6 → 960 → ×1.15 = 1105% 的双重放大。
function probeDovToFrac(v){
  if(!isFinite(v)) return NaN;
  return Math.abs(v)>1.5 ? v/100 : v;
}
function loadProbeRuns(){
  try{
    const a=JSON.parse(localStorage.getItem(PROBE_STORE_KEY)||'[]');
    if(!Array.isArray(a)) return [];
    const out=[];
    a.forEach(function(x){
      if(!x || !isFinite(x.dOv)) return;
      const y=Object.assign({}, x);
      // 新数据带单位标记；旧数据无标记时按数值量级兼容（>1.5 视为旧的百分数）
      y.dOv=(x.dOvUnit==='pct'||x.dOvUnit==='percent') ? x.dOv/100 : probeDovToFrac(x.dOv);
      y.dOvUnit='frac';
      out.push(y);
    });
    return out.slice(-30);
  }catch(e){ return []; }
}
function saveProbeRuns(list){
  const cut=list.filter(function(x){ return x && isFinite(x.dOv); }).map(function(x){
    const y=Object.assign({}, x);
    y.dOv=probeDovToFrac(x.dOv);
    y.dOvUnit='frac';   // 明确写入单位：分数（0.096 = 9.6%）
    return y;
  }).slice(-30);
  try{ localStorage.setItem(PROBE_STORE_KEY, JSON.stringify(cut)); }catch(e){}
  return cut;
}
function _probeColors(){
  const cs=getComputedStyle(document.documentElement);
  const v=function(n,f){ const x=cs.getPropertyValue(n).trim(); return x||f; };
  return {dim:v('--dim','#8aa697'), line:v('--line','#2a4433'), txt:v('--txt','#e8f2ea'), acc:v('--acc','#4ade80'), bg:v('--bg','#0f1a14')};
}
function probeTrendStats(runs){
  const last=runs.slice(-10);
  const vals=last.map(function(r){return r.dOv;});
  let med=NaN;
  if(vals.length){ const s=vals.slice().sort(function(a,b){return a-b;}); const m=s.length>>1; med=s.length%2? s[m] : (s[m-1]+s[m])/2; }
  let same=0;
  if(last.length){
    const cur=last[last.length-1];
    const sg=cur.dOv>0?1:(cur.dOv<0?-1:0);
    last.forEach(function(r){ const x=r.dOv>0?1:(r.dOv<0?-1:0); if(x===sg) same++; });
  }
  return {n:last.length, med:med, same:same, list:last};
}
function drawProbeTrend(g, cssW, cssH, runs, opt){
  opt=opt||{};
  const C=_probeColors();
  const st=probeTrendStats(runs);
  const list=st.list;
  const padL=opt.padL||34, padR=opt.padR||8, padT=opt.padT||10, padB=opt.padB||16;
  const fontPx=opt.fontPx||9, dotR=opt.dotR||3;
  const w=cssW-padL-padR, hh=cssH-padT-padB;
  if(w<=0||hh<=0) return st;
  let maxPct=5;
  list.forEach(function(r){ const a=Math.abs(r.dOv)*100; if(a>maxPct) maxPct=a; });
  const maxAbs=Math.max(5, Math.ceil(maxPct*1.15));
  const x0=padL, y0=padT, cy=y0+hh/2;
  const X=function(i){ return list.length<=1? x0+w/2 : x0 + w*i/(list.length-1); };
  const Y=function(pct){ return cy - (pct/maxAbs)*(hh/2); };
  g.clearRect(0,0,cssW,cssH);
  g.save();
  // 0 线：中性色虚线（1px）
  g.strokeStyle=C.dim; g.globalAlpha=0.85; g.lineWidth=1; g.setLineDash([4,3]);
  g.beginPath(); g.moveTo(x0, Math.round(cy)+0.5); g.lineTo(x0+w, Math.round(cy)+0.5); g.stroke();
  g.setLineDash([]); g.globalAlpha=1;
  // 纵轴刻度：上下限 + 0
  g.fillStyle=C.dim; g.font=fontPx+'px "Microsoft YaHei UI","Microsoft YaHei",sans-serif';
  g.textAlign='right'; g.textBaseline='middle';
  g.fillText('+'+maxAbs.toFixed(0)+'%', x0-6, Y(maxAbs)+1);
  g.fillText('0', x0-6, cy+1);
  g.fillText('-'+maxAbs.toFixed(0)+'%', x0-6, Y(-maxAbs)-1);
  // 横轴：次数（首尾刻度）
  g.textBaseline='alphabetic';
  if(list.length>1){
    g.textAlign='left'; g.fillText('1', x0, cssH-4);
    g.textAlign='right'; g.fillText(String(list.length), x0+w, cssH-4);
  } else if(list.length){
    g.textAlign='center'; g.fillText('1', x0+w/2, cssH-4);
  }
  // 趋势线：1px 折线，无填充
  if(list.length){
    g.strokeStyle=C.txt; g.lineWidth=1; g.globalAlpha=0.92;
    g.beginPath();
    list.forEach(function(r,i){ const x=X(i), y=Math.round(Y(r.dOv*100))+0.5; if(i) g.lineTo(x,y); else g.moveTo(x,y); });
    g.stroke(); g.globalAlpha=1;
    // 本次：强调色点
    const iCur=list.length-1;
    g.fillStyle=C.acc;
    g.beginPath(); g.arc(X(iCur), Math.round(Y(list[iCur].dOv*100))+0.5, dotR, 0, Math.PI*2); g.fill();
  }
  g.restore();
  st.maxAbs=maxAbs;
  return st;
}
function probeStatText(st){
  if(!st||!st.n) return L2('暂无历史数据','No history yet');
  const med=isFinite(st.med)? ((st.med>=0?'+':'')+(st.med*100).toFixed(1)+'%') : '—';
  return L2('最近 '+st.n+' 次 · 中位 '+med+' · 方向稳定度 '+st.same+'/'+st.n+' 同向',
            'Last '+st.n+' · median '+med+' · direction stability '+st.same+'/'+st.n+' same');
}
function renderProbeTrend(runs){
  const cv=document.getElementById('probeTrend');
  if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const cssW=360, cssH=100;
  cv.width=Math.round(cssW*dpr); cv.height=Math.round(cssH*dpr);
  cv.style.width=cssW+'px'; cv.style.height=cssH+'px';
  const g=cv.getContext('2d');
  if(!g) return;
  g.setTransform(dpr,0,0,dpr,0,0);
  const st=drawProbeTrend(g, cssW, cssH, runs, {});
  window.__probeTrendDebug={maxAbs:st.maxAbs, n:st.n, med:st.med, same:st.same};
  const el=document.getElementById('probeTrendStat');
  if(el) el.textContent=probeStatText(st);
  const btn=document.getElementById('probeTrendSave');
  if(btn) btn.addEventListener('click', function(e){ e.stopPropagation(); exportProbeTrend(runs); });
}
function exportProbeTrend(runs){
  try{
    const C=_probeColors();

function finishProbe(){
  running=false;
  try{ ui.innerHTML=''; }catch(e){}
  if(document.pointerLockElement) document.exitPointerLock();
  const P=SP; SP=null;
  const trials=P?P.trials:[];
  const A=P?P.blockStats.A:newProbeBlock();
  const B=P?P.blockStats.B:newProbeBlock();
  const n=trials.length;
  let arrSum=0, arrN=0, ovSum=0, jitSum=0, succN=0;
  for(var i=0;i<n;i++){ var tr=trials[i];
    if(tr.arrival!==null){ arrSum+=tr.arrival; arrN++; }
    ovSum+=tr.overshoot; jitSum+=tr.jitter; if(tr.success) succN++;
  }
  const avgOv=function(b){ return b.n? b.ovSum/b.n : NaN; };
  const avgArr=function(b){ return b.arrN? b.arrSum/b.arrN : NaN; };
  const ovA=avgOv(A), ovB=avgOv(B);
  const dOv=(isFinite(ovA)&&isFinite(ovB))? ovB-ovA : NaN;
  const DIR_TH=0.05;
  let dirKey='unknown';
  if(isFinite(dOv) && A.n>=3 && B.n>=3){ dirKey = dOv>DIR_TH?'high':(dOv<-DIR_TH?'low':'match'); }
  result={
    mode:'step', ok:n>0, n:n, succAll:n? succN/n:0, interval:P?Math.round(P.interval):0,
    arrAvg:arrN? arrSum/arrN : NaN, ovAvg:n? ovSum/n:NaN, jitAvg:n? jitSum/n:NaN,
    ovA:ovA, ovB:ovB, dOv:dOv, dirKey:dirKey, A:A, B:B, raw:rawLockFailed
  };
  // 历史趋势：只存方向数值有效的 run，最多 30 条
  let probeRuns=[];
  try{
    if(isFinite(dOv)){
      const list=loadProbeRuns();
      list.push({ts:Date.now(), dOv:dOv, ovA:ovA, ovB:ovB, arrAvg:result.arrAvg, jitAvg:result.jitAvg, succAll:result.succAll, n:n, cm:CM, dirKey:dirKey});
      probeRuns=saveProbeRuns(list);
    } else {
      probeRuns=loadProbeRuns();
    }
  }catch(e){ probeRuns=[]; }
  const row=function(k,v,cls){ return '<tr><th>'+k+'</th><td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td></tr>'; };
  const fmt=function(v,digits,suffix){ return isFinite(v)? v.toFixed(digits)+suffix : '—'; };
  let dirText;
  if(dirKey==='high') dirText=L2('过冲随灵敏度上升（B×1.15 的过冲高于 A）→ 当前灵敏度偏高；建议把 cm/360 调大约 10–15% 后复测。','Overshoot rises with sensitivity (B×1.15 > A) → current sensitivity is too high; raise cm/360 by ~10–15% and retest.');
  else if(dirKey==='low') dirText=L2('灵敏度上升反而降低过冲（B×1.15 的过冲低于 A）→ 当前灵敏度偏低；建议把 cm/360 调小约 10–15% 后复测。','Overshoot falls as sensitivity rises (B×1.15 < A) → current sensitivity is too low; lower cm/360 by ~10–15% and retest.');
  else if(dirKey==='match') dirText=L2('A/B 过冲差异小于 5% → 灵敏度方向接近匹配，或本局噪声偏大。','A/B overshoot difference is below 5% → direction looks matched, or this run was noisy.');
  else dirText=L2('有效样本不足（A/B 各需 ≥3 次）→ 方向无法判断，再测一轮。','Not enough samples (need ≥3 per block) → direction undetermined; run again.');
  let body='<div style="font-size:17px;color:var(--acc);margin-bottom:4px">'+L2('步进跟随 · 结果','Step follow · Result')+'</div>';
  if(!n){
    body+='<div style="margin-top:8px;font-size:14px">'+L2('没有采集到有效步进。','No valid step trials captured.')+'</div>';
  } else {
    body+=(rawLockFailed?'<div style="margin-top:6px;font-size:13.5px;color:#f85149">'+L2('⚠️ 本次输入未校准（原始输入锁定失败），数值仅供参考。','⚠️ Raw input lock failed — numbers are indicative only.')+'</div>':'')+
      '<table class="rt">'+
      row(L2('到位用时','Time to arrive'), isFinite(result.arrAvg)? Math.round(result.arrAvg)+' ms' : '—', 'big')+
      row(L2('过冲比','Overshoot ratio'), fmt(result.ovAvg*100,1,'%'))+
      row(L2('抖动次数','Jitter count'), fmt(result.jitAvg,1,' '+L2('次','times')))+
      row(L2('成功率','Success rate'), Math.round(result.succAll*100)+'%')+
      row(L2('自适应间隔','Adaptive interval'), result.interval+' ms')+
      row(L2('步进次数','Step trials'), n+L2(' 次',' trials'))+
      '</table>'+
      '<table class="rt" style="margin-top:8px">'+
      row(L2('A = 当前灵敏度','A = current sensitivity'), L2('过冲 ','overshoot ')+fmt(ovA*100,1,'%')+' · '+L2('到位 ','arrive ')+fmt(avgArr(A),0,' ms')+' · '+L2('成功 ','hit ')+Math.round((A.n?A.succ/A.n:0)*100)+'%')+
      row(L2('B = 灵敏度 ×1.15','B = sensitivity ×1.15'), L2('过冲 ','overshoot ')+fmt(ovB*100,1,'%')+' · '+L2('到位 ','arrive ')+fmt(avgArr(B),0,' ms')+' · '+L2('成功 ','hit ')+Math.round((B.n?B.succ/B.n:0)*100)+'%')+
      '</table>'+
      '<div style="margin-top:12px;font-size:14px;line-height:22px;color:var(--txt)">'+L2('方向判断：','Direction: ')+dirText+'</div>'+
      diagLineHtml();
  }
  if(isFinite(dOv)){
    body+='<div style="margin-top:24px">'+
      '<canvas id="probeTrend" width="360" height="100" style="display:block;width:360px;height:100px;margin:0"></canvas>'+
      '<div id="probeTrendStat" style="display:block;margin-top:14px;font-size:12.5px;line-height:18px;color:var(--dim)"></div>'+
      '<div style="margin-top:12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">'+
        '<button id="probeTrendSave" type="button" class="btn ghost btn-sm" style="margin:0">'+L2('存图','Save image')+'</button>'+
        '<span style="font-size:12px;line-height:18px;color:var(--dim)">'+L2('注意：未完全排除适应效应，仅供方向参考。','Note: adaptation effects are not fully ruled out — directional reference only.')+'</span>'+
      '</div>'+
      '</div>';
  }

  resBody.innerHTML=body;
  if(document.getElementById('probeTrend')) renderProbeTrend(probeRuns);
  res.classList.add('show');
}

let idleLast=0;
function loop(now){
  requestAnimationFrame(loop);
  if(!running||paused){
    // 未开始 / 暂停 / 结果页：仍渲染静态竞技场背景（~30fps 省电），让开始页背后有空间
    if(now-(idleLast||0)>=30){ idleLast=now; arena.setView(yaw,pitch,f); arena.draw(now); }
    return;
  }
  if(lastFrameNow){ var dtF=now-lastFrameNow; if(dtF>0 && dtF<500 && frameT.length<6000) frameT.push(dtF); }
  lastFrameNow=now;
  if(mode==='step'){ loopStep(now); return; }
  const t=(now-t0)/1000;
  const th=R_DEG*D2R*Math.cos(W_DEG*D2R*t);
  const tp=R_DEG*D2R*Math.sin(W_DEG*D2R*t);
  const ey=wrapPi(th-yaw)/D2R, ep=(tp-pitch)/D2R;
  if(!firstFrame){
    tA.push(t); thY.push(th); thP.push(tp); phY.push(yaw); phP.push(pitch);
    erA.push({ey:ey, ep:ep});
  } else { firstFrame=false; }
  lastT=now;

  // 画（竞技场背景 + 目标球 + 准星；球 / 准星 / 判定照旧）
  arena.setView(yaw,pitch,f);
  arena.draw(now);
  const cp2=Math.cos(tp);
  const tx=DIST*cp2*Math.sin(th), ty=DIST*Math.sin(tp), tz=DIST*cp2*Math.cos(th);
  const p=project(tx,ty,tz);
  if(p){
    // 球：与标定器同款——tgtFill 填充 + tgt 描边 + 中心点
    const rad=Math.max(5*devicePixelRatio, f*Math.tan(1.5*D2R));
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rad,0,Math.PI*2);
    ctx.fillStyle=SC.tgtFill; ctx.fill();
    ctx.strokeStyle=SC.ring||SC.tgt; ctx.lineWidth=2.5; ctx.stroke();
    ctx.beginPath(); ctx.arc(p.sx,p.sy,rad*0.25,0,Math.PI*2);
    ctx.fillStyle=SC.tgt; ctx.fill();
  }
  ctx.strokeStyle=SC.cross||'#fff'; ctx.lineWidth=2;
  const cxp=W/2, cyp=H/2;
  ctx.beginPath(); ctx.moveTo(cxp-12,cyp); ctx.lineTo(cxp+12,cyp); ctx.moveTo(cxp,cyp-12); ctx.lineTo(cxp,cyp+12); ctx.stroke();

  const left=Math.max(0,(T-(now-t0))/1000);
  ui.innerHTML=L2(left.toFixed(0)+' 秒 · '+erA.length+' 帧', left.toFixed(0)+' s · '+erA.length+' frames');
  if(now-t0>=T){ running=false; finish(); return; }
}
requestAnimationFrame(loop);

/* ————— 统计 ————— */
function finish(){
  running=false;
  if(document.pointerLockElement) document.exitPointerLock();
  const n=erA.length;
  const lapDur=2*Math.PI/(W_DEG*D2R);
  // 水平量（去均值）回归：目标 ±15° 的信号全用上——差分会把信号几乎全扔掉
  let mtx=0,mty=0,mpx=0,mpy=0,c=0;
  for(let i=0;i<n;i++){ if(tA[i]<1.0) continue;
    mtx+=thY[i]; mty+=thP[i]; mpx+=phY[i]; mpy+=phP[i]; c++; }
  if(c>0){ mtx/=c; mty/=c; mpx/=c; mpy/=c; }
  let stt=0, stp=0, spq=0;
  const blocks=[];   // 每圈一个 block（bootstrap 用）
  for(let i=0;i<n;i++){ if(tA[i]<1.0) continue;
    const tx=thY[i]-mtx, ty=thP[i]-mty;
    const px=phY[i]-mpx, py=phP[i]-mpy;
    const qx=-ty, qy=tx;              // 正交方向：带相位的信号投影到原方向会被 cos(ωL) 衰减
    stt += tx*tx + ty*ty;
    stp += px*tx + py*ty;             // 同相分量
    spq += px*qx + py*qy;             // 正交分量
    const lap=Math.floor(tA[i]/lapDur);
    (blocks[lap]=blocks[lap]||[]).push([tx,ty,px,py]);
  }
  const a=stp/Math.max(1e-9,stt), b=spq/Math.max(1e-9,stt);
  const gain=Math.hypot(a,b);                         // 不再被 cos(ωL) 衰减
  const phase=-Math.atan2(b,a);                       // rad
  const lagMs=phase/(W_DEG*D2R)*1000;                 // 同一拟合顺带给出滞后
  const nlaps=blocks.length;
  // 分圈 bootstrap：帧间自相关大，直接算 SE 会过于自信
  function bootstrapCI(B){
    const out=[];
    for(let bb=0;bb<B;bb++){
      let bn1=0, bn2=0, bd=0;
      for(let k=0;k<blocks.length;k++){
        const blk=blocks[(Math.random()*blocks.length)|0];
        for(let q=0;q<blk.length;q++){ const p=blk[q];
          bd+=p[0]*p[0]+p[1]*p[1]; bn1+=p[2]*p[0]+p[3]*p[1]; bn2+=p[2]*(-p[1])+p[3]*p[0]; }
      }
      const ga=bn1/Math.max(1e-9,bd), gb=bn2/Math.max(1e-9,bd);
      out.push(Math.hypot(ga,gb));
    }
    out.sort((a2,b2)=>a2-b2);
    return [out[Math.floor(B*0.025)], out[Math.floor(B*0.975)]];
  }
  const bs=blocks.length>=3? bootstrapCI(2000) : null;
  const ci=(bs && isFinite(gain))? (bs[1]-bs[0])/2/Math.max(0.0001,gain) : NaN;
  const ok= c>=600 && nlaps>=6;   // 至少 6 圈（36 秒以上）
  const minSec=Math.ceil(6*lapDur);
  let es=0, ec=0;
  for(let k=0;k<n;k++){ if(tA[k]<1.0) continue;
    es+=erA[k].ey*erA[k].ey+erA[k].ep*erA[k].ep; ec++; }
  const rms=Math.sqrt(es/Math.max(1,ec));
  const lag=Math.max(0, Math.round(lagMs));
  result={ok:ok, gain:gain, ci:ci, nlaps:nlaps, rms:rms, lag:lag, n:c, frames:n, raw:rawLockFailed};
  // 与上一轮对比
  let prevTxt='';
  try{
    const prev=JSON.parse(localStorage.getItem('cs2at.track')||'null');
    if(prev && isFinite(prev.rms) && isFinite(prev.lag)){
      const dr=rms-prev.rms, dl=lag-prev.lag;
      prevTxt='<div style="margin-top:8px;font-size:13px;color:var(--dim)">'+
        L2('对比上一轮：RMS '+(dr>=0?'▲ +':'▼ ')+dr.toFixed(2)+'° · 滞后 '+(dl>=0?'▲ +':'▼ ')+dl+' ms',
           'vs last run: RMS '+(dr>=0?'▲ +':'▼ ')+dr.toFixed(2)+'° · lag '+(dl>=0?'▲ +':'▼ ')+dl+' ms')+'</div>';
    }
    localStorage.setItem('cs2at.track', JSON.stringify({rms:rms, lag:lag, gain:gain}));
  }catch(e){}
  const row=(k,v,cls)=>'<tr><th>'+k+'</th><td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td></tr>';
  let body;
  if(!ok){
    body='<div style="font-size:17px;color:var(--acc);margin-bottom:4px">'+L2('结果','Result')+'</div>'+
      '<div style="margin-top:8px;font-size:14px">'+L2('有效样本太少（'+c+' 帧 / '+nlaps+' 圈，至少 6 圈 ≈ '+minSec+' 秒）——跟住目标，再测一轮。','Too few valid samples ('+c+' frames / '+nlaps+' laps, need ≥6 laps ≈ '+minSec+' s) — stay on target and run again.')+'</div>';
  } else {
    const gTxt=(gain>=1?'+':'')+((gain-1)*100).toFixed(1)+'%';
    const ciTxt=isFinite(ci)? (ci*100).toFixed(2)+'%' : '—';
    body='<div style="font-size:17px;color:var(--acc);margin-bottom:4px">'+L2('结果','Result')+'</div>'+
    (rawLockFailed
      ? '<div style="margin-top:6px;font-size:13.5px;color:#f85149">'+L2('⚠️ 本次输入未校准（原始输入锁定失败），增益数值不可比，仅 RMS / 滞后可参考。','⚠️ Raw input lock failed — the gain number is not comparable; only RMS / lag are meaningful.')+'</div>'
      : '')+
    '<table class="rt">'+
    row(L2('跟踪误差 RMS','Tracking error RMS'), rms.toFixed(2)+'°', 'big')+
    row(L2('相位滞后','Phase lag'), lag+' ms')+
    (rawLockFailed? '' : row(L2('速度增益','Speed gain'), gain.toFixed(3)+'（'+gTxt+'）· '+L2('误差 ±','error ±')+ciTxt))+
    row(L2('样本','Samples'), c+L2(' 帧 · ',' frames · ')+nlaps+L2(' 圈',' laps'))+
    '</table>'+
    (prevTxt||'');
  }
  body+=diagLineHtml();
  body+='<div style="margin-top:10px;font-size:13.5px;color:var(--dim)">'+L2('跟枪 ≠ 灵敏度标定：这里测跟枪手感；找灵敏度请用「灵敏度标定」。','Tracking ≠ sensitivity calibration: this measures tracking feel; use Sensitivity calibration to find your sensitivity.')+'</div>';
  resBody.innerHTML=body;
  res.classList.add('show');
}

    '开始':'Start','开 始':'START','参数 ▾':'Parameters ▾','收起参数 ▴':'Hide parameters ▴','继续':'Resume','← 返回':'← Back',
    '结果':'Result',
    '跟踪误差 RMS':'Tracking error RMS','相位滞后':'Phase lag','速度增益':'Speed gain','误差 ±':'error ±','样本':'Samples',
    '帧 · ':' frames · ','圈':' laps',
    '再测一轮':'Run again','复制结果':'Copy result'
  };
  var RULES=[
    [/^有效样本太少（(\d+) 帧 \/ (\d+) 圈，至少 6 圈 ≈ (\d+) 秒）——跟住目标，再测一轮。$/,'Too few valid samples ($1 frames / $2 laps, need ≥6 laps ≈ $3 s) — stay on target and run again.']
  ];
  function tr(t){
    var s=t.trim(); if(!s) return t;
    var m2=s.match(/^(.+?)[:：]$/);
    if(m2&&D[m2[1]]!==undefined) return D[m2[1]]+':';
    if(D[s]!==undefined) return D[s];
    for(var i=0;i<RULES.length;i++){ var r=RULES[i]; if(r[0].test(s)) return s.replace(r[0],r[1]); }
    return s;
  }
  function walk(node){
    if(!node) return;
    var kids=node.childNodes;
    for(var i=0;i<kids.length;i++){
      var k=kids[i];
      if(k.nodeType===3){ var v=k.nodeValue; if(v&&v.trim()) k.nodeValue=tr(v); }
      else if(k.nodeType===1 && k.tagName!=='SCRIPT' && k.tagName!=='STYLE') walk(k);
    }
  }
  walk(document.body);
  try{ document.title='Tracking test · Vernier'; }catch(e){}
  try{
    ['placeholder','title','aria-label'].forEach(function(a){
      document.querySelectorAll('['+a+']').forEach(function(el){
        el.setAttribute(a, tr(el.getAttribute(a)||''));
      });
    });
  }catch(e){}
  try{ updSum(); }catch(e){}
})();
</script>

<!doctype html>
<html lang="zh-CN" data-theme="sand">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>八个字 · Aim Tools</title>
<style>
    html[data-theme="ink"]{--bg:#f7f5f0;--panel:#fffefb;--line:#e2dccf;--txt:#202b2c;--dim:#6d7a7b;--acc:#0f766e;--acc2:#115e59;--gold:#b45309}
  html[data-theme="jade"]{--bg:#101917;--panel:#16211f;--line:#2a3a36;--txt:#efeade;--dim:#93a8a1;--acc:#7fbfa6;--acc2:#5aa78c;--gold:#e0a458}
  html[data-theme="lake"]{--bg:#eef4f6;--panel:#ffffff;--line:#d2e2e7;--txt:#14313a;--dim:#587a85;--acc:#0e7490;--acc2:#0b5f78;--gold:#b7791f}
  html[data-theme="light"]{--bg:#f4f6f9;--panel:#fff;--line:#dde4ed;--txt:#1a2230;--dim:#5b6879;--acc:#2f6feb;--acc2:#1d4ed8;--gold:#b26b00}
  html[data-theme="sand"]{--bg:#f7f2e8;--panel:#fffdf8;--line:#e3d9c6;--txt:#33291c;--dim:#7b6a54;--acc:#c2410c;--acc2:#9a3412;--gold:#a16207}
  html[data-theme="forest"]{--bg:#0f1a14;--panel:#16241b;--line:#2a4433;--txt:#e8f2ea;--dim:#8aa697;--acc:#4ade80;--acc2:#22c55e;--gold:#eab308}
  html[data-theme="mono"]{--bg:#15171b;--panel:#1c1f24;--line:#2e333b;--txt:#e8eaee;--dim:#98a0aa;--acc:#c9d1d9;--acc2:#e5e7eb;--gold:#fbbf24}
  html[data-theme="cyber"]{--bg:#120a1f;--panel:#1b1032;--line:#3a2166;--txt:#f1eaff;--dim:#a98fd6;--acc:#c084fc;--acc2:#a855f7;--gold:#fbbf24}
  html[data-theme="night"]{--bg:#0b0f14;--panel:#151b24;--line:#2a3442;--txt:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--acc2:#3b82f6;--gold:#d29922}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);line-height:1.9;
    font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:64px 24px 96px}
  .back{color:var(--dim);text-decoration:none;font-size:13px}
  .back:hover{color:var(--acc)}
  h1{font-size:22px;font-weight:700;margin:22px 0 6px;letter-spacing:1px}
  .meta{color:var(--dim);font-size:13px;margin-bottom:44px}
  .q,.a{margin:0 0 26px}
  .q{font-size:17px;font-weight:600;color:var(--txt)}
  .q::before{content:"i11usoryCat";display:inline-block;font-size:12px;color:#fff;background:var(--gold);
    border-radius:4px;padding:1px 8px;margin-right:10px;vertical-align:2px;letter-spacing:.3px;
    font-family:"Segoe UI",system-ui,sans-serif}
  .a::before{content:"大肥鱼";display:inline-block;font-size:12px;color:#fff;background:var(--acc);
    border-radius:4px;padding:1px 8px;margin-right:10px;vertical-align:2px;letter-spacing:1px}
  .a{color:var(--txt)}
  .a p{margin:0 0 14px}
  pre{background:color-mix(in srgb,var(--txt) 7%,var(--bg));border-radius:8px;padding:14px 16px;font-size:13.5px;line-height:1.8;
    overflow:auto;color:var(--txt);margin:0 0 16px}
  .quote{border-left:3px solid var(--acc);padding:2px 0 2px 16px;color:var(--dim);
    font-size:15px;margin:22px 0}
  .silent{color:var(--dim);opacity:.55;letter-spacing:6px}
  .end{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--dim);font-size:13px}
  .end b{color:var(--gold)}

  /* 隐藏滚动条（仍可滚动） */
  html{scrollbar-width:none}
  html::-webkit-scrollbar{display:none}
  ::-webkit-scrollbar{width:0;height:0}
</style>
<script>
(function(){
  try{
    var q=new URLSearchParams(location.search).get('theme');
    var t=q||localStorage.getItem('cs2at.theme')||(function(){var d=new Date(),tm=d.getHours()*60+d.getMinutes();return (tm>=1410||tm<460)?'forest':'sand';})();
    document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
})();
</script>
</head>
<body>
<div class="wrap">
  <a class="back" href="app.html#plan">← 返回</a>
  <h1>八个字</h1>
  <div class="meta">2026-10-24 深夜 · 关于要不要加<br><span style="color:var(--dim2)">i11usoryCat 说，大肥鱼 记</span></div>

  <div class="q">若无可能，毋需添多。</div>

<div class="end">
    <b>i11usoryCat</b> 说 · <b>大肥鱼</b> 记 · 2026-10-24 深夜<br>这是站点里藏着的第三个彩蛋
  </div>
</div>
</body>
</html>
